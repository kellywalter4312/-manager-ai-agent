          <div class="pair"><div class="k">Capabilities</div><div class="v">${
            a.capabilities.length?a.capabilities.map(c=>`<span class="chip ${c.tool_available?"on":"off"}">${esc(c.name)}</span>`).join(""):"none"}</div></div>
          <div class="pair"><div class="k">Integrations</div><div class="v">${
            a.tools.length?a.tools.map(t=>`<span class="chip on">${esc(t.name)}</span>`).join(""):"none granted"}</div></div>
          <div class="pair"><div class="k">Surfaces</div><div class="v">${
            (a.interface?.implemented||[]).map(f=>`<span class="chip on">${esc(f)}</span>`).join("")+
            (a.interface?.planned||[]).map(f=>`<span class="chip off">${esc(f)}</span>`).join("")||"chat"}</div></div>
          <div class="pair"><div class="k">Presence</div>
            <div class="v"><span class="pdot ${esc(a.activity||"idle")}"></span>${esc(a.activity||"idle")}</div></div>
          <div class="pair avatar-studio" style="grid-column:1/-1"><div class="k">Avatar Studio — ${esc(a.name)}</div>
            <div class="v">${a.avatar?esc(a.avatar.avatar.label):"—"}</div>
            <div class="dh-sub">Body</div>
            <div class="avatar-picker">${(S.avatar_catalog||[]).map(p=>{
              const on = a.avatar && a.avatar.avatar.avatar_id===p.avatar_id;
              return `<button class="pick${on?" on":""}" data-avatar-agent="${esc(a.name)}"
                data-avatar-id="${esc(p.avatar_id)}" style="--pc:${avatarAccentRgb(p)}"
                ${LIVE?"":" disabled"}>${esc(p.label)}</button>`;
            }).join("")}</div>
            <div class="dh-sub">Presentation</div>
            <div class="dh-fields" data-dh-agent="${esc(a.name)}">${DIGITAL_HUMAN_STYLE_FIELDS.map(f=>{
              const saved = (a.avatar && a.avatar.profile && a.avatar.profile[f]) || "";
              const pending = (DH_PREVIEW[a.name] && DH_PREVIEW[a.name][f]) || "";
              const current = pending || saved;
              const rendered = RENDERED_STYLE_FIELDS.has(f);
              const options = DIGITAL_HUMAN_FIELD_OPTIONS[f];
              // Stage 17.11: a real visual picker for exactly the four
              // dimensions the renderer genuinely draws differently -
              // never a fabricated catalog for the other five, which
              // stay real free-text fields below, honestly labelled "not
              // yet rendered" (Stage 17.6A's own refusal to invent a
              // picker for a field with no defined vocabulary, unchanged
              // for those five). The current value is still shown even
              // here, so a value set before this stage (through the old
              // free-text field, and not one of the three curated
              // options) stays visible rather than silently hidden.
              if(options){
                return `<div class="dh-field">
                  <span class="dh-k">${esc(DIGITAL_HUMAN_FIELD_LABELS[f] || f.replace(/_/g," "))}</span>
                  <div class="dh-options">${options.map(opt => `<button class="pick${
                    current.toLowerCase()===opt?" on":""}" data-dh-agent="${esc(a.name)}"
                    data-dh-field="${esc(f)}" data-dh-value="${esc(opt)}"
                    ${LIVE?"":" disabled"}>${esc(opt)}</button>`).join("")}</div>
                  <span class="dh-current">${current?esc(current):"not configured"}</span>
                </div>`;
              }
              return `<label class="dh-field">
                <span class="dh-k">${esc(f.replace(/_/g," "))}${rendered?"":" · not yet rendered"}</span>
                <input type="text" data-dh-field="${esc(f)}" value="${esc(current)}"
                  placeholder="not configured"${LIVE?"":" disabled"}>
              </label>`;
            }).join("")}
              <button class="dh-save" data-dh-agent="${esc(a.name)}"${LIVE?"":" disabled"}>Save</button>
            </div>
            <div class="dh-roadmap"><span class="dh-k">architecturally reserved · not yet available</span>
              ${AVATAR_STUDIO_ROADMAP.map(g=>`<span class="chip off">${esc(g)}</span>`).join("")}
            </div>
          </div>
          <div class="pair environment-picker" style="grid-column:1/-1"><div class="k">Environment — ${esc(a.name)}</div>
            <div class="v">${a.environment?esc(a.environment.label):"—"}</div>
            <div class="env-picker">${(S.environment_catalog||[]).map(p=>{
              const on = a.environment && a.environment.environment_id===p.environment_id;
              return `<button class="pick${on?" on":""}" data-env-agent="${esc(a.name)}"
                data-env-id="${esc(p.environment_id)}"
                ${LIVE?"":" disabled"}>${esc(p.label)}</button>`;
            }).join("")}</div>
          </div>
        </div>
      </div>`).join("")}
  </div>`;

  V.brain = () => `<div class="slab">

  V.memory = () => `<div class="slab">

  V.status = () => { const b=S.system.heartbeat; return `<div class="slab">

    <p class="intro">What this system runs on rather than any one agent — what is connected,
    what is reachable, and what is honestly missing. This is the technical detail area on

    <div class="band"><div class="head"><span class="t">Environment</span></div>

          <div class="v">${esc(S.speech.describes??S.speech.reason)}</div></div>
      </div></div>
    <div class="band"><div class="head"><span class="t">Heartbeat</span></div>

        <div class="pair"><div class="k">Interval</div><div class="v">${esc(b.interval_minutes)} min</div></div>
        <div class="pair"><div class="k">Last wake</div><div class="v">${esc(when(b.last_wake))}</div></div>

  V.history = () => `<div class="slab">

    <div class="band">${

  // =====================================================================
  // THE PRIVATE AGENT INTERFACE - one surface, every agent.
  //
  // This is not an Alfred screen with Arthur's name substituted in, and it
  // is not a second Agent, Brain, Memory, Voice or Conversation
  // architecture. It receives one *identity* - a name - and renders that
  // agent's own already-canonical data: the same S.agents entry the
  // Control Center, Cognition and the Room all read, the same
  // AvatarProfile/DigitalHumanProfile the Avatar Studio writes and
  // mountAvatarBody3D already draws, the same PresenceRegistry state the
  // room dot already shows, and the same one Conversation exchange()
  // already records. No agent is named anywhere below; a specialist
  // registered tomorrow gets this entire surface with nothing here
  // changing, exactly as it already gets a workspace, a brain band and a
  // room orb.
  //
  // WHAT IT IS NOT: the Conversation Room. That surface stays exactly what
  // it is - the shared space, where the person and several agents are all
  // present at once and anyone may answer. This one is the person and ONE
  // agent. The two are kept apart in wording, in layout and in navigation
  // because collapsing them would destroy the only distinction that makes
  // either of them mean anything.
  // =====================================================================

  // Which agent this interface is currently open for. A name, never an
  // agent object, and resolved in go() (below) before the view renders -
  // the same shape selectedAgent and focusBody already have, and for the
  // same reason: it has to survive a five-second poll's re-render.
  let openAgent = null;

  const agentNamed = name => S.agents.find(a => a.name === name) || null;
  // Falls back to whoever the registry says orchestrates, never to a
  // hardcoded name - manager() is already that lookup.
  const openAgentOf = () => agentNamed(openAgent) || manager();

  // Product wording for a reading the system already made - never a second
  // assessment. assess_cognition decided GREEN/AMBER/RED and the exact
  // mode string, its provider and its reason all stay intact and one click
  // away in Control Center and Cognition, which is where a person goes to
  // ask a technical question. What belongs on the screen a person actually
  // lives on is what that reading means for them.
  const READINESS = {
    GREEN: "reasoning verified",
    AMBER: "reasoning unverified",
    RED:   "reasoning unavailable",
  };
  const readinessOf = brain => READINESS[brain.indicator] || "reasoning unknown";

  // How many capability chips the private interface shows before it says
  // how many more there are. Not a cap on what exists - the real count is
  // printed, and Control Center still lists every one.
  const CONTEXT_CHIP_LIMIT = 12;

  // This agent's own declared role, first sentence only so a one-line
  // label stays one line. The words are the identity document's own -
  // never a role invented on the screen, and never a name.
  const shortRole = a => {
    const stated = String(a.role || "").trim().split(/[.\n]/)[0].trim();
    return stated || (a.is_manager ? "orchestrator" : "specialist");
  };

  // ---- the private thread: a VIEW over the one canonical transcript ----
  // Never a second conversation system, and never a second store. There is
  // exactly one Conversation (src/conversation/conversation.py), written
  // only by exchange(); this reads what is already in it and selects the
  // part that belongs to one person-and-one-agent interaction, the way a
  // mail client shows one thread without owning a second mailbox.
  //
  // The unit is an exchange, which is the shape exchange() itself writes:
  // one utterance from the person, then whoever actually handled it. An
  // exchange belongs in this agent's thread when the person addressed this
  // agent, OR when this agent is the one who actually answered. That
  // second half is what keeps delegation honest rather than hiding it:
  // asking the orchestrator something a specialist handles leaves the real
  // answer in this thread, still attributed to the specialist who gave it,
  // because Response.turn.handled_by - not this function - decided who
  // spoke. Nothing here re-attributes, merges or rewrites a single word.
  function exchanges(){
    const said = (S.conversation && S.conversation.utterances) || [];
    const isAgent = who => S.agents.some(a => a.name === who);
    const out = [];
    for(const u of said){
      if(isAgent(u.speaker) && out.length) out[out.length - 1].replies.push(u);
      else if(isAgent(u.speaker)) out.push({ask: null, replies: [u]});
      else out.push({ask: u, replies: []});
    }
    return out;
  }

  function privateThread(name){
    return exchanges().filter(x =>
      (x.ask && x.ask.addressed === name) || x.replies.some(r => r.speaker === name));
  }

  // One transcript row, rendered from the real utterance. The speaker is
  // always the canonical one the turn reported, never the agent whose
  // interface this happens to be - so a delegated answer reads as the
  // specialist's, said in this thread, which is exactly what happened.
  function privateTurn(u, delegated){
    const agent = S.agents.find(a => a.name === u.speaker);
    const self = !agent;
    const cls = self ? "self" : (agent.is_manager ? "mgr" : "");
    const whoStyle = (agent && !agent.is_manager)
      ? ` style="color:rgb(${identityOf(agent).hue})"` : "";
    const via = delegated ? `<span class="to">answered this</span>` : "";
    return `<div class="turn ${cls}">
      <div class="body">
        <div class="who"${whoStyle}>${esc(u.speaker)}${via}</div>
        <p>${esc(u.text)}</p>
      </div></div>`;
  }

  function privateTurns(name){
    const thread = privateThread(name);
    if(!thread.length){
      // Stage 17.20. A private line that has not been used yet is the
      // FIRST thing a person sees on the first surface this product
      // opens on, and it was one italic grey line pinned to the top of a
      // 500px column of black - which reads as a screen that failed to
      // load, not as a conversation waiting to start. It is now a
      // composed empty state, centred in the space it occupies.
      //
      // Every word in it is either fixed chrome or this agent's own
      // registered data: `summary` is the one its own Interface
      // declares (S.agents[].interface.summary, unchanged, the same
      // string Control Center prints), and when an agent declares none
      // the line is simply absent. Nothing here is invented on the
      // agent's behalf, and no example prompt is put in its mouth.
      const agent = agentNamed(name);
      const summary = (agent && agent.interface && agent.interface.summary) || "";
      return `<div class="opening">
        <div class="mark">${identityGlyph(agent || {name}, 64)}</div>
        <div class="lede">A private line to ${esc(name)}</div>
        ${summary ? `<p class="sum">${esc(summary)}</p>` : ""}
        <div class="void">Nothing said here yet.</div>
      </div>`;
    }
    const rows = [];
    thread.forEach(x => {
      if(x.ask) rows.push(privateTurn(x.ask, false));
      x.replies.forEach(r => rows.push(privateTurn(r, r.speaker !== name)));
    });
    return rows.join("");
  }

  V.agent = () => {
    const a = openAgentOf();
    const id = identityOf(a);
    const state = a.activity || "idle";
    const c = S.conversation;

    // One pill per real, registered agent - the same S.agents roster
    // every other surface draws from, never a list written here. Each is

    // the one navigation path go() already owns.
    const switcher = S.agents.map(x => `<button class="pick${x.name === a.name ? " on" : ""}"
      data-goto="agent" data-agent="${esc(x.name)}"
      style="--pc:${identityOf(x).hue}">${esc(x.name)}</button>`).join("");

      ? privateTurns(a.name)
      : absent("NOTHING OPEN YET", c.reason);

    // outcome rather than the engine. Which engine, what state it is in
    // and the reason it gave all stay in Environment, unchanged.
    const heard = S.speech.usable ? "replies are spoken aloud" : "replies are text only";

    // A person's own screen shows what this agent does, not every
    // keyword its router matches on - the full list is unchanged and
    // still rendered in full by Control Center and Presentation.
    const chips = (items, on) => items.length
      ? items.map(t => `<span class="chip ${on ? "on" : "off"}">${esc(t)}</span>`).join("")

    return `<div class="private">
      <div class="private-env ${esc(state)}" style="--ac:${id.hue}">
        <div class="agent3d" data-avatarbody3d="${esc(a.name)}">
          <div class="agent3d-fallback">preparing presence</div>
        </div>
        <div class="env-veil"></div>
        <div class="env-top">
          <div class="glyphwrap" data-focus="${esc(a.name)}">${identityGlyph(a, 54)}</div>
          <div class="who">
            <div class="nm">${esc(a.name)}</div>
            <div class="rl">${esc(shortRole(a))}<span class="pstate"><span class="pdot ${esc(state)}"></span>${esc(state)}</span></div>
          </div>
          <div class="private-switch"><div class="lab">Private line</div>${switcher}</div>
        </div>

          <div class="private-transcript">${transcript}</div>
          <div class="glass say private-say">${cut}
            <span class="addressed">A private line to ${esc(a.name)}</span>
            <input class="composer" data-to="${esc(a.name)}" placeholder="Message ${esc(a.name)}"${LIVE ? "" : " disabled"}>

        </div>
      </div>

        <div class="pair"><div class="k">Reasoning</div>

        <div class="pair"><div class="k">Memory</div>

  };

  // The surfaces, in two tiers. The first two are the product: one agent
  // in private, and the room where several are present at once. Everything
  // after them is deep observability and configuration - complete,
  // unchanged, one click away, and deliberately quieter (see .mode.deep in
  // the stylesheet) so it stops competing with the agent for the attention
  // a person came here to give it. Nothing was removed; every key this
  // page has ever had is still here, and the labels are what a person
  // reading a screen would call them rather than what a developer
  // debugging one would.
  const MODES = [
    ["agent","Agents","private",           "primary"],
    ["room","Conversation Room","shared",  "primary"],
    ["control","Control Center","system",  "deep"],
    ["workspace","Presentation","appearance","deep"],
    ["brain","Cognition","reasoning",      "deep"],
    ["memory","Memory","retained",         "deep"],
    ["status","Environment","connections", "deep"],
    ["history","Activity","recorded",      "deep"]
  ];

  const stage = document.getElementById("stage");
  const modes = document.getElementById("modes");
  let current = "agent";
  // Stage 17.15 bug fix: whether go() has ever actually rendered a view
  // yet - see its own comment on why this, and not just comparing
  // `current` to the incoming key, is what genuine-navigation detection
  // needs.
  let hasEnteredAnyView = false;

  // =====================================================================
  // GENUINE 3D PRESENTATION — one shared WebGL lifecycle (mountStage),
  // reused by three independent per-agent surfaces: identity (this
  // agent's emblem, in the Workspace view), Brain (in Cognition) and
  // Memory (in Memory). Not Canvas 2D pretending to be 3D. Three.js,
  // vendored locally (ui/vendor/three.module.min.js, MIT-licensed,
  // fetched once and never over the network at runtime -
  // test_the_shell_loads_nothing_from_the_network already forbids a CDN
  // reference and this module never adds one).
  //
  // WHAT THIS OWNS: how one agent's identity, Brain state or Memory
  // state is DRAWN. WHAT IT DOES NOT OWN: whether that agent exists, its
  // real Brain, Memory, Voice, capabilities or connections, or which LLM
  // provider it uses. Every mount function below receives a container
  // and small, already-derived presentation values - an identity
  // descriptor, a GREEN/AMBER/RED signal, a lit count - never the agent
  // object, never `a.brain` or `a.memory` themselves. Reading those real
  // fields to derive the narrow value handed in happens only where this
  // page already reads them for display (the V.brain/V.memory templates
  // and their wire*3D() callers below) - never inside a scene builder.
  //
  // Every agent gets all three stages, manager and specialist alike,
  // because nothing here checks who an agent is - only identityOf()'s
  // `form` for the identity emblem, and the signal/lit values a caller
  // already computed for Brain/Memory. A third agent, or a future
  // Coding/Research/QA specialist, gets the same three stages the same
  // way, with nothing in this block changing.
  // =====================================================================
  let threePromise = null;
  function loadThree(){
    // Dynamic import, not a <script type="module">: it can be called
    // from this ordinary script exactly when needed, with no tag-order
    // dependency. Verified empirically (not assumed) that this fails
    // under file:// - Chromium blocks ES module fetches from a file
    // origin - so a static export opened from disk gets the honest
    // fallback below, never a silent substitute.
    if(!threePromise) threePromise = import("./vendor/three.module.min.js").catch(()=>null);
    return threePromise;
  }

  // ---- AGENT 3D EMBLEMS — the one place a form's geometry is defined. --
  // Replacing an agent's visual later means pointing AGENT_3D_EMBLEMS at
  // a different builder - nothing about the mount/resize/dispose/
  // reduced-motion lifecycle below changes. Each builder receives only
  // (THREE, accentColor) - never the agent, never a name - and returns a
  // THREE.Group. Neither builder below traces or reproduces any existing
  // logo: both are hand-authored compounds of primitive or extruded
  // geometry.

  function buildManagerEmblem(THREE, accent){
    // A stretched octahedron core (a sharp, faceted blade form) flanked
    // by two low-poly cone wing panels - real vertices, real faces, real
    // per-face normals Three.js computes for the standard material's
    // lighting.
    const material = new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.55, roughness: 0.38,
      emissive: accent, emissiveIntensity: 0.16,
    });
    const group = new THREE.Group();
    const core = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), material);
    core.scale.set(0.6, 1.35, 0.6);
    group.add(core);
    const wingGeo = new THREE.ConeGeometry(0.6, 1.7, 3);
    const wingL = new THREE.Mesh(wingGeo, material);
    wingL.rotation.z = Math.PI/2 + 0.34; wingL.position.set(-0.9, -0.1, 0);
    group.add(wingL);
    const wingR = new THREE.Mesh(wingGeo, material);
    wingR.rotation.z = -Math.PI/2 - 0.34; wingR.position.set(0.9, -0.1, 0);
    group.add(wingR);
    return group;
  }

  function buildSpecialistEmblem(THREE, accent){
    // An original angular wing profile - six hand-authored straight
    // edges, swept back and forward-pointed - extruded for real depth
    // and beveled for a second row of facets, then mirrored into a pair
    // either side of a thin faceted spine. Not a trace of any existing
    // wing, bird or bat emblem: one authored polygon, reused by
    // mirroring rather than duplicated by hand.
    const material = new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.62, roughness: 0.3,
      emissive: accent, emissiveIntensity: 0.18,
    });
    const profile = new THREE.Shape();
    profile.moveTo(0, 0);
    profile.lineTo(2.05, 0.55);
    profile.lineTo(1.72, 0.82);
    profile.lineTo(0.78, 0.38);
    profile.lineTo(1.1, 0.86);
    profile.lineTo(0.3, 0.56);
    profile.lineTo(0, 0);
    const wingGeo = new THREE.ExtrudeGeometry(profile, {
      depth: 0.14, bevelEnabled: true, bevelThickness: 0.04,
      bevelSize: 0.04, bevelSegments: 2,
    });
    // Deliberately not centered: the profile's root stays at the mesh's
    // own origin, so mirroring it below produces one pair of wings
    // spreading from a shared point, not two overlapping copies of the
    // same centered shape.

    const group = new THREE.Group();
    const right = new THREE.Mesh(wingGeo, material);
    right.rotation.x = -0.25; right.rotation.z = -0.12;
    group.add(right);
    const left = new THREE.Mesh(wingGeo, material);
    left.scale.x = -1; // a mirrored twin, not a second traced shape
    left.rotation.x = -0.25; left.rotation.z = 0.12;
    group.add(left);
    const spine = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.55, 4), material);
    spine.rotation.x = Math.PI;
    spine.position.set(0, 0.06, 0.06);
    group.add(spine);
    group.position.y = -0.4; // the wing root, not the emblem's centroid, sits at (0,0) above
    return group;
  }

  // ---- BRAIN 3D — an original low-poly node lattice, never traced from ---
  // any copyrighted anatomical reference. A deterministic Fibonacci-sphere
  // placement of nodes (the golden-angle spiral below - a fixed formula,
  // not a randomized scatter, so the same lattice renders identically
  // every time), lit up to `signal` and linked to their two nearest
  // neighbors. `signal` is the exact GREEN/AMBER/RED string
  // `brain.indicator` already computes and the status dot already shows -
  // this draws that reading, it does not decide it, and it never receives
  // `brain` itself.
  // A cortical surface: a sphere whose every vertex is pushed in and out by
  // a fixed sum of sinusoids, which is what actually produces gyri and
  // sulci - ridges and the grooves between them - rather than a smooth
  // ball. Deterministic, from the vertex's own position and nothing else:
  // no random number is drawn, so the same hemisphere folds the same way on
  // every render, and the two hemispheres are mirror images rather than two
  // independent scribbles.
  function _corticalSurface(THREE, rx, ry, rz, fold){
    const geo = new THREE.SphereGeometry(1, 96, 72);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for(let i = 0; i < pos.count; i++){
      v.fromBufferAttribute(pos, i);
      // Stage 17.20: raised in frequency and given a fourth, finer term.
      // At the previous three-term, low-frequency setting the surface
      // rendered as a smooth lumpy mass - a potato, in the honest
      // description - because a gyrus is narrow relative to the organ and
      // these ridges were not. Still a sum of sinusoids of the vertex's
      // own position, so still deterministic and still ridges-with-
      // grooves-between rather than noise.
      const ridges =
        Math.sin(v.y * 14.0 + v.z * 5.5) * 0.5 +
        Math.sin(v.z * 12.0 - v.x * 4.5) * 0.34 +
        Math.sin(v.x * 10.0 + v.y * 7.5) * 0.26 +
        Math.sin(v.y * 23.0 + v.x * 9.0) * 0.13;
      const k = 1 + ridges * fold;
      pos.setXYZ(i, v.x * rx * k, v.y * ry * k, v.z * rz * k);
    }
    geo.computeVertexNormals();
    return geo;
  }

  // ---- COGNITION 3D — a human brain -----------------------------------
  // The previous version of this surface was a lattice of nodes and struts
  // inside a translucent shell: a perfectly good picture of a *network*,
  // and no picture at all of a brain, which is what the surface is called
  // and what a person opening it expects to see. This draws the real thing:
  // two folded cerebral hemispheres separated by a longitudinal fissure, a
  // ridged cerebellum tucked under the back, and a brain stem descending
  // from between them.
  //
  // What it does NOT do is decide anything. `signal` is the GREEN/AMBER/RED
  // indicator assess_cognition already produced - never re-derived here,
  // never inspected for meaning - and its only effect is how many of the
  // activity nodes sitting on the cortex are lit. Half a lit cortex is a
  // Half Brain reported honestly, exactly as the node lattice reported it
  // before; nothing about Full/Half Brain semantics is touched.
  function buildBrainGeometry(THREE, accent, signal){
    const full = signal === "GREEN", half = signal === "AMBER";
    const group = new THREE.Group();

    const corticalMat = new THREE.MeshStandardMaterial({
      // Low roughness on a fold gives every ridge a specular highlight
      // and every sulcus a shadow, which is the whole reason the surface
      // reads as folded rather than as a lumpy ball.
      // Stage 17.20: a warm grey, not a blue-black. Lit by this stage's
      // neutral key the previous colour rendered as cold pale stone,
      // which is most of why the shape read as an object rather than as
      // tissue. The accent still tints it - the emissive term is
      // unchanged - so it still belongs to the agent whose surface it is.
      color: 0x4a3c40, metalness: 0.06, roughness: 0.5,
      emissive: accent, emissiveIntensity: full ? 0.13 : half ? 0.08 : 0.04,
      flatShading: false,
    });

    // Two hemispheres, mirrored, with a real gap between them - the
    // longitudinal fissure is the single feature that most makes a shape
    // read as a brain rather than as a walnut.
    //
    // Stage 17.20 re-proportions them. The previous ellipsoid was taller
    // than it was wide and nearly as wide as it was long, which is a
    // walnut; a cerebrum is markedly longer front-to-back than it is
    // wide, and markedly wider than it is tall. These half-extents put
    // width at about 0.78 of length and height at about 0.60 of it, which
    // is roughly where a real one sits.
    const hemiGeo = _corticalSurface(THREE, 0.3, 0.47, 0.78, 0.075);
    [-1, 1].forEach(side => {
      const hemi = new THREE.Mesh(hemiGeo, corticalMat);
      hemi.position.set(side * 0.36, 0.14, 0);
      hemi.rotation.y = side * 0.1;
      hemi.scale.x = side;   // a true mirror, not a second fold pattern
      group.add(hemi);
    });

    // Stage 17.21: the falx - the dark sheet standing in the midline gap.
    // The hemispheres were already separated, but a gap between two dark
    // masses over a black background is not a groove, it is a hole, and it
    // read as neither. Filling it with a surface that is darker still, and
    // recessed, is what turns the separation into a fissure a person can
    // actually see running front to back over the top of the organ.
    const falx = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 0.34, 1.02),
      new THREE.MeshStandardMaterial({
        color: 0x120d10, metalness: 0.1, roughness: 0.95,
        emissive: accent, emissiveIntensity: 0.02,
      }));
    falx.position.set(0, 0.3, -0.02);
    group.add(falx);

    // Stage 17.20: the temporal lobes. After the fissure and the
    // cerebellum this is the third silhouette cue, and its absence is why
    // the old shape had no profile at all: a cerebrum alone is an egg,
    // and it is the lobe slung low and forward under the Sylvian fissure
    // that makes the outline unmistakable from the side.
    const temporalGeo = _corticalSurface(THREE, 0.2, 0.19, 0.42, 0.085);
    [-1, 1].forEach(side => {
      const temporal = new THREE.Mesh(temporalGeo, corticalMat);
      temporal.position.set(side * 0.4, -0.24, 0.1);
      temporal.rotation.z = side * -0.16;
      temporal.rotation.y = side * 0.06;
      group.add(temporal);
    });

    // The cerebellum: smaller, more tightly folded, tucked below and
    // behind - the second silhouette cue after the fissure.
    const cerebellumGeo = _corticalSurface(THREE, 0.4, 0.23, 0.29, 0.11);
    const cerebellum = new THREE.Mesh(cerebellumGeo, corticalMat);
    cerebellum.position.set(0, -0.34, -0.52);
    group.add(cerebellum);

    // The brain stem, descending from between the hemispheres.
    const stemMat = new THREE.MeshStandardMaterial({
      // Darker and rougher than the cortex, so it recedes under it
      // instead of catching the key light harder than the organ does.
      color: 0x241c20, metalness: 0.05, roughness: 0.88,
      emissive: accent, emissiveIntensity: 0.05,
    });
    // Stage 17.20: shorter, and re-seated against the re-proportioned
    // hemispheres. The old pair descended far enough below a taller
    // cerebrum to read as a stalk, which turned the whole shape into a
    // mushroom - and the frame then cut the stalk off, so it read as one
    // that went on forever.
    // Tucked up between the temporal lobes and in front of the
    // cerebellum, so most of its length is occluded by the organ it
    // belongs to and only the short descending end shows. Standing clear
    // below the mass, the two pieces read from the side as a pair of
    // rectangular pegs rather than as a stem.
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.075, 0.3, 24), stemMat);
    stem.position.set(0, -0.36, -0.14);
    stem.rotation.x = -0.2;
    group.add(stem);
    const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.05, 0.16, 20), stemMat);
    cord.position.set(0, -0.55, -0.18);
    cord.rotation.x = -0.2;
    group.add(cord);
    // A rounded end on the cord. Two truncated cylinders end in a flat
    // disc, and a flat disc lit from above is a bright rectangle - which
    // is what the stem read as: a machined peg under an organ.
    const medulla = new THREE.Mesh(new THREE.SphereGeometry(0.05, 18, 12), stemMat);
    medulla.position.set(0, -0.63, -0.2);
    group.add(medulla);

    // Activity: nodes seated on the cortex, lit only as far as the system
    // actually verified. Deterministically placed on a golden-angle spiral
    // (never random), so the same brain always lights the same sites.
    const N = 22;
    const litCount = full ? N : half ? Math.round(N*0.55) : Math.round(N*0.25);
    const litMat = new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.4, roughness: 0.3,
      emissive: accent, emissiveIntensity: full ? 1.5 : 1.05,
    });
    const dimMat = new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.4, roughness: 0.6,
      emissive: 0x1a2028, emissiveIntensity: 0.14,
    });
    const nodeGeo = new THREE.IcosahedronGeometry(0.032, 0);
    const golden = Math.PI * (3 - Math.sqrt(5));
    for(let i = 0; i < N; i++){
      const y = 1 - (i/(N-1))*1.55;
      const r = Math.sqrt(Math.max(0, 1 - y*y));
      const a = golden * i;
      const node = new THREE.Mesh(nodeGeo, i < litCount ? litMat : dimMat);
      // Seated against the re-proportioned cortex above - the spiral is
      // unchanged, the extents it is scaled by are the hemispheres' own.
      node.position.set(
        Math.cos(a)*r*0.52 * (i % 2 ? 1 : -1) + (i % 2 ? 0.22 : -0.22),
        y*0.5 + 0.16,
        Math.sin(a)*r*0.78,
      );
      group.add(node);
    }

    return group;
  }

  // ---- MEMORY 3D - a filed archive ------------------------------------
  // Stage 17.21 replaces the base metaphor for the second time, and this
  // note records why, because "try another shape" is not a design method.
  //
  // 17.19 drew a faceted core with shards orbiting it: an atom, not a
  // memory. 17.20 turned the orbit into strata threaded on a spindle, and
  // in a browser that read as a coil spring, then - once the strata became
  // solid plates - as a machine part on an axle. The spindle was the
  // problem both times. An axle with things stacked on it is a mechanism,
  // and a mechanism is what a person sees, whatever the plates are called.
  //
  // An archive is not a mechanism. It is FILED: flat layers, laid down in
  // order, each holding records that stand in it, with the older ones
  // underneath and the whole thing enclosed by something that keeps it.
  // So this draws exactly that - a stack of horizontal strata inside a
  // frame, one stratum per slot the store can hold, a standing record card
  // on each stratum that actually holds one, and a thread running from each
  // record down to the one filed before it, which is what makes the stack a
  // continuous store rather than a pile of separate objects. There is no
  // axle anywhere in it.
  //
  // What it reads from is unchanged. `lit` is the real retained count the
  // snapshot already carries, capped at MEMORY_TRACE_CAP - the same cap and
  // the same count memoryGlyph() renders as ring ticks - and `durable` is
  // the real "survives a restart" fact. Neither is a memory, no stratum
  // beyond the real count is ever filled, and nothing here reads, invents
  // or displays anything that was stored.
  function buildMemoryGeometry(THREE, accent, lit, durable){
    const group = new THREE.Group();
    const LAYER = 0.26;                 // vertical pitch, one per slot
    const W = 2.5, D = 1.5;             // a stratum's own footprint
    const base = -(MEMORY_TRACE_CAP * LAYER) / 2;

    // The store itself: what the archive is kept IN, and the one place the
    // durability fact is carried visually. Solid and present when it
    // survives a restart; thin and see-through when it dies with the
    // process. Four corner posts and a floor - an enclosure, deliberately
    // open at the front so the strata inside it are the subject and this
    // is only the thing around them.
    const shellMat = new THREE.MeshStandardMaterial({
      color: 0x060a10, metalness: durable ? 0.72 : 0.4, roughness: durable ? 0.42 : 0.7,
      emissive: accent, emissiveIntensity: durable ? 0.1 : 0.04,
      transparent: !durable, opacity: durable ? 1 : 0.42,
    });
    const height = MEMORY_TRACE_CAP * LAYER + 0.5;
    const core = new THREE.Mesh(new THREE.BoxGeometry(W + 0.34, 0.14, D + 0.3), shellMat);
    core.position.y = base - 0.12;
    group.add(core);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(W + 0.34, 0.1, D + 0.3), shellMat);
    cap.position.y = base + MEMORY_TRACE_CAP * LAYER + 0.18;
    group.add(cap);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sz]) => {
      const spine = new THREE.Mesh(new THREE.BoxGeometry(0.07, height, 0.07), shellMat);
      spine.position.set(sx * (W + 0.24)/2, base + height/2 - 0.12, sz * (D + 0.2)/2);
      group.add(spine);
    });

    // One stratum per slot. A used one is a solid layer with a lit leading
    // edge; an unused one is a thin outline at the same pitch, so real
    // spare capacity stays visible and is never dressed up as content.
    const filledMat = new THREE.MeshStandardMaterial({
      color: 0x0b141d, metalness: 0.55, roughness: 0.44,
      emissive: accent, emissiveIntensity: 0.1,
    });
    const emptyMat = new THREE.MeshStandardMaterial({
      color: 0x0a1016, metalness: 0.25, roughness: 0.88,
      emissive: 0x161d26, emissiveIntensity: 0.45,
    });
    const edgeMat = new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.5, roughness: 0.22,
      emissive: accent, emissiveIntensity: 0.9,
    });
    // A record card, and the thread that files it against the layer below.
    const recordMat = new THREE.MeshStandardMaterial({
      color: 0x0a1622, metalness: 0.6, roughness: 0.26,
      emissive: accent, emissiveIntensity: 1.25,
    });
    const traceMat = new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.4, roughness: 0.5,
      emissive: accent, emissiveIntensity: 0.4,
    });
    const recordGeo = new THREE.BoxGeometry(0.34, 0.17, 0.035);

    const strataY = [];
    for(let i=0;i<MEMORY_TRACE_CAP;i++){
      const y = base + i*LAYER + LAYER/2;
      const filled = i < lit;
      strataY.push(y);
      const ring = new THREE.Mesh(
        filled ? new THREE.BoxGeometry(W, 0.075, D)
               : new THREE.BoxGeometry(W * 0.96, 0.012, D * 0.96),
        filled ? filledMat : emptyMat);
      ring.position.y = y;
      group.add(ring);
      // The lit front edge of a written layer - the one thing that makes
      // the stack read as written-into from the front, the way a filed
      // archive is.
      if(filled){
        const lip = new THREE.Mesh(new THREE.BoxGeometry(W, 0.018, 0.02), edgeMat);
        lip.position.set(0, y + 0.045, D/2);
        group.add(lip);
      }
    }

    // One standing record per memory actually retained. Never one more:
    // an archive that drew its own capacity would be showing a person
    // entries that do not exist.
    for(let i=0;i<lit;i++){
      const y = strataY[i];
      // Deterministic placement across the layer's width, on a golden
      // ratio walk so consecutive records never line up in a column.
      const across = ((i * 0.618) % 1 - 0.5) * (W - 0.5);
      const record = new THREE.Mesh(recordGeo, recordMat);
      record.position.set(across, y + 0.13, D/2 - 0.16);
      record.rotation.y = 0.12 * (i % 2 ? 1 : -1);
      group.add(record);
      // The thread down to the entry filed before this one. Continuity is
      // the whole point of a store, and a stack of unconnected layers does
      // not show it.
      if(i > 0){
        const prev = ((i - 1) * 0.618) % 1 - 0.5;
        const px = prev * (W - 0.5);
        const dx = across - px, dy = y - strataY[i-1];
        const len = Math.hypot(dx, dy);
        const trace = new THREE.Mesh(
          new THREE.CylinderGeometry(0.008, 0.008, len, 6), traceMat);
        trace.position.set((across + px)/2, (y + strataY[i-1])/2 + 0.06, D/2 - 0.2);
        trace.rotation.z = Math.atan2(dx, dy) * -1;
        group.add(trace);
      }
    }

    // A single index marker standing off the front face at the height of
    // the most recent entry - where a retrieval would reach. Absent
    // entirely when nothing has been retained, rather than pointing at an
    // empty shelf.
    if(lit > 0){
      const marker = new THREE.Mesh(new THREE.DodecahedronGeometry(0.1, 0), edgeMat);
      marker.position.set(W/2 + 0.22, strataY[lit-1], D/2 - 0.1);
      group.add(marker);
    }
    return group;
  }

  // ---- ROOM 3D CORE — an original mechanical energy-core, never traced ---
  // from any existing fictional reactor. The Conversation Room is not an
  // agent (it has no Identity/Brain/Memory/Voice of its own), so this
  // takes no identity descriptor at all - only THREE and an accent color,
  // the neutral, pre-existing "room presence" hue the old Canvas 2D
  // decorative rings already used, never one agent's own hue. Purely
  // presentation: the real conversation/delegation state this scene sits
  // above is read nowhere in this function.
  const ROOM_HUE = "200,224,236";
  function buildRoomCore(THREE, accent){
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 1), new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.3, roughness: 0.25,
      emissive: accent, emissiveIntensity: 0.85,
    }));

    // Concentric mechanical rings at different radii and depths, each its
    // own rotation speed (some counter-rotating) - the layered engineering
    // look, never a single flat disc.
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0x0a1016, metalness: 0.75, roughness: 0.32,
      emissive: accent, emissiveIntensity: 0.12,
    });
    const ringSpecs = [
      { radius: 0.58, tube: 0.032, z: 0,     speed: 0.30 },
      { radius: 0.82, tube: 0.028, z: 0.05,  speed: -0.21 },
      { radius: 1.08, tube: 0.026, z: -0.06, speed: 0.15 },
    ];
    const rings = ringSpecs.map(spec=>{
      const ring = new THREE.Mesh(new THREE.TorusGeometry(spec.radius, spec.tube, 10, 48), ringMat);
      ring.position.z = spec.z;
      ring.userData.spin = spec.speed;
      return ring;
    });

    // An inner rotating structural element, spinning against the rings.
    const rotor = new THREE.Mesh(new THREE.OctahedronGeometry(0.44, 0), new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.55, roughness: 0.3,
      emissive: accent, emissiveIntensity: 0.3,
    }));

    // Outer precision segments - a deterministic radial array, not a
    // random scatter, standing in for the "outer precision segments" the
    // design calls for.
    const segMat = new THREE.MeshStandardMaterial({
      color: 0x0a1016, metalness: 0.7, roughness: 0.4,
      emissive: accent, emissiveIntensity: 0.08,
    });
    const SEGMENT_COUNT = 12;
    const segments = new THREE.Group();
    for(let i=0;i<SEGMENT_COUNT;i++){
      const a = (i / SEGMENT_COUNT) * Math.PI * 2;
      const seg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.05), segMat);
      seg.position.set(Math.cos(a)*1.3, Math.sin(a)*1.3*0.55, Math.sin(a*2)*0.04);
      seg.rotation.z = a;
      segments.add(seg);
    }

    return { core, rings, rotor, segments };
  }

  // =====================================================================
  // VISUAL ENVIRONMENT REGISTRY — Phase 5: the seam a future visual
  // upgrade goes through, without touching Identity/Brain/Memory/Voice/
  // Capabilities/Connections/Registry/LLMRouter/provider, or anything
  // below (mountStage's shared camera/lighting/resize/reduced-motion/
  // dispose lifecycle never has to change to support this).
  //
  // A visual environment is exactly {id, version, build} - a name, a
  // small integer, and the one (THREE, accent) function that draws it.
  // Nothing else belongs here: no Brain, no Memory, no provider, no
  // credentials, no capability, no connection. Camera, lighting and the
  // animation loop are already mountStage's job, so `build` only ever
  // supplies geometry/material and returns the per-frame `animate(t)`
  // callback - exactly what every build*() function above already did
  // before this registry existed; this section renames nothing about
  // them, it only gives each one an id and a version a future milestone
  // can inspect, log or replace instead of an anonymous function
  // reference.
  //
  // Which environment an agent gets is still identityOf()'s `form` -
  // unchanged since Phase 2 - never an agent's name. A future agent that
  // needs its own distinct look (a Coding environment, a Research
  // environment) gets there by identityOf() assigning it a new `form`
  // value and one new entry appearing in AGENT_VISUAL_ENVIRONMENTS,
  // never by adding a name check here or in mountStage.
  // =====================================================================
  const AGENT_VISUAL_ENVIRONMENTS = {
    core:    { id: "alfred-tactical-core", version: 1, build: buildManagerEmblem },
    polygon: { id: "specialist-wing-core", version: 1, build: buildSpecialistEmblem },
  };
  const environmentFor = form => AGENT_VISUAL_ENVIRONMENTS[form] || AGENT_VISUAL_ENVIRONMENTS.polygon;

  // Brain, Memory and the Room each have exactly one environment today -
  // not agent-specific, so no lookup table is needed - but the same
  // {id, version, build} shape, so replacing any one of them later is
  // the same operation: point the constant at a new descriptor.
  const BRAIN_VISUAL_ENVIRONMENT  = { id: "brain-human-cortex",     version: 3, build: buildBrainGeometry };
  const MEMORY_VISUAL_ENVIRONMENT = { id: "memory-archive-strata", version: 3, build: buildMemoryGeometry };
  const ROOM_VISUAL_ENVIRONMENT   = { id: "room-energy-core",    version: 1, build: buildRoomCore };

  // ---- DIGITAL HUMAN BODY — Stage 17.5's own real, primitive-geometry ---
  // human-body-style form: a head with two eyes, a torso, two arms and
  // two legs - an original, hand-authored composition of THREE's own
  // primitive geometry, the same "never traced from any existing
  // character, real vertices and faces" discipline
  // buildManagerEmblem/buildSpecialistEmblem already document above.
  // This is the first environment actually driven by a *chosen*
  // AvatarProfile/DigitalHumanProfile rather than by an agent's static
  // identity form - see mountAvatarBody3D below.
  //
  // What genuinely varies the geometry: `accent` (the chosen
  // AvatarProfile's own accent colour - a real, different value per
  // avatar_id, exactly what "avatar selection changes the visible
  // character" requires) and `style.posture` ("seated" measurably
  // shortens and reorients the legs; anything else stands). `style.body`,
  // when non-empty, applies a small, deterministic (never random)
  // proportion variation - the identical "stable hash of an open string,
  // never a semantic interpretation of it" precedent
  // DefaultAvatarProvider.default_for() and
  // WindowsSpeechAdapter's own _select_voice_name() already establish on
  // the Python side. Every other style dimension (clothing/appearance/
  // idle_behavior/listening_behavior/speaking_behavior/expression_style/
  // gesture_style) is still carried through into `style` and
  // `group.userData.style` below - genuinely reaching the renderer,
  // exactly what the DigitalHumanProfile -> renderer contract requires -
  // but not yet mapped to a visible difference: honestly unimplemented
  // rather than faked, because none of them has a defined vocabulary yet
  // for any renderer to act on (see this project's own Stage 17.4
  // report). Only CylinderGeometry/SphereGeometry/IcosahedronGeometry are
  // used - every one already proven available by the builders above;
  // nothing here risks a geometry constructor this vendored build might
  // not ship.
  function _stableUnit(text){
    // A tiny, deterministic string -> [0,1) hash - reproducible, never
    // a randomly-drawn value - reimplemented here only because nothing
    // already exposed to this page's own JS carries the Python side's
    // crc32.
    let h = 0;
    for(const ch of String(text||"")) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    return (h % 1000) / 1000;
  }

  // ---- ANATOMY --------------------------------------------------------
  // One place the figure's own landmark heights live, so a limb, a joint
  // and the feature that sits on it cannot drift apart when one of them
  // is adjusted. The previous body had none of this and showed it: a
  // 0.34-radius head on a 2.2-tall figure is roughly three heads tall -
  // a chibi doll, not a person - with no neck and no shoulders at all,
  // arms pinned straight to the sides of a single barrel torso, and legs
  // that were one undivided cylinder each. Every one of those is a real
  // anatomical part now.
  //
  // Units are the same scene units the old body used and the figure
  // occupies the same overall height, so nothing about the camera, the
  // symbolic backdrop's own placement or any other surface's framing had
  // to change. What changed is how that height is *divided*: ~6.4 heads,
  // feet at the bottom of the frame, mass centred near the origin so the
  // whole figure sits in view rather than floating in the upper half.
  const ANATOMY = {
    footBottom: -1.05, ankle: -0.97, knee: -0.51, hip: -0.01,
    pelvis: 0.06, waist: 0.28, chest: 0.52, shoulder: 0.65,
    neck: 0.77, chin: 0.825, head: 1.00, crown: 1.175,
  };

  function buildHumanoidBody(THREE, accent, style){
    const seated = String((style && style.posture) || "").toLowerCase() === "seated";
    const bodyUnit = (style && style.body) ? _stableUnit(style.body) : 0.5;
    const widthScale = 0.92 + bodyUnit * 0.16; // a modest, real, deterministic range
    // Stage 17.12: height, the second real axis "body proportions" - a
    // genuinely independent deterministic value from the exact same
    // open style.body string (a different hash seed, ":height", never a
    // second field this project would need to migrate), so a curated
    // preset does not silently imply "broad also means taller" or any
    // other stereotype this file never claims. Applied once below as
    // group.scale.y - the whole body stretches together (the same
    // uniform-transform primitive Three.js already provides, no new
    // geometry), never just the legs or torso alone.
    const heightUnit = (style && style.body) ? _stableUnit(style.body + ":height") : 0.5;
    const heightScale = 0.95 + heightUnit * 0.12; // a modest, real, deterministic range
    const A = ANATOMY;

    const skin = new THREE.MeshStandardMaterial({
      color: 0x141a21, metalness: 0.18, roughness: 0.62,
      emissive: accent, emissiveIntensity: 0.1,
    });
    const eyeMat = new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.2, roughness: 0.3,
      emissive: accent, emissiveIntensity: 0.9,
    });

    const group = new THREE.Group();

    // A small helper for the several places an ellipsoid is wanted:
    // baked into the geometry rather than applied as mesh.scale, because
    // mountAvatarBody3D's own speaking animation calls
    // head.scale.setScalar() and a non-uniform mesh scale would be
    // destroyed by it. Only SphereGeometry plus BufferGeometry.scale -
    // no new constructor.
    const ellipsoid = (rx, ry, rz, seg) => {
      const g = new THREE.SphereGeometry(1, seg || 22, (seg || 22) - 6);
      g.scale(rx, ry, rz);
      return g;
    };
    // A limb that pivots from its top end: the geometry is translated so
    // y=0 sits at the joint, which is what lets a shoulder or a knee be a
    // real rotation rather than a repositioning.
    const limb = (rTop, rBottom, len, seg) => {
      const g = new THREE.CylinderGeometry(rTop, rBottom, len, seg || 12);
      g.translate(0, -len/2, 0);
      return g;
    };

    // --- head -----------------------------------------------------------
    // A real cranium: taller than it is wide, deeper than it is broad,
    // and flatter at the back - the proportions of a skull rather than
    // the faceted ball an IcosahedronGeometry(0.34, 1) actually is.
    const head = new THREE.Mesh(ellipsoid(0.145, 0.175, 0.16, 26), skin);
    head.position.y = A.head;
    group.add(head);

    // Stage 17.15: hair is now a real, curated, genuinely-different-
    // geometry choice (see AVATAR_HAIR_STYLES/avatarHairStyleFor()
    // above) rather than one unconditional shape - "none" honestly
    // omits it entirely; any other value, including unset/unrecognised
    // (an already-saved profile that predates this stage), resolves
    // through the registry's own fallback to "short-neat".
    const hairStyleKey = String((style && style.hair_style) || "").toLowerCase();
    if(hairStyleKey !== "none"){
      const hairMat = new THREE.MeshStandardMaterial({
        color: 0x030405, metalness: 0.15, roughness: 0.75,
      });
      group.add(avatarHairStyleFor(hairStyleKey).build(THREE, hairMat));
    }

    const eyeGeo = new THREE.SphereGeometry(0.026, 10, 10);
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.058, 1.035, 0.138);
    group.add(eyeL);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.058, 1.035, 0.138);
    group.add(eyeR);

    // Real, unconditional facial structure beyond the bare head shape.
    // Stage 17.15 established nose, ears and a tapered jaw; this pass
    // adds the two features that actually make a face read at a glance -
    // a brow ridge casting a shadow over the eyes, and cheekbones - and
    // re-anchors all of them to ANATOMY above. Every one reuses the exact
    // same skin material as the head, so they read as part of the face
    // rather than as attached accessories.
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.022, 0.05), skin);
    brow.position.set(0, 1.072, 0.128);
    brow.rotation.x = -0.18;
    group.add(brow);
    const cheekGeo = ellipsoid(0.052, 0.038, 0.045, 12);
    const cheekL = new THREE.Mesh(cheekGeo, skin);
    cheekL.position.set(-0.082, 0.985, 0.104);
    group.add(cheekL);
    const cheekR = new THREE.Mesh(cheekGeo, skin);
    cheekR.position.set(0.082, 0.985, 0.104);
    group.add(cheekR);
    const nose = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.062, 0.055), skin);
    nose.position.set(0, 0.998, 0.152);
    nose.rotation.x = 0.16;
    group.add(nose);
    const earGeo = ellipsoid(0.014, 0.042, 0.03, 12);
    const earL = new THREE.Mesh(earGeo, skin);
    earL.position.set(-0.146, 1.012, -0.008);
    group.add(earL);
    const earR = new THREE.Mesh(earGeo, skin);
    earR.position.set(0.146, 1.012, -0.008);
    group.add(earR);
    // Genuinely tapered - a wide jawline narrowing into a chin, never a
    // uniform cylinder relabelled as a jaw.
    const jaw = new THREE.Mesh(new THREE.CylinderGeometry(0.132, 0.072, 0.16, 14), skin);
    jaw.position.set(0, 0.888, 0.022);
    group.add(jaw);

    // Stage 17.14: glasses - real geometry, never text pretending to be
    // one, but genuinely conditional (unlike hair above): only when
    // ``appearance`` is curated to "glasses". Two flat lenses plus a
    // bridge, all from BoxGeometry, positioned just in front of the eyes.
    const appearanceKey = String((style && style.appearance) || "").toLowerCase();
    if(appearanceKey === "glasses"){
      const glassesMat = new THREE.MeshStandardMaterial({
        color: 0x05070a, metalness: 0.5, roughness: 0.25,
        emissive: accent, emissiveIntensity: 0.25,
      });
      const lensGeo = new THREE.BoxGeometry(0.062, 0.044, 0.014);
      const lensL = new THREE.Mesh(lensGeo, glassesMat);
      lensL.position.set(-0.058, 1.035, 0.158);
      group.add(lensL);
      const lensR = new THREE.Mesh(lensGeo, glassesMat);
      lensR.position.set(0.058, 1.035, 0.158);
      group.add(lensR);
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.012, 0.014), glassesMat);
      bridge.position.set(0, 1.035, 0.158);
      group.add(bridge);
    }

    // Stage 17.7: a real mouth primitive - its own dim material (never
    // the eyes' own bright emissive, so it reads as a mouth rather than a
    // third eye) - present so a generic "talking" animation has an actual
    // feature to move. Deliberately NOT lip-sync; see
    // mountAvatarBody3D's own comment on why.
    const mouthMat = new THREE.MeshStandardMaterial({
      color: 0x05070a, metalness: 0.1, roughness: 0.7,
      emissive: accent, emissiveIntensity: 0.15,
    });
    const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.062, 0.02, 0.03), mouthMat);
    mouth.position.set(0, 0.928, 0.136);
    group.add(mouth);

    // --- neck ------------------------------------------------------------
    // The part the old body simply did not have. A head floating directly
    // on a barrel is most of why it read as a toy.
    const neck = new THREE.Mesh(
      new THREE.CylinderGeometry(0.062, 0.078, A.chin - A.shoulder + 0.06, 14), skin);
    neck.position.y = (A.chin + A.shoulder)/2 + 0.02;
    group.add(neck);

    // --- torso: chest, waist, pelvis, shoulders ---------------------------
    // Three tapering sections instead of one cylinder, so the figure has
    // a ribcage, a narrower waist and hips - the silhouette that reads as
    // a body. `torso` (the chest) keeps the name mountAvatarBody3D's own
    // animation already reads from userData.
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(
      0.20*widthScale, 0.165*widthScale, A.shoulder - A.waist + 0.1, 16), skin);
    torso.position.y = (A.shoulder + A.waist)/2 + 0.02;
    torso.scale.z = 0.72;
    group.add(torso);
    const waist = new THREE.Mesh(new THREE.CylinderGeometry(
      0.165*widthScale, 0.175*widthScale, A.waist - A.pelvis + 0.14, 16), skin);
    waist.position.y = (A.waist + A.pelvis)/2;
    waist.scale.z = 0.72;
    group.add(waist);
    const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(
      0.175*widthScale, 0.155*widthScale, 0.2, 16), skin);
    pelvis.position.y = A.pelvis - 0.06;
    pelvis.scale.z = 0.74;
    group.add(pelvis);
    // A real shoulder line, plus a deltoid on each side - the second
    // thing the old body had none of, and the reason its arms looked
    // stuck on rather than hung.
    const clavicle = new THREE.Mesh(new THREE.CylinderGeometry(
      0.055, 0.055, 0.46*widthScale, 12), skin);
    clavicle.rotation.z = Math.PI/2;
    clavicle.position.y = A.shoulder;
    group.add(clavicle);
    const deltoidGeo = ellipsoid(0.085, 0.075, 0.075, 14);
    [-1, 1].forEach(side => {
      const d = new THREE.Mesh(deltoidGeo, skin);
      d.position.set(side*0.25*widthScale, A.shoulder - 0.01, 0);
      group.add(d);
    });

    // Stage 17.14: real clothing geometry - a second, slightly larger
    // shell in a genuinely different (never skin-toned) cloth material,
    // layered over the torso above, present only when ``clothing`` is
    // curated to "fitted" or "casual" (empty/unrecognised stays bare).
    // "fitted" adds a pair of thin accent-emissive trim strips near the
    // collar; "casual" instead widens the leg geometry below into looser
    // trousers - two genuinely different silhouettes, never the same
    // mesh relabelled.
    const clothingKey = String((style && style.clothing) || "").toLowerCase();
    if(clothingKey === "fitted" || clothingKey === "casual"){
      const shirtMat = new THREE.MeshStandardMaterial({
        color: 0x1c2530, metalness: 0.1, roughness: 0.8,
        emissive: accent, emissiveIntensity: 0.06,
      });
      const shirt = new THREE.Mesh(new THREE.CylinderGeometry(
        0.215*widthScale, 0.19*widthScale, A.shoulder - A.pelvis + 0.16, 16), shirtMat);
      shirt.position.y = (A.shoulder + A.pelvis)/2;
      shirt.scale.z = 0.74;
      group.add(shirt);
      if(clothingKey === "fitted"){
        const trimMat = new THREE.MeshStandardMaterial({
          color: 0x05070a, metalness: 0.3, roughness: 0.3,
          emissive: accent, emissiveIntensity: 1.1,
        });
        const trimGeo = new THREE.BoxGeometry(0.13, 0.014, 0.02);
        const trimL = new THREE.Mesh(trimGeo, trimMat);
        trimL.position.set(-0.075*widthScale, A.shoulder - 0.06, 0.145);
        trimL.rotation.z = 0.5;
        group.add(trimL);
        const trimR = new THREE.Mesh(trimGeo, trimMat);
        trimR.position.set(0.075*widthScale, A.shoulder - 0.06, 0.145);
        trimR.rotation.z = -0.5;
        group.add(trimR);
      }
    }
    const legWidthMul = clothingKey === "casual" ? 1.35 : 1;

    // --- arms: shoulder, upper arm, elbow, forearm, hand -----------------
    // Stage 17.6B gave each arm its own shoulder pivot Group so a gesture
    // could be a real rotation. This pass gives the arm something to
    // rotate: two segments and a hand, hinged at a real elbow, instead of
    // one straight 0.62-long cylinder. The pivot itself, its resting
    // rotation.z and group.userData.arms are unchanged, so every existing
    // gesture animation keeps working exactly as it did.
    const upperArmGeo = limb(0.055, 0.045, 0.33, 10);
    const foreArmGeo = limb(0.045, 0.036, 0.3, 10);
    const handGeo = ellipsoid(0.042, 0.062, 0.03, 12);
    // The resting angle each shoulder hangs at. Stage 17.5 through 17.17
    // used 0.2/-0.2, which was right for a body whose arms grew straight
    // out of the sides of a barrel: they had to be swung outward to clear
    // it. This body has real shoulders and deltoids for them to hang from,
    // so a smaller angle is the anatomically correct resting pose - and it
    // is still exactly what mountAvatarBody3D reads back as `restZ` and
    // eases every gesture home to, which is the property the animation
    // actually depends on.
    const ARM_REST_Z = 0.11;
    const buildArm = (side) => {
      const pivot = new THREE.Group();
      pivot.position.set(side*0.25*widthScale, A.shoulder - 0.01, 0);
      const upper = new THREE.Mesh(upperArmGeo, skin);
      pivot.add(upper);
      const elbow = new THREE.Group();
      elbow.position.y = -0.33;
      elbow.rotation.x = 0.12;
      const fore = new THREE.Mesh(foreArmGeo, skin);
      elbow.add(fore);
      const hand = new THREE.Mesh(handGeo, skin);
      hand.position.y = -0.34;
      elbow.add(hand);
      pivot.add(elbow);
      return { pivot, arm: upper };
    };
    const builtL = buildArm(-1), builtR = buildArm(1);
    const armPivotL = builtL.pivot, armL = builtL.arm;
    const armPivotR = builtR.pivot, armR = builtR.arm;
    armPivotL.rotation.z = ARM_REST_Z;
    armPivotR.rotation.z = -ARM_REST_Z;
    armPivotL.add(armL);
    armPivotR.add(armR);
    group.add(armPivotL);
    group.add(armPivotR);

    // --- legs: thigh, knee, shin, foot -----------------------------------
    // The old legs were one cylinder each, ending in nothing. These hinge
    // at a real knee and stand on real feet, which is most of what makes
    // a standing figure look like it is standing.
    const thighGeo = limb(0.088*legWidthMul, 0.072*legWidthMul, A.hip - A.knee, 12);
    const shinGeo = new THREE.CylinderGeometry(0.1*legWidthMul, 0.09*legWidthMul, seated ? 0.34 : 0.46, 10);
    shinGeo.scale(0.72, 1, 0.72);
    shinGeo.translate(0, -(seated ? 0.34 : 0.46)/2, 0);
    const footGeo = new THREE.BoxGeometry(0.085, 0.055, 0.19);
    const legs = [-1, 1].map(side => {
      const hipPivot = new THREE.Group();
      hipPivot.position.set(side*0.085, A.hip, 0);
      const thigh = new THREE.Mesh(thighGeo, skin);
      hipPivot.add(thigh);
      const kneePivot = new THREE.Group();
      kneePivot.position.y = A.knee - A.hip;
      const shin = new THREE.Mesh(shinGeo, skin);
      kneePivot.add(shin);
      const foot = new THREE.Mesh(footGeo, skin);
      foot.position.set(0, -(seated ? 0.34 : 0.46) - 0.028, 0.055);
      kneePivot.add(foot);
      hipPivot.add(kneePivot);
      if(seated){
        // A real seated pose: thighs forward from the hip, shins down
        // from the knee - a genuinely different silhouette, not the same
        // legs shortened.
        hipPivot.rotation.x = -Math.PI/2.1;
        kneePivot.rotation.x = Math.PI/2.1;
      }
      group.add(hipPivot);
      return hipPivot;
    });

    // Every configured dimension genuinely reaches the renderer - held
    // here for a future, richer builder to read even where this one does
    // not yet draw it, and for the blink/speak animation below to reach
    // without a second data path.
    group.userData.style = style || {};
    group.userData.eyes = [eyeL, eyeR];
    group.userData.head = head;
    group.userData.arms = [armPivotL, armPivotR];
    group.userData.mouth = mouth;
    group.userData.torso = torso;
    group.userData.legs = legs;
    // Stage 17.12: real, visible height variation - the whole body
    // scaled together, so nothing individually stretches out of
    // proportion with anything else.
    group.scale.y = heightScale;
    return group;
  }
  const AVATAR_BODY_VISUAL_ENVIRONMENTS = {
    humanoid: { id: "avatar-humanoid-body", version: 1, build: buildHumanoidBody },
  };
  // Stage 17.11: the one small extension seam a future body/avatar pack
  // needs - the identical registry-plus-fallback shape environmentFor()
  // above already established for identity emblems, keyed here by
  // AvatarProfile.body_type (already a real field - see
  // src/providers/avatar.py) instead of an agent's static form. A new
  // body geometry pack is one new AvatarProvider entry (already fully
  // governed - see src/providers/avatar_factory.py, the same name-keyed factory
  // celebration/calendar/connection providers already use) supplying a
  // new body_type, plus one new key here; every existing agent's own
  // humanoid body is unaffected, and an unrecognised body_type honestly
  // falls back to the one body this renderer can actually draw today -
  // never a crash, never a fabricated second shape - exactly like
  // environmentFor()'s own fallback to polygon.
  const avatarBodyEnvironmentFor = bodyType =>
    AVATAR_BODY_VISUAL_ENVIRONMENTS[String(bodyType || "").toLowerCase()] || AVATAR_BODY_VISUAL_ENVIRONMENTS.humanoid;

  // ---- SYMBOLIC ENVIRONMENT — Stage 17.13's own agent visual-identity ---
  // backdrop: a large, original, hand-authored 3D object placed behind
  // the human body, never part of it - buildHumanoidBody()'s own group
  // is never touched by either builder below, and neither is ever added
  // as a child of it (see mountAvatarBody3D's own comment on why: two
  // separate sibling groups in the same scene, the concept this stage's
  // own brief calls out as genuinely distinct from the body mesh).
  // Every shape below is built from the identical proven-available
  // primitive constructors (BoxGeometry/CylinderGeometry)
  // buildHumanoidBody already uses - no copied logo, no external asset,
  // no texture file, only original stylized geometry, exactly what this
  // stage's own brief requires.
  // Both builders below take a second `depth` argument: how far back the
  // furthest layer is pushed. A symbolic environment is a *space* the
  // agent stands in, not a badge pinned behind its head, so each is built
  // as several parallel layers receding into the scene rather than as one
  // flat plate - real parallax when the camera's own slow drift moves,
  // real occlusion between layers, and a genuine sense of a large form
  // standing well behind a figure.
  //
  // Materials are deliberately dark and only faintly emissive at the
  // back, brightening toward the front edge. The previous versions were
  // uniformly emissive at 0.55-0.6, which is why they rendered as flat
  // cyan slabs that swallowed the figure standing in front of them - the
  // exact "the symbolic environment must not obscure the human" failure.
  // Here the near edges carry the accent and the mass stays dark, so the
  // human reads in front of a large shape instead of against a wall of
  // light.
  // A symbolic environment is read as a SILHOUETTE, and a silhouette needs
  // something to be a silhouette against. Two earlier attempts in this pass
  // failed for the same reason: dark geometry lit by the scene's own lights,
  // floating in front of a black background, has no outline at all - it is
  // just a scatter of mid-tone panels, and the human standing in front of it
  // competes with the noise instead of reading in front of a shape.
  //
  // So each environment now builds its own backdrop: an unlit cyclorama dome
  // enclosing the scene, graded from a dim accent glow at the horizon to
  // near-black overhead, with the emblem in near-black in front of it. The
  // emblem's outline is then genuinely visible, the human is genuinely in
  // front of the emblem, and the depth order the brief asks for -
  // environment, then human, then conversation - is real geometry rather
  // than a claim.
  function _symbolicDome(THREE, accent, radius){
    const geo = new THREE.SphereGeometry(radius, 40, 28);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const horizon = accent.clone().multiplyScalar(0.42);
    for(let i = 0; i < pos.count; i++){
      // A vertical grade: brightest a little below the equator, falling
      // away above and below it. Deterministic, from the vertex's own
      // height - no texture, no image, no external asset.
      const y = pos.getY(i) / radius;
      const k = Math.max(0, 1 - Math.abs(y + 0.18) * 1.5);
      colors[i*3]     = horizon.r * k + 0.014;
      colors[i*3 + 1] = horizon.g * k + 0.022;
      colors[i*3 + 2] = horizon.b * k + 0.034;
    }
    geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      vertexColors: true, side: THREE.BackSide, depthWrite: false,
    }));
  }

  function _silhouetteMaterial(THREE, accent, depthTone){
    // A true silhouette: black, fully metallic and fully rough. A metal
    // has no diffuse response at all and a fully rough one scatters its
    // specular away to nothing, so the scene's own key and rim lights -
    // which are there for the human - cannot wash this shape out. What
    // remains is its outline against the dome behind it, which is what a
    // silhouette is. `depthTone` lifts the layers nearest the camera by a
    // hair so overlapping parts of the same form still separate.
    return new THREE.MeshStandardMaterial({
      color: 0x000000, metalness: 1, roughness: 0.98,
      emissive: accent, emissiveIntensity: 0.006 + depthTone * 0.022,
    });
  }

  // A flat panel that pivots about one END rather than its middle - what
  // makes a fan of them read as one continuous swept surface instead of a
  // staircase of separate boxes.
  function _sweptPanel(THREE, mat, length, width, thickness){
    const g = new THREE.BoxGeometry(length, width, thickness);
    g.translate(length/2, 0, 0);
    return new THREE.Mesh(g, mat);
  }

  // A membrane swept along a parametric outline. Two samples of the outline
  // become one quad - four real vertices at the outline's own upper and
  // lower edge - written straight into a BufferGeometry, so the assembled
  // surface has a genuinely smooth curved upper edge and a genuinely smooth
  // scalloped lower one.
  //
  // The first version of this built the strip out of axis-aligned boxes
  // instead, and the result was visibly stepped: a box can only be a
  // rectangle, so every sample left a stair on both edges and the wing read
  // as a bar chart. Real vertices are the fix, and they are no less
  // hand-authored than the boxes were - the outline function is still the
  // only thing that decides the shape.
  function _membrane(THREE, mat, steps, edge, side, z, thickness){
    const verts = [];
    const push = (x, y) => verts.push(side * x, y, z);
    for(let i = 0; i < steps; i++){
      const a = edge(i/steps), b = edge((i+1)/steps);
      // Two triangles per sample, wound so the quad faces the camera on
      // whichever side it is mirrored to.
      push(a.x, a.top); push(b.x, b.top); push(b.x, b.bot);
      push(a.x, a.top); push(b.x, b.bot); push(a.x, a.bot);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(verts), 3));
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.material.side = THREE.DoubleSide;
    return mesh;
  }

  // ---- ALFRED-CLASS: a bat-inspired cavern -----------------------------
  // Original geometry throughout - no traced logo, no external asset, no
  // texture, and nothing copied from any published artwork.
  //
  // Stage 17.21 turns this from an emblem into an ENVIRONMENT. Up to 17.20
  // it was one wing pair, one cowl and one set of ribs, all on a single
  // plane at one depth: a large badge, and in a browser it read as exactly
  // that - a flat cut-out whose scalloped bottom edge looked more like a
  // distant mountain range than like anything bat-inspired.
  //
  // What makes a space a space is parallax: the same form repeated at
  // several real depths, at different scales, moving at different rates,
  // so the eye is given something near to measure something far against.
  // So this now builds THREE layers - a vast far arch well behind the
  // figure, the main wing span at mid depth, and a pair of angular near
  // buttresses standing between the camera and the figure at the edges of
  // the frame - plus a ground running back to meet the far one. The
  // figure stands inside that, rather than in front of a picture of it.
  function buildBatmanEmblem(THREE, accent, depth){
    const back = depth || 3.4;
    const group = new THREE.Group();
    group.add(_symbolicDome(THREE, accent, 18));

    const near = _silhouetteMaterial(THREE, accent, 1);
    const mid = _silhouetteMaterial(THREE, accent, 0.45);
    const far = _silhouetteMaterial(THREE, accent, 0.12);

    // The wing outline. `u` runs from the shoulder (0) to the tip (1).
    // Wider than it was, so at mid depth the span runs past both edges of
    // any frame this environment is ever given.
    const edge = u => {
      const x = 0.6 + u * 8.6;
      // Rises off the shoulder, crests around a third of the way out,
      // then falls away to the tip.
      const top = 3.1 + Math.sin(Math.PI * Math.min(1, u*1.15)) * 1.1 - u*u*3.0;
      // Depth below the upper edge: deep at the root, tapering to nothing
      // at the tip, with four scallops cut along the way.
      const taper = Math.pow(1 - u, 0.85);
      const scallop = 0.62 + 0.38 * Math.abs(Math.sin(Math.PI * u * 4.2));
      return { x, top, bot: top - 5.4 * taper * scallop };
    };

    // One wing span, at whatever depth and material it is asked for. The
    // same outline every time - a far echo of a near shape is the same
    // shape, which is exactly what makes the depth read.
    const span = (z, mat, ribMat, ribs) => {
      const wing = new THREE.Group();
      [-1, 1].forEach(side => {
        wing.add(_membrane(THREE, mat, 96, edge, side, z, 0.26));
        if(!ribs) return;
        // Ribs over the membrane, one per scallop crest, so the wing has
        // visible structure rather than being one flat sheet.
        [0.06, 0.29, 0.53, 0.76, 0.95].forEach(u => {
          const e = edge(u);
          const len = Math.hypot(e.x - 0.6, e.top - 3.1) + 0.4;
          const rib = _sweptPanel(THREE, ribMat, len, 0.16, 0.2);
          rib.position.set(side*0.6, 3.1, z + 0.28);
          const ang = Math.atan2(e.top - 3.1, e.x - 0.6);
          rib.rotation.z = side < 0 ? Math.PI - ang : ang;
          wing.add(rib);
        });
      });
      return wing;
    };

    // FAR: a vast arch, well behind everything, scaled up and dimmed. The
    // wall of the space rather than an object in it.
    const farSpan = span(-back * 3.1, far, far, false);
    farSpan.scale.set(2.1, 1.7, 1);
    farSpan.position.y = 1.4;
    group.add(farSpan);

    // MID: the main span, at the depth the figure is lit against.
    const midSpan = span(-back * 2.05, mid, mid, true);
    group.add(midSpan);

    // The cowl. Stage 17.21 rebuilt it: the previous tall cone under a
    // ball, seen at this distance, read as a vase standing behind the
    // agent's shoulder. A bat reads from the head's PROPORTION - broad and
    // low, far wider than it is tall - and from the two ears above it, so
    // that is what this is now. It also sits much nearer than the wing
    // span, at the depth a head belongs relative to a pair of wings, which
    // is what puts it directly behind the figure instead of drifting off
    // to one side under parallax.
    const cowlZ = -back * 1.15;
    const cowlGroup = new THREE.Group();
    const crown = new THREE.Mesh(new THREE.SphereGeometry(1, 26, 18), mid);
    crown.scale.set(1.5, 0.78, 0.6);
    crown.position.set(0, 2.5, cowlZ);
    cowlGroup.add(crown);
    // The jaw: wider than deep, tucked under the brow.
    const cowl = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 0.62, 1.2, 20), mid);
    cowl.scale.set(1.15, 1, 0.55);
    cowl.position.set(0, 1.55, cowlZ);
    cowlGroup.add(cowl);
    // Two ears, swept up and out - the single most recognisable part of
    // the whole form, so they are long, angular and unmistakably a pair.
    [-1, 1].forEach(side => {
      for(let i = 0; i < 8; i++){
        const horn = new THREE.Mesh(
          new THREE.BoxGeometry(0.46 - i*0.052, 0.5, 0.34), mid);
        horn.position.set(side*(0.62 + i*0.13), 3.1 + i*0.44, cowlZ);
        horn.rotation.z = side * (0.1 + i*0.03);
        cowlGroup.add(horn);
      }
    });
    group.add(cowlGroup);

    // NEAR: angular buttresses standing between the camera and the figure,
    // out at the edges. Nothing about this form is soft, so these are
    // hard-edged slabs raked inward - and being genuinely nearer than the
    // figure is what makes the mid span read as far.
    const nearGroup = new THREE.Group();
    [-1, 1].forEach(side => {
      for(let i = 0; i < 3; i++){
        const slab = new THREE.Mesh(
          new THREE.BoxGeometry(0.62 + i*0.2, 9.5 - i*0.9, 0.6), near);
        slab.position.set(side*(4.6 + i*0.85), 0.6 - i*0.3, -back*0.3 - i*0.85);
        slab.rotation.z = side * (0.05 + i*0.03);
        nearGroup.add(slab);
      }
    });
    group.add(nearGroup);

    // The ground, running back from under the figure to meet the far arch,
    // so the space has a floor rather than ending in black.
    const ground = new THREE.Mesh(new THREE.BoxGeometry(46, 0.4, 34), far);
    ground.position.set(0, -1.5, -back * 2.2);
    group.add(ground);

    // Each layer moves at its own rate. That is the parallax, and it is
    // also the "slowly moving" this environment is asked for - nothing
    // here turns fast enough to read as a spinning prop.
    group.userData.rotor = true;
    group.userData.spinRate = 0.045;
    group.userData.animate = t => {
      midSpan.rotation.y = Math.sin(t * 0.045) * 0.19;
      cowlGroup.rotation.y = Math.sin(t * 0.045) * 0.08;
      cowlGroup.position.y = Math.sin(t * 0.033) * 0.09;
      farSpan.rotation.y = Math.sin(t * 0.026 + 1.1) * 0.10;
      farSpan.position.x = Math.sin(t * 0.021) * 0.8;
      nearGroup.rotation.y = Math.sin(t * 0.062 + 2.2) * 0.05;
      nearGroup.position.y = Math.sin(t * 0.05) * 0.16;
    };
    return group;
  }

  // ---- ARTHUR-CLASS: a wing-inspired flight hall -----------------------
  // A completely independent form, not a recolour of the one above, and
  // built to read as its opposite gesture. The other form is a heavy mass
  // whose membranes fall outward and DOWN from a broad cowl inside a
  // cavern of raked slabs; this is a light structure whose wings sweep
  // outward and UP from a slim spar, out of many narrow feather slats, in
  // an open hall of concentric rings. It has no cowl and no horns at all,
  // and the other has no ring anywhere. Side by side they are one closing
  // shape and one opening one. Original geometry; no external asset.
  //
  // Stage 17.21 gives it the same three-layer depth treatment, because
  // "an environment, not an emblem" is a rule about this surface, not a
  // decision about one agent.
  function buildNightwingEmblem(THREE, accent, depth){
    const back = depth || 3.4;
    const group = new THREE.Group();
    group.add(_symbolicDome(THREE, accent, 18));

    const near = _silhouetteMaterial(THREE, accent, 1);
    const mid = _silhouetteMaterial(THREE, accent, 0.4);
    const far = _silhouetteMaterial(THREE, accent, 0.1);

    // The wing outline sweeps UP and out, and grows toward the tip rather
    // than tapering - the opposite profile to the other wing.
