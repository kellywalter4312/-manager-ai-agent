  // ---- the Digital Human form: free-text style dimensions, never the --
  // avatar itself (that stays .avatar-picker above) - Stage 17.6A's own
  // beginning of a real user-facing presentation editor, extended by
  // Stage 17.11's .dh-options pickers above for the fields that
  // genuinely render. Only the fields a person actually typed something
  // into, plus whatever DH_PREVIEW already holds from the pickers, are
  // sent - a blank text field never overwrites a previously-chosen
  // value with nothing (the same partial-merge contract
  // set_digital_human_style() itself already enforces server-side).
  function wireDigitalHumanForm(){
    if(!LIVE) return;
    stage.querySelectorAll(".dh-save").forEach(btn=>{
      btn.addEventListener("click", async () => {
        const agent = btn.dataset.dhAgent;
        const group = btn.closest(".dh-fields");
        const fields = Object.assign({}, DH_PREVIEW[agent]);
        group.querySelectorAll("[data-dh-field]").forEach(input=>{
          const v = input.value.trim();
          if(v) fields[input.dataset.dhField] = v;
        });
        if(Object.keys(fields).length === 0) return;
        btn.disabled = true;
        let ok = false;
        try{
          const res = await fetch("profile", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({agent, fields}),
          });
          ok = res.ok;
        }catch(e){ /* refreshFromLive() below shows whatever the real state now is either way */ }
        // Only a confirmed write clears the local preview - an unsaved
        // pick must not silently vanish just because the request failed.
        if(ok) delete DH_PREVIEW[agent];
        await refreshFromLive();
        // refreshFromLive()'s own go()/wireAvatarBody3D() reuses the
        // already-running stage rather than rebuilding it (see
        // wireStages' own comment) - a real, saved posture/body change
        // would otherwise never actually appear. One more explicit
        // rebuild, now from the just-confirmed server profile, is what
        // makes Save genuinely visible rather than merely persisted.
        _restyleAvatarBodyPreview(agent);
      });
    });
  }

  // ---- live refresh: the same seam, asked again ------------------------
  // A file opened from disk has no clock; a served page does. If this page
  // is being served (not opened from file://), this asks the same
  // snapshot.json contract scripts/serve_ui.py exposes and redraws with
  // whatever the system actually reports. A failed read - offline, or this
  // being the static export after all - just keeps the last good reading
  // on screen. It never substitutes a guess for it.
  async function refreshFromLive(){
    let fresh;
    try{
      const res = await fetch("snapshot.json", {cache:"no-store"});
      if(!res.ok) return;
      fresh = await res.json();
    }catch(e){ return; }
    if(!fresh || typeof fresh.version !== "number" || !Array.isArray(fresh.agents)) return;

    const rosterChanged = JSON.stringify(S.agents.map(a=>a.name))
      !== JSON.stringify(fresh.agents.map(a=>a.name));
    S = fresh;
    renderChrome();
    const view = stage.querySelector(".view");
    const scrollTop = view ? view.scrollTop : 0;
    // A draft in progress must survive a background poll - only a poll
    // this page's own composer triggered clears the box, and it already
    // did that itself before sending.
    const draft = stage.querySelector(".say input.composer")?.value ?? "";
    go(current);
    const redrawn = stage.querySelector(".view");
    if(redrawn) redrawn.scrollTop = scrollTop;
    const newInput = stage.querySelector(".say input.composer");
    if(newInput && draft) newInput.value = draft;
    if(rosterChanged) build();
  }

  // ---- ambient voice activation (Stage 8A) ------------------------------
  // A page-lifetime singleton, deliberately defined and started OUTSIDE
  // go()/wireComposer(): both of those re-run on every navigation click and
  // every five-second refreshFromLive() poll (see setInterval below), and
  // anything created inside either would build a new SpeechRecognition
  // instance - and a new set of its event listeners - every single time.
  // This function runs its setup exactly once, guarded a second way below
  // by window.__alfredVoice, so even a stray second call is a no-op.
  //
  // Activation phrases are read from the snapshot's own agents[].activation
  // - the same document-driven identity the Python side resolves them from
  // - never a hardcoded list here. Recognized speech is sent to the exact
  // same POST /message a typed line already uses (see wireComposer above),
  // so a voice turn and a typed turn reach the same Manager the same way.
  function initVoiceActivation(){
    if(!LIVE) return;                    // never in the static export
    if(window.__alfredVoice) return;     // singleton guard - never wired twice
    window.__alfredVoice = true;

    const indicator = document.getElementById("voice-toggle");
    if(!indicator) return;
    const label = indicator.querySelector(".voice-label");
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Three states, never a boolean - the same rule the Python side's
    // Availability already lives under (src/channels/speech.py). UNKNOWN
    // is what this reads as before the button has ever been clicked;
    // UNAVAILABLE below is structural for this browser and permanent for
    // this page load, not a placeholder waiting to be replaced.
    const LABELS = {
      idle: "SAY THE WAKE PHRASE", activated: "ACTIVATED", listening: "LISTENING",
      thinking: "THINKING…", speaking: "SPEAKING…", unavailable: "NO MIC ENGINE",
    };
    let phase = "idle";
    function setPhase(next, title){
      phase = next;
      indicator.className = "voice-toggle " + next;
      if(label) label.textContent = LABELS[next] || next.toUpperCase();
      if(title) indicator.title = title;
    }

    if(!Recognition){
      // Honest and permanent: this browser has no speech engine, exactly
      // the position src/channels/speech.py's NoSpeech already documents
      // for the Python side - not a bug, not a retry candidate.
      setPhase("unavailable", "This browser has no speech recognition engine.");
      return;
    }

    function normalise(text){
      return String(text||"").trim().toLowerCase().replace(/[.!?,]+$/,"");
    }

    // Re-read on every check rather than captured once, so a live roster
    // change - a specialist added, an identity document edited - is picked
    // up on the next utterance with nothing here re-run.
    function activationPhrases(){
      const mgr = manager();
      const activation = mgr && mgr.activation;
      return (activation && activation.declared) ? activation.phrases : [];
    }

    function speak(text){
      if(!("speechSynthesis" in window) || !text){ return; }
      try{
        window.speechSynthesis.cancel(); // never two answers talking over each other
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      }catch(e){ /* the written answer already reached the room via refreshFromLive */ }
    }

    async function sendTurn(text){
      setPhase("thinking");
      let data = null;
      try{
        const res = await fetch("message", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text}),
        });
        data = res.ok ? await res.json().catch(()=>null) : null;
      }catch(e){ data = null; }
      setPhase("speaking");
      speak(data && data.outcome ? data.outcome : "I have nothing to report for that.");
      await refreshFromLive();
      setPhase("listening");
    }

    // The activation gate itself - IDLE only matches the configured
    // phrase; every other phase treats what was heard as the next turn of
    // an already-active conversation, exactly VoiceActivationSession's own
    // hear_activation()/turn() split (src/channels/activation.py).
    function handleUtterance(transcript){
      if(phase === "idle"){
        if(activationPhrases().includes(normalise(transcript))) setPhase("activated");
        return;
      }
      if(phase === "activated" || phase === "listening") sendTurn(transcript);
    }

    let recognizer = null;
    // Stage 10: a bound on the restart loop below. A browser ending a
    // recognition session after an ordinary pause is normal and this loop
    // must resume it - but a microphone that is genuinely broken can end a
    // session immediately, every time, which without a bound would be an
    // uncontrolled background loop restarting as fast as the browser allows.
    // A real result (onresult) proves the engine is genuinely working and
    // resets the count; only *quick, consecutive* end-without-a-result
    // events count against the limit.
    let quickRestarts = 0;
    let startedAt = 0;
    const MAX_QUICK_RESTARTS = 5;
    const QUICK_RESTART_WINDOW_MS = 2000;

    function startListening(){
      if(recognizer) return; // idempotent, the same rule start() follows in Python
      recognizer = new Recognition();
      recognizer.continuous = true;
      recognizer.interimResults = false;
      recognizer.onresult = (event) => {
        quickRestarts = 0; // genuine evidence the engine works - forgive past restarts
        const last = event.results[event.results.length - 1];
        if(last && last.isFinal) handleUtterance(last[0].transcript);
      };
      recognizer.onerror = (event) => {
        // "no-speech" and "aborted" are ordinary silence, not a failure.
        if(event.error !== "no-speech" && event.error !== "aborted"){
          setPhase("unavailable", "microphone error: " + event.error);
        }
      };
      recognizer.onend = () => {
        // Some browsers end a recognition session after a pause. Restarting
        // resumes the SAME ambient session rather than starting a second
        // one - continuous listening, not one utterance.
        const wasRecognizer = recognizer;
        recognizer = null;
        if(!window.__alfredVoice || !wasRecognizer) return;
        quickRestarts = (Date.now() - startedAt < QUICK_RESTART_WINDOW_MS) ? quickRestarts + 1 : 0;
        if(quickRestarts >= MAX_QUICK_RESTARTS){
          // Stop retrying and say so honestly, rather than spinning forever
          // on a microphone that is not genuinely usable.
          setPhase("unavailable", "microphone stopped responding after repeated restarts");
          return;
        }
        startListening();
      };
      startedAt = Date.now();
      try{ recognizer.start(); if(phase === "unavailable") setPhase("idle"); }
      catch(e){ setPhase("unavailable", "microphone could not be started"); }
    }

    // A browser will not grant microphone access without a user gesture,
    // so the first click is both that permission gesture and this page's
    // one and only start() call - after which listening is continuous and
    // no further click is required between turns.
    indicator.addEventListener("click", startListening);
    setPhase("idle");
  }

  if(!S){
    stage.innerHTML = `<div class="view on"><div class="slab">${
      absent("NO SIGNAL","no system data was embedded in this page")}</div></div>`;
  } else {
    let deepStarted = false;
    MODES.forEach(([k,label,cap,tier])=>{
      const b=document.createElement("button");
      // "tier-start" marks the one boundary between the product surfaces
      // and the deep ones, so the rule separating them is drawn once by
      // CSS rather than by a hardcoded index here.
      const boundary = tier==="deep" && !deepStarted;
      if(boundary) deepStarted = true;
      b.className = "mode" + (tier==="deep" ? " deep" : "") + (boundary ? " tier-start" : "");
      b.dataset.k=k;
      b.innerHTML=`<span class="lbl">${label}</span><span class="cap">${cap}</span>`;
      b.addEventListener("click",()=>go(k));
      modes.appendChild(b);
    });
    renderChrome();
    // The private agent interface is where a person starts, not the
    // system dashboard - the one change that decides what this product
    // is on the screen a person opens first. A remembered choice still
    // wins, exactly as it always has.
    let start="agent";
    try{ const v=localStorage.getItem("alfred.mode"); if(v&&V[v]) start=v; }catch(e){}
    go(start);

    if(LIVE) setInterval(refreshFromLive, 5000);
    initVoiceActivation();
  }

  // =====================================================================
  // THE ENVIRONMENT
  //
  // A real 3D field: bodies carry x/y/z, are rotated by a slow camera and
  // projected with a perspective divide, so depth is genuine rather than
  // painted. Near bodies are larger, brighter and move more; far ones sink
  // into the fog. The interface sits inside this space rather than on it.
  //
  // WHAT IS REAL: how many bodies there are, which are agents, which is the
  // manager, and which agent a surface is focused on. All from the snapshot.
  //
  // WHAT IS DECORATIVE: the drift, the camera orbit, the breathing. These
  // are atmosphere. They are NOT a visualisation of activity, because the
  // system produces no activity state - and animating one would be the
  // screen inventing a fact. When a real producer exists, `body.energy`
  // below is where it attaches.
  // =====================================================================
  const cv = document.getElementById("scene"), gx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0,DPR=1,bodies=[],links=[],t=0,px=0,py=0,tx=0,ty=0;

  function build(){
    DPR = Math.min(devicePixelRatio||1, 2);
    W = cv.width = innerWidth*DPR; H = cv.height = innerHeight*DPR;
    cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";

    bodies = []; links = [];
    const agents = S ? S.agents : [];
    const mgrIndex = agents.findIndex(a=>a.is_manager);

    // The orchestrator sits at the origin of the system.
    if(agents.length){
      bodies.push({
        x:0,y:0,z:0,r:5.4,kind:"manager",name:agents[mgrIndex]?.name,
        identity:identityOf(agents[mgrIndex]), energy:0
      });
    }
    // Specialists orbit it, each an independent body at its own depth.
    agents.filter((a,i)=>i!==mgrIndex).forEach((a,i,arr)=>{
      const ang = (i/Math.max(arr.length,1))*Math.PI*2;
      bodies.push({
        x:Math.cos(ang)*260, y:Math.sin(ang)*95, z:Math.sin(ang*1.7)*190,
        r:3.6, kind:"agent", name:a.name, identity:identityOf(a), energy:0
      });
    });
    // Quiet structure so the space has volume. Scenery, not claims.
    const filler = Math.min(150, 58 + Math.round(innerWidth/12));
    for(let i=0;i<filler;i++){
      const a=Math.random()*Math.PI*2, rad=170+Math.random()*760;
      bodies.push({
        x:Math.cos(a)*rad, y:(Math.random()-.5)*430, z:Math.sin(a)*rad,
        r:.5+Math.random()*1.15, kind:"dust", energy:0,
        dx:(Math.random()-.5)*.055, dy:(Math.random()-.5)*.045, dz:(Math.random()-.5)*.055
      });
    }
    // Real relationships: the manager is connected to each specialist,
    // because the registry says so.
    const named = bodies.filter(b=>b.kind!=="dust");
    for(let i=1;i<named.length;i++) links.push([named[0],named[i],true]);
  }

  addEventListener("pointermove",e=>{
    tx=(e.clientX/innerWidth-.5); ty=(e.clientY/innerHeight-.5);
  },{passive:true});

  function focusOn(key){
    focus = (key==="control") ? null : key;
  }

  function project(b, rot, zoom, camX=0, camY=0){
    const cs=Math.cos(rot), sn=Math.sin(rot);
    const x = b.x*cs - b.z*sn - camX, z = b.x*sn + b.z*cs, y = b.y - camY;
    const d = 900, f = d/(d + z + 620);
    if(f<=0.02) return null;
    return {
      sx: W/2 + (x + px*140)*f*zoom*DPR,
      sy: H/2 + (y + py*90)*f*zoom*DPR + (focus? H*0.06 : 0),
      f
    };
  }

  // ---- body geometry: angular, not a plain dot -----------------------
  // Alfred is a fixed, faceted core - a tactical instrument, not a bat
  // logo. Specialists are simple polygons, each one's side-count chosen
  // the same deterministic way its color is. Geometry only: it draws what
  // a body already is (real, from the registry via S.agents), never a
  // fact about it - the same body, same link, same real/decorative split
  // as before.
  function polygon(sides, sx, sy, r, rot){
    gx.beginPath();
    for(let i=0;i<sides;i++){
      const a = rot + (i/sides)*Math.PI*2;
      const x = sx+Math.cos(a)*r, y = sy+Math.sin(a)*r;
      i===0 ? gx.moveTo(x,y) : gx.lineTo(x,y);
    }
    gx.closePath();
  }
  function facetedCore(sx, sy, r, rot){
    gx.beginPath();
    for(let i=0;i<16;i++){
      const a = rot + (i/16)*Math.PI*2;
      const rad = r * (i%2===0 ? 1 : 0.5);
      const x = sx+Math.cos(a)*rad, y = sy+Math.sin(a)*rad;
      i===0 ? gx.moveTo(x,y) : gx.lineTo(x,y);
    }
    gx.closePath();
  }

  function frame(){
    if(!still) t += .0016;
    px += (tx-px)*.045; py += (ty-py)*.045;
    const rot = t;
    // A camera, not a fact: when a real body is focused, the same
    // rotation everything else uses is applied to find where that body
    // currently sits, and the whole scene is shifted so it stays centred
    // and large. The body itself never moves to a special position - the
    // camera looks at it, exactly as looking at something in a room does
    // not move the room.
    const target = focusBody ? bodies.find(b=>b.kind!=="dust" && b.name===focusBody) : null;
    let camX=0, camY=0, zoom = focus ? .62 : .86;
    if(target){
      const cs=Math.cos(rot), sn=Math.sin(rot);
      camX = target.x*cs - target.z*sn;
      camY = target.y;
      zoom = 2.4;
    }
    gx.clearRect(0,0,W,H);

    for(const b of bodies){
      if(b.kind==="dust" && !still){ b.x+=b.dx; b.y+=b.dy; b.z+=b.dz;
        if(Math.abs(b.x)>1000) b.dx*=-1; if(Math.abs(b.y)>240) b.dy*=-1;
        if(Math.abs(b.z)>1000) b.dz*=-1; }
      b.p = project(b, rot, zoom, camX, camY);
    }

    // The room's own presence: a neutral, undyed core around whatever sits
    // at the origin - present only while the room is the active surface,
    // and never colored by any one agent's identity. It represents the
    // shared space itself, not a participant.
    if(current==="room"){
      const origin = bodies.find(b=>b.kind==="manager");
      if(origin && origin.p){
        const {sx,sy,f} = origin.p;
        for(let ring=6; ring>=1; ring--){
          gx.beginPath(); gx.arc(sx,sy,f*(38+ring*15)*DPR,0,7);
          gx.strokeStyle=`rgba(200,224,236,${.06*f/ring})`; gx.lineWidth=.7*DPR; gx.stroke();
        }
      }
    }

    // Structural links: real relationships between real agents.
    for(const [a,b] of links){
      if(!a.p||!b.p) continue;
      const depth=(a.p.f+b.p.f)/2;
      const g = gx.createLinearGradient(a.p.sx,a.p.sy,b.p.sx,b.p.sy);
      g.addColorStop(0,`rgba(125,216,232,${.30*depth})`);
      g.addColorStop(1,`rgba(143,182,200,${.20*depth})`);
      gx.strokeStyle=g; gx.lineWidth=Math.max(.45,depth*1.15)*DPR;
      gx.beginPath(); gx.moveTo(a.p.sx,a.p.sy); gx.lineTo(b.p.sx,b.p.sy); gx.stroke();
    }

    // Proximity threads through the dust give the field volume.
    const dust = bodies.filter(b=>b.kind==="dust" && b.p);
    const reach = 132*DPR;
    for(let i=0;i<dust.length;i++){
      for(let j=i+1;j<dust.length;j++){
        const a=dust[i],b=dust[j];
        const dx=a.p.sx-b.p.sx, dy=a.p.sy-b.p.sy;
        if(Math.abs(dx)>reach||Math.abs(dy)>reach) continue;
        const d=Math.hypot(dx,dy);
        if(d<reach){
          const depth=(a.p.f+b.p.f)/2;
          gx.strokeStyle=`rgba(140,170,225,${(1-d/reach)*.085*depth})`;
          gx.lineWidth=.4*depth*DPR;
          gx.beginPath(); gx.moveTo(a.p.sx,a.p.sy); gx.lineTo(b.p.sx,b.p.sy); gx.stroke();
        }
      }
    }

    for(const b of bodies){
      if(!b.p) continue;
      const {sx,sy,f}=b.p;
      const breathe = still?1:1+Math.sin(t*90+ (b.x+b.z)*.01)*.12;
      const r = b.r*f*breathe*DPR;
      if(b.kind==="dust"){
        gx.beginPath(); gx.arc(sx,sy,r,0,7); gx.fillStyle=`rgba(150,178,232,${.30*f})`; gx.fill();
        continue;
      }
      // The body's identity says what to draw and what color to draw it -
      // one presentation descriptor, resolved once in build(), read here.
      const id = b.identity || {hue:"143,182,200", form:"polygon", sides:4};
      const col = id.hue;
      const halo = gx.createRadialGradient(sx,sy,0,sx,sy,r*11);
      halo.addColorStop(0,`rgba(${col},${.20*f})`);
      halo.addColorStop(1,`rgba(${col},0)`);
      gx.fillStyle=halo; gx.beginPath(); gx.arc(sx,sy,r*11,0,7); gx.fill();

      if(id.form==="core"){
        // A fixed, faceted core - the composition's one still point, not
        // one more orbiting dot and not a plain filled circle.
        for(let ring=3; ring>=1; ring--){
          gx.beginPath(); gx.arc(sx,sy,r*(1.6+ring*.85),0,7);
          gx.strokeStyle=`rgba(${col},${.16*f/ring})`; gx.lineWidth=.8*DPR; gx.stroke();
        }
        facetedCore(sx, sy, r*1.7, t*1.3);
        gx.fillStyle=`rgba(5,7,10,${.92*f})`; gx.fill();
        gx.strokeStyle=`rgba(${col},${.95*f})`; gx.lineWidth=1*DPR; gx.stroke();
        gx.beginPath(); gx.arc(sx,sy,r*.6,0,7);
        gx.fillStyle=`rgba(${col},${.95*f})`; gx.fill();
      } else {
        // A specialist: a simple polygon, its own side-count and color -
        // its own form, never Alfred's.
        polygon(id.sides||4, sx, sy, r*2, t*0.7 + hashOf(b.name)*0.001);
        gx.fillStyle=`rgba(${col},${.85*f})`; gx.fill();
        gx.strokeStyle=`rgba(${col},${.4*f})`; gx.lineWidth=.7*DPR; gx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }

  addEventListener("resize", build);
  build(); frame();
})();
</script>
