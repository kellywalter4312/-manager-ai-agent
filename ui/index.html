    const edge = u => {
      const x = 0.9 + u * 8.2;
      const top = 2.5 + Math.pow(u, 0.75) * 3.6;
      const depthBelow = 0.55 + u * 1.9;
      return { x, top, bot: top - depthBelow };
    };

    const span = (z, mat, slatMat, slats) => {
      const wing = new THREE.Group();
      [-1, 1].forEach(side => {
        wing.add(_membrane(THREE, mat, 80, edge, side, z, 0.2));
        if(!slats) return;
        // Feather slats laid across the membrane - many, narrow and
        // progressively longer, the texture that makes this a feathered
        // wing rather than a skin one.
        for(let i = 0; i < 11; i++){
          const u = 0.05 + i * 0.088;
          const e = edge(u);
          const len = 1.7 + i*0.46;
          const slat = _sweptPanel(THREE, slatMat, len, 0.13, 0.16);
          slat.position.set(side*(e.x*0.34 + 0.5), e.bot + 0.15, z + 0.32 - i*0.02);
          const ang = 0.34 + i*0.05;
          slat.rotation.z = side < 0 ? Math.PI - ang : ang;
          wing.add(slat);
        }
      });
      return wing;
    };

    // FAR: an open arc of concentric rings, receding. Where the other
    // environment closes into a cavern, this one opens into a hall.
    const farGroup = new THREE.Group();
    for(let i = 0; i < 4; i++){
      const arc = new THREE.Mesh(
        new THREE.TorusGeometry(6.5 + i*2.6, 0.16 + i*0.05, 8, 60), far);
      arc.position.set(0, 1.6 + i*0.5, -back * (2.4 + i*0.8));
      arc.rotation.x = 0.06 * i;
      farGroup.add(arc);
    }
    group.add(farGroup);

    // MID: the wing span, plus the slim spar and ring it grows from.
    const midSpan = span(-back * 2.05, mid, mid, true);
    group.add(midSpan);

    const spar = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.34, 7.6, 16), near);
    spar.position.set(0, 1.7, -back * 2.05 - 0.5);
    midSpan.add(spar);
    // Counterweights at the spar's foot, so the silhouette has a base and
    // does not simply stop in mid-air.
    [-1, 1].forEach(side => {
      const weight = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.4, 0.4), near);
      weight.position.set(side*0.85, -1.7, -back * 2.05 - 0.5);
      weight.rotation.z = side * 0.22;
      midSpan.add(weight);
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.09, 10, 48), near);
    ring.position.set(0, 3.7, -back * 2.05 - 0.4);
    midSpan.add(ring);
    const ringInner = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.055, 10, 40), mid);
    ringInner.position.set(0, 3.7, -back * 2.05 - 0.4);
    midSpan.add(ringInner);

    // NEAR: slim pylons nearer than the figure, at the frame edges -
    // upright and thin, where the other environment's near layer is raked
    // and heavy.
    const nearGroup = new THREE.Group();
    [-1, 1].forEach(side => {
      for(let i = 0; i < 3; i++){
        const pylon = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14 - i*0.03, 0.22 - i*0.04, 9.5 - i*1.4, 12), near);
        pylon.position.set(side*(5.0 + i*1.1), 1.0 - i*0.4, -back*0.3 - i*0.9);
        pylon.rotation.z = side * (-0.03 - i*0.02);
        nearGroup.add(pylon);
      }
    });
    group.add(nearGroup);

    // A floor of its own, wider and further out than the other's.
    const ground = new THREE.Mesh(new THREE.BoxGeometry(52, 0.3, 40), far);
    ground.position.set(0, -1.7, -back * 2.4);
    group.add(ground);

    group.userData.rotor = true;
    group.userData.spinRate = 0.055;
    group.userData.animate = t => {
      // The opposite gesture in motion too: this one breathes open and
      // shut about its own spar rather than swinging as one mass.
      midSpan.rotation.y = Math.sin(t * 0.055 + 0.7) * 0.13;
      midSpan.rotation.z = Math.sin(t * 0.037) * 0.022;
      farGroup.rotation.z = Math.sin(t * 0.019) * 0.09;
      farGroup.children.forEach((arc, i) => {
        arc.rotation.z = t * (0.012 + i*0.006) * (i % 2 ? -1 : 1);
      });
      nearGroup.position.y = Math.sin(t * 0.043 + 1.6) * 0.2;
    };
    return group;
  }

  const AVATAR_SYMBOLIC_ENVIRONMENTS = {
    "batman-emblem":    { id: "symbolic-batman-emblem",    version: 1, build: buildBatmanEmblem },
    "nightwing-emblem": { id: "symbolic-nightwing-emblem", version: 1, build: buildNightwingEmblem },
  };
  // Stage 17.13: the one small extension seam a future symbolic
  // environment needs - the identical registry-plus-honest-fallback
  // shape environmentFor()/avatarBodyEnvironmentFor() above already
  // establish, except the fallback here is null (no symbol), never a
  // default shape - a symbolic backdrop is optional decoration, unlike
  // a body, which every avatar genuinely needs one of. A future agent's
  // own completely different symbol is one new curated
  // DIGITAL_HUMAN_FIELD_OPTIONS.symbolic_environment value plus one new
  // key here - never a change to mountAvatarBody3D's own call site.
  const symbolicEnvironmentFor = key =>
    AVATAR_SYMBOLIC_ENVIRONMENTS[String(key || "").toLowerCase()] || null;

  // ---- HAIR — Stage 17.15's own small, curated, genuinely-different- ----
  // geometry vocabulary. Each builder takes the one shared hair
  // material (never re-invented per style) and returns real geometry -
  // the identical registry-plus-honest-fallback shape every other
  // rendered dimension in this file already uses (see
  // avatarBodyEnvironmentFor()'s own comment). "none" is deliberately
  // not a key here at all - the same "a real absence, not a
  // placeholder" contract symbolicEnvironmentFor() already has.
  function buildHairShortNeat(THREE, hairMat){
    // Re-anchored onto the rebuilt cranium (see ANATOMY above) and given
    // a higher subdivision so it reads as a smooth cap rather than a
    // faceted lump at the size the head actually is now.
    const hair = new THREE.Mesh(new THREE.IcosahedronGeometry(0.158, 2), hairMat);
    hair.position.set(0, 1.048, -0.012);
    hair.scale.set(1.05, 0.8, 0.92);
    return hair;
  }

  function buildHairShortTextured(THREE, hairMat){
    // A genuinely different silhouette from the smooth cap above - five
    // small angled boxes fanned across the top of the head, reading as
    // a rougher, textured cut - never the same mesh relabelled.
    const group = new THREE.Group();
    [
      [-0.072, 1.088, 0.028, -0.15], [0, 1.104, 0.012, 0], [0.072, 1.088, 0.028, 0.15],
      [-0.045, 1.072, -0.068, -0.1], [0.045, 1.072, -0.068, 0.1],
    ].forEach(([x, y, z, rot]) => {
      const strand = new THREE.Mesh(new THREE.BoxGeometry(0.058, 0.046, 0.082), hairMat);
      strand.position.set(x, y, z);
      strand.rotation.z = rot;
      group.add(strand);
    });
    return group;
  }

  const AVATAR_HAIR_STYLES = {
    "short-neat":     { id: "hair-short-neat",     version: 1, build: buildHairShortNeat },
    "short-textured": { id: "hair-short-textured", version: 1, build: buildHairShortTextured },
  };
  const avatarHairStyleFor = key =>
    AVATAR_HAIR_STYLES[String(key || "").toLowerCase()] || AVATAR_HAIR_STYLES["short-neat"];

  // ---- SHARED 3D STAGE LIFECYCLE — the one mount/resize/dispose/reduced- -
  // motion implementation behind every surface above and the identity
  // emblem below. `stagesMap` is that surface's own running-stage tracker
  // (agent3DStages / brain3DStages / memory3DStages / avatarBody3DStages -
  // shared between surfaces, so an agent can have a running identity,
  // Brain and Memory stage simultaneously, alongside the Room's own
  // single core stage, without any of them touching another's renderer).
  // `sceneBuilder(THREE, scene, accent)` adds this surface's own geometry
  // to the given scene and returns `animate(elapsedSeconds)`, called once
  // per frame unless reduced motion is active.
  function disposeStage(stagesMap, key){
    const s = stagesMap.get(key);
    if(!s) return;
    if(s.raf) cancelAnimationFrame(s.raf);
    if(s.ro) s.ro.disconnect();
    if(s.renderer) s.renderer.dispose();
    stagesMap.delete(key);
  }

  function agent3DFallback(container, text){
    let el = container.querySelector(".agent3d-fallback");
    if(!el){
      el = document.createElement("div");
      el.className = "agent3d-fallback";
      container.appendChild(el);
    }
    el.textContent = text;
  }

  async function mountStage(container, stagesMap, key, hueRgb, sceneBuilder){
    const THREE = await loadThree();
    if(!container.isConnected) return; // the view moved on while awaiting
    if(!THREE){ agent3DFallback(container, "3D ENVIRONMENT UNAVAILABLE"); return; }

    let renderer;
    // preserveDrawingBuffer: WebGL drops its buffer right after
    // presenting by default, so a read (a screenshot, a future "save
    // this view" feature) taken between frames can see a stale or
    // cleared buffer rather than what was actually last drawn. A modest,
    // deliberate cost for a scene this simple.
    try{ renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true}); }
    catch(e){ agent3DFallback(container, "3D ENVIRONMENT UNAVAILABLE"); return; }

    const fb = container.querySelector(".agent3d-fallback");
    if(fb) fb.remove();
    container.appendChild(renderer.domElement);

    const [rr,gg,bb] = hueRgb.split(",").map(Number);
    const accent = new THREE.Color(rr/255, gg/255, bb/255);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(0, 0.35, 5.4);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0x0d1420, 1.5));
    const keyLight = new THREE.DirectionalLight(accent, 1.7);
    keyLight.position.set(2.6, 3, 2.2);
    scene.add(keyLight);
    const fill = new THREE.DirectionalLight(0x2a3a4a, 0.55);
    fill.position.set(-3, -1.4, -2);
    scene.add(fill);

    const animate = sceneBuilder(THREE, scene, accent);

    // Stage 17.20: fit the camera to what the scene actually built.
    //
    // The fixed camera above is the whole reason these surfaces looked
    // wrong in a browser rather than in source. A PerspectiveCamera's FOV
    // is *vertical*, so a fixed position frames by height alone - and
    // Cognition and Memory are drawn in a panel roughly 1060x300, an
    // aspect near 3.5. Every one of them was therefore clipped top and
    // bottom (the brain stem and the memory core were cut off by the
    // frame edge) while two thirds of the panel's width stayed empty
    // black. Measured, not guessed: see tests/test_stage17_20_*.py, which
    // reads the rendered pixels back out of a real headless browser.
    //
    // A scene builder opts in by naming the one object that must stay
    // wholly in frame (`scene.userData.frame`). Deliberately not the
    // whole scene: the Digital Human's symbolic environment is *meant*
    // to run past the edges, so the avatar stage frames the figure and
    // lets its backdrop overflow. A builder that names nothing keeps the
    // fixed camera exactly as it was - mountAgent3D is
    // untouched by this.
    const _box = new THREE.Box3(), _size = new THREE.Vector3(), _mid = new THREE.Vector3();
    function frameCamera(){
      const target = scene.userData.frame;
      if(!target) return;
      scene.updateMatrixWorld(true);
      _box.setFromObject(target);
      if(_box.isEmpty()) return;
      _box.getSize(_size);
      _box.getCenter(_mid);
      // These groups turn on Y while they animate, so the horizontal
      // half-extent has to be the larger of width and depth - fitting to
      // the pose that happens to exist at build time is how a shape ends
      // up clipping itself a few seconds later.
      const halfW = Math.max(_size.x, _size.z) / 2, halfH = _size.y / 2;
      const margin = scene.userData.frameMargin || 1.12;
      const vFov = camera.fov * Math.PI / 180;
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      // The fit is to the subject's mid-plane; the depth term is a
      // fraction of the half-extent rather than all of it. Padding by the
      // full half-depth is the strictly-uncroppable answer and it costs
      // about a third of the subject's on-screen size, because it assumes
      // the nearest point of the shape is also its tallest - which for
      // every shape on these stages it is not. Checked against the real
      // rendered pixels at each breakpoint, not reasoned about.
      const dist = Math.max(halfH / Math.tan(vFov / 2), halfW / Math.tan(hFov / 2)) * margin
                 + halfW * 0.42;
      // Stage 17.21: an optional horizontal bias, expressed as a
      // fraction of the frustum's own visible width at the subject's
      // depth - so it means the same thing at every panel size. This is
      // what lets the figure stand to one side of the environment with
      // the conversation layered over the other, instead of the figure
      // being centred and the panel covering its legs. Applied only when
      // the panel is genuinely wide enough to be beside it; below that
      // the layout stacks and the subject belongs in the middle.
      const shiftFrac = scene.userData.frameShiftFrac || 0;
      const visibleW = 2 * dist * Math.tan(hFov / 2);
      const shift = camera.aspect >= 1.25 ? visibleW * shiftFrac : 0;
      const look = _mid.clone().add(new THREE.Vector3(-shift, 0, 0));
      camera.position.set(_mid.x - shift, _mid.y + (scene.userData.frameLift || 0), _mid.z + dist);
      camera.lookAt(look);
      camera.far = dist + halfW * 8 + 40;
      camera.updateProjectionMatrix();
    }

    function resize(){
      const el = renderer.domElement.parentElement;
      if(!el) return;
      const w = el.clientWidth, h = el.clientHeight;
      if(w<=0 || h<=0) return;
      renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
      renderer.setSize(w, h);
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
      // After the aspect, never before it: the horizontal fit is computed
      // from the aspect this resize just set.
      frameCamera();
    }
    const ro = new ResizeObserver(resize);
    ro.observe(container);
    resize();

    // Reduced motion is read once, before the loop exists at all - the
    // same lesson this file already learned twice from the `focus` and
    // `focusBody` ordering bugs: check the real state before anything
    // that depends on it can run, not inside the loop.
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const clock = new THREE.Clock();
    const stageObj = { renderer, ro, raf: null };
    stagesMap.set(key, stageObj);

    function tick(){
      if(!still) animate(clock.getElapsedTime());
      renderer.render(scene, camera);
      if(!still) stageObj.raf = requestAnimationFrame(tick);
    }
    tick(); // one real frame renders immediately either way
  }

  // Every mount*3D() below tags its own container with which environment
  // it drew, before anything async happens - a future upgrade tool (or
  // just a person inspecting the page) can read `data-env-id`/`data-env-
  // version` straight off the DOM without this file's internals; nothing
  // downstream (mountStage, resize, dispose, reduced motion) needs to
  // know these attributes exist.
  function tagEnvironment(container, env){
    container.dataset.envId = env.id;
    container.dataset.envVersion = String(env.version);
  }

  function mountAgent3D(container, identity){
    // Which environment gets built is chosen only by identityOf()'s
    // `form` field - never the manager flag directly, never a name - so
    // a future third form (or a future replacement environment for an
    // existing one) is one new registry entry, not a new branch here.
    const env = environmentFor(identity.form);
    return mountStage(container, agent3DStages, identity.key, identity.hue, (THREE, scene, accent) => {
      const group = env.build(THREE, accent);
      scene.add(group);
      return t => {
        group.rotation.y = t * 0.35;
        group.rotation.x = Math.sin(t*0.6) * 0.05;
        group.scale.setScalar(1 + Math.sin(t*1.3) * 0.015);
      };
    });
  }

  function mountBrain3D(container, identity, signal){
    return mountStage(container, brain3DStages, identity.key, identity.hue, (THREE, scene, accent) => {
      const group = BRAIN_VISUAL_ENVIRONMENT.build(THREE, accent, signal);
      group.scale.setScalar(1.75);
      scene.add(group);
      // The specimen has to be wholly in frame at every aspect this panel
      // is ever given - it was being cut off through the stem at desktop
      // width. See frameCamera() in mountStage.
      scene.userData.frame = group;
      scene.userData.frameMargin = 1.14;
      // A neutral key and an accent rim, added to this scene only:
      // mountStage's own single accent light washes the cortex flat, and
      // a folded surface with no shadow in its grooves is not a folded
      // surface to look at.
      const bKey = new THREE.DirectionalLight(0xfff1e8, 1.75);
      bKey.position.set(2.2, 3.0, 2.6);
      scene.add(bKey);
      // Stage 17.20: the accent rim was brighter than the key, so a warm
      // grey cortex rendered as cold cyan stone. It still separates the
      // specimen from the black behind it; it no longer colours it.
      const bRim = new THREE.DirectionalLight(accent, 0.85);
      bRim.position.set(-2.8, 0.6, -2.2);
      scene.add(bRim);
      // A slow specimen turn plus a small tilt, so the fissure, the
      // cerebellum and the stem all come into view rather than the shape
      // only ever being seen head-on. Decoration; it claims nothing about
      // what the brain is doing.
      // Stage 17.20: the resting angle is now a three-quarter view, not a
      // plan view. `rotation.x = -0.3` tilted the crown toward the camera,
      // so the shape was seen from above - the one angle from which a
      // brain has no profile at all and reads as a lumpy disc, which is
      // exactly what a browser showed. Level it, and start the turn at a
      // three-quarter angle so the fissure between the hemispheres and the
      // lobe-and-cerebellum profile are both in view from the first frame
      // rather than only in passing.
      return t => {
        group.rotation.y = 0.95 + Math.sin(t * 0.16) * 0.42;
        group.rotation.x = -0.17 + Math.sin(t*0.4) * 0.04;
        group.position.y = Math.sin(t*0.55) * 0.02;
      };
    });
  }

  function mountMemory3D(container, identity, lit, durable){
    return mountStage(container, memory3DStages, identity.key, identity.hue, (THREE, scene, accent) => {
      const group = MEMORY_VISUAL_ENVIRONMENT.build(THREE, accent, lit, durable);
      group.scale.setScalar(1.6);
      scene.add(group);
      // Same fit, same reason: the store at the foot of the spine was
      // being clipped off the bottom of the panel.
      scene.userData.frame = group;
      scene.userData.frameMargin = 1.16;
      // Stage 17.21: dimmer and warmer-neutral, with a low fill. At 0.9
      // over a solid block the whole archive rendered as one white mass
      // and the lit layer edges vanished into it.
      const mKey = new THREE.DirectionalLight(0xdae6f0, 0.42);
      mKey.position.set(2.2, 2.8, 3.2);
      scene.add(mKey);
      const mFill = new THREE.DirectionalLight(accent, 0.5);
      mFill.position.set(-2.6, 0.8, -1.8);
      scene.add(mFill);
      return t => {
        // Stage 17.21: a slow oscillating three-quarter view, not a full
        // turn. A stack of filed layers is read from its front edge, and
        // a continuous rotation kept carrying that edge away from the
        // camera - half of every cycle showed the back of the archive.
        group.rotation.y = 0.5 + Math.sin(t * 0.13) * 0.42;
        group.rotation.x = -0.24;
        group.children.forEach(child=>{
          const orbit = child.userData.orbit;
          if(!orbit) return;
          const a = t*orbit.speed + orbit.phase;
          child.position.x = Math.cos(a) * orbit.radius;
          child.position.z = Math.sin(a) * orbit.radius;
          // A trace has to keep pointing at the spine it files its own
          // record against, so it turns with the record it links.
          if(orbit.radius < 0.4) child.rotation.y = -a;
        });
      };
    });
  }

  function mountRoom3D(container, key){
    return mountStage(container, room3DStages, key, ROOM_HUE, (THREE, scene, accent) => {
      const { core, rings, rotor, segments } = ROOM_VISUAL_ENVIRONMENT.build(THREE, accent);
      scene.add(core, rotor, segments, ...rings);
      return t => {
        rings.forEach(r => { r.rotation.z = t * r.userData.spin; });
        rotor.rotation.y = -t * 0.5;
        rotor.rotation.x = Math.sin(t*0.4) * 0.15;
        segments.rotation.z = t * 0.08;
        core.material.emissiveIntensity = 0.85 + Math.sin(t*1.1) * 0.18;
        core.scale.setScalar(1 + Math.sin(t*1.1) * 0.04);
      };
    });
  }

  // Stage 17.5: which real (R,G,B) triplet a chosen AvatarProfile's own
  // `accent_color` name means, visually - the same "a name, not a
  // vendor asset" boundary AvatarProfile.accent_color's own docstring
  // already holds; this page owns the one, presentation-only mapping
  // from that name to a colour, exactly as the CSS design tokens
  // already in :root do for this page's own palette (amber=--warn,
  // teal=--ok, coral=--bad - the identical RGB values, reused rather
  // than invented twice). An avatar_id this table has never heard of
  // (a future catalog entry) falls back to Alfred's own cyan rather
  // than failing - never blocks the body from rendering.
  // Stage 17.13: "cyan" - the fourth real accent_color
  // DefaultAvatarProvider's own catalog now offers (sharp_technical),
  // added because nothing in the first three named a genuine cyan -
  // the same real color this stage's own key/edge lighting already is
  // for the "sharp_technical" avatar, since accent already drives
  // mountStage's own DirectionalLight, never a second lighting system.
  const AVATAR_ACCENT_RGB = {
    amber: "232,184,79", teal: "79,209,165", coral: "226,104,95", cyan: "56,224,232",
  };
  function avatarAccentRgb(avatarProfile){
    return AVATAR_ACCENT_RGB[avatarProfile && avatarProfile.accent_color] || "125,216,232";
  }

  function mountAvatarBody3D(container, agentName, avatarProfile, style){
    const accentRgb = avatarAccentRgb(avatarProfile);
    return mountStage(container, avatarBody3DStages, agentName, accentRgb, (THREE, scene, accent) => {
      const group = avatarBodyEnvironmentFor(avatarProfile && avatarProfile.body_type).build(THREE, accent, style);
      // One world group holding the figure, its floor and its backdrop,
      // scaled together. mountStage owns the camera and its signature is
      // fixed, so "bring the camera closer" is expressed here, where a
      // scene builder legitimately can: the figure fills roughly three
      // quarters of the frame instead of half of it, and nothing about
      // the floor it stands on or the environment behind it drifts out of
      // register with it while doing so.
      const world = new THREE.Group();
      world.scale.setScalar(1.42);
      world.position.y = -0.18;
      scene.add(world);
      world.add(group);
      // Stage 17.20: the figure - and only the figure - is what must stay
      // wholly in frame. Arthur's feet were being cut off the bottom edge
      // at desktop width. The backdrop is deliberately excluded: an
      // environment that stopped at the frame edge would be a picture
      // hanging behind him rather than somewhere he is standing.
      scene.userData.frame = group;
      scene.userData.frameMargin = 1.52;
      // Stand the figure right of centre, so the conversation panel
      // layered over the lower left of the environment sits beside it
      // rather than across it. A positive fraction moves the camera left of the subject, which puts
      // the subject right of frame centre. Measured in the browser, not
      // reasoned about: the first attempt had this sign inverted and stood
      // the figure directly behind the conversation panel.
      scene.userData.frameShiftFrac = 0.16;
      scene.userData.frameLift = 0.06;
      // Stage 17.13: the agent's own symbolic backdrop - a genuinely
      // separate sibling Group in the same scene, never a child of the
      // body group above, never merged into its geometry. Positioned
      // further back and scaled up so it reads as a large emblem behind
      // the figure, not another accessory on it. Absent (symbolicEnv is
      // null) for the honest majority of agents that have not chosen
      // one - nothing is added to the scene at all, never an invisible
      // placeholder.
      // A three-point rig for the figure itself. mountStage's own shared
      // lighting is a single accent-coloured key, which is right for an
      // abstract emblem and wrong for a face: it flattened the head into
      // one even wash of the agent's own hue, so no brow, nose or jaw
      // cast anything and none of them read. These three lights are added
      // to this scene only - nothing about mountStage, and nothing about
      // the Brain/Memory/Room/identity stages, changes.
      const keyNeutral = new THREE.DirectionalLight(0xdfe9f2, 1.35);
      keyNeutral.position.set(1.9, 2.6, 3.1);
      scene.add(keyNeutral);
      const rim = new THREE.DirectionalLight(accent, 2.4);
      rim.position.set(-2.6, 1.9, -3.4);
      scene.add(rim);
      const rim2 = new THREE.DirectionalLight(accent, 1.5);
      rim2.position.set(2.9, 1.2, -3.0);
      scene.add(rim2);
      const bounce = new THREE.DirectionalLight(0x33506b, 0.5);
      bounce.position.set(-1.4, -1.8, 1.6);
      scene.add(bounce);

      // A floor the figure stands on, and a horizon behind it. Depth in a
      // scene comes from something being nearer than something else; with
      // a body and an emblem alone there was nothing to be nearer *than*.
      const floor = new THREE.Mesh(
        new THREE.CylinderGeometry(3.6, 3.6, 0.05, 48),
        new THREE.MeshStandardMaterial({
          color: 0x070b10, metalness: 0.62, roughness: 0.5,
          emissive: accent, emissiveIntensity: 0.018,
        }));
      floor.position.set(0, -1.11, -0.4);
      world.add(floor);
      // A ring, not a disc. The first attempt filled the whole circle and
      // lit it at 0.5, which put a bright ellipse under the figure and
      // pulled every eye straight to the floor.
      const floorRing = new THREE.Mesh(
        new THREE.TorusGeometry(1.15, 0.012, 8, 64),
        new THREE.MeshStandardMaterial({
          color: 0x05070a, metalness: 0.3, roughness: 0.3,
          emissive: accent, emissiveIntensity: 0.85,
        }));
      floorRing.rotation.x = Math.PI/2;
      floorRing.position.set(0, -1.075, -0.25);
      world.add(floorRing);

      // Stage 17.13: the agent's own symbolic backdrop - a genuinely
      // separate sibling Group in the same scene, never a child of the
      // body group above, never merged into its geometry. This pass makes
      // it what its own brief always asked for and it was not: a large
      // environment filling the presentation area, standing well behind
      // the figure at real depth, rather than a 2.4x badge floating at
      // z=-1.8 directly behind the head - which at that distance and that
      // emissive strength read as a flat plate pasted over the human.
      // Absent (symbolicEnv is null) for the honest majority of agents
      // that have not chosen one - nothing is added to the scene at all,
      // never an invisible placeholder.
      const symbolicEnv = symbolicEnvironmentFor(style && style.symbolic_environment);
      let symbolicGroup = null;
      if(symbolicEnv){
        symbolicGroup = symbolicEnv.build(THREE, accent, 3.4);
        symbolicGroup.position.set(0, -1.15, 0);
        symbolicGroup.scale.setScalar(0.8);
        world.add(symbolicGroup);
      }
      const eyes = group.userData.eyes;
      const arms = group.userData.arms;
      const mouth = group.userData.mouth;
      const torso = group.userData.torso;
      // Each arm pivot's own resting angle, read once from the real
      // geometry buildHumanoidBody() just built - so easing back to
      // "idle" below returns to this body's own actual pose, never a
      // value guessed independently of what was constructed.
      const restZ = arms.map(p => p.rotation.z);
      const restTorsoRotZ = torso.rotation.z;
      // Stage 17.21: read once from the geometry that was just built, for
      // exactly the reason restZ above is - breathing offsets these every
      // frame, and an offset applied to a value that already carries last
      // frame's offset is an accumulator, not an animation.
      const headRestY = group.userData.head.position.y;
      const armRestY = arms[0] ? arms[0].position.y : 0;
      return t => {
        // Read live presence fresh every frame - S is reassigned
        // wholesale on every live poll (see refreshFromLive below), so
        // closing over S itself - never a value captured once at mount
        // time - is what lets SPEAKING/LISTENING/IDLE genuinely update
        // on a running stage without waiting for it to be torn down and
        // remounted, unlike mountBrain3D/mountMemory3D above, which
        // freeze their own signal/lit reading at mount time.
        const live = S && S.agents ? S.agents.find(a=>a.name===agentName) : null;
        const activity = (live && live.activity) || "idle";
        // Stage 17.11: an unsaved Avatar Studio preview edit (DH_PREVIEW,
        // client-only, never sent anywhere until Save) merged on top of
        // the real, server-confirmed profile - see _dhPreviewProfile()'s
        // own comment. With nothing pending this is exactly the Stage
        // 17.4 read it always was.
        const profile = _dhPreviewProfile(agentName, live && live.avatar && live.avatar.profile);

        // Stage 17.6B: a per-agent, deterministic animation
        // "signature" - never a fixed set of gestures every agent
        // performs identically, and never a fabricated vocabulary of
        // named gestures either. Derived from this agent's own
        // configured gesture_style/idle_behavior when set, or from its
        // own name when not - the identical "stable hash of an open
        // string, a real variation, never a semantic interpretation of
        // it" precedent _stableUnit already establishes for body/
        // posture. Two agents with the same gesture_style genuinely
        // move the same way; two with different (or unconfigured)
        // values genuinely do not.
        const gestureSignature = _stableUnit(profile.gesture_style || agentName);
        const gestureAmp = 0.16 + gestureSignature * 0.22;
        const gestureRate = 1.5 + gestureSignature * 1.1;
        const idleSignature = _stableUnit(profile.idle_behavior || (agentName + ":idle"));
        const idleRate = 0.42 + idleSignature * 0.22;

        // Idle: the same gentle sway/bob every other environment in
        // this file already uses for "alive, not doing anything in
        // particular" - decoration, never a claim of real activity -
        // now at a per-agent rate rather than one rate for everybody.
        group.rotation.y = Math.sin(t*0.18) * 0.25;
        group.position.y = Math.sin(t*idleRate) * 0.02;
        // Stage 17.8: a slight, restrained weight shift - a real,
        // deterministic, per-agent-varied side-to-side sway (its own
        // rate, distinct from the vertical bob above) standing in for
        // "a person is not standing perfectly still", present in every
        // state including speaking/listening rather than only idle -
        // a professional meeting cue, not a cartoon rock.
        group.position.x = Math.sin(t*idleRate*0.63 + gestureSignature*2) * 0.025;

        if(activity === "speaking"){
          // A generic "producing speech right now" animation - never
          // phoneme/viseme-timed, and never called lip-sync anywhere in
          // this codebase: no speech provider this project ships
          // exposes timing data to synchronise to (see
          // src/providers/windows_speech_provider.py and
          // elevenlabs_speech_provider.py - both return only a
          // boolean). A faster head bob is an honest "something real is
          // happening", not a claim about which sound is being made.
          group.userData.head.scale.setScalar(1 + Math.abs(Math.sin(t*9))*0.05);
          group.rotation.y += Math.sin(t*3)*0.03;

          // Stage 17.9 - the one place PresentationIntent is actually
          // consumed: a real signal read fresh every frame from the same
          // live snapshot `live` above already came from, never inspected
          // for meaning here, only looked up in the small fixed table
          // above. Only ever active during this same speaking window
          // (the server-side producer sets it right before, and clears it
          // right after, the one real speak() call this activity already
          // reflects) - so it is deliberately read only in this branch,
          // never in listening/idle below.
          const intentGesture = (live && live.avatar && live.avatar.intent && live.avatar.intent.gesture) || "neutral";
          const intentEffect = PRESENTATION_INTENT_EFFECTS[intentGesture] || PRESENTATION_INTENT_EFFECTS.neutral;

          // Stage 17.16: a slow, deterministic (no JS random-number
          // primitive involved, same discipline as gestureSignature above)
          // second modulation on top of the gesture oscillation itself -
          // a sine at a rate (0.13 rad/s, ~48s period) with no simple
          // ratio to gestureRate (~1.5-2.6 rad/s), so within any one
          // gesture cycle it is nearly constant but across a long
          // speaking turn the amplitude visibly breathes rather than
          // repeating with exact periodicity. "Robotic" here means
          // perfectly unchanging repetition, not motion existing at
          // all - this is the smallest fix for that without inventing
          // any new state, timer or randomness.
          const liveliness = 0.82 + (Math.sin(t*0.13 + gestureSignature*5) * 0.5 + 0.5) * 0.36;

          // Real, bounded arm/hand gesturing while speaking - a genuine
          // rotation of each shoulder pivot, at this agent's own
          // amplitude/rate, each arm on its own phase so the two never
          // move as a mirrored unit (avoiding the "identical robotic
          // loop" this phase's own brief explicitly warns against).
          // Stage 17.16: eased toward its own target rather than
          // assigned directly, so the very first speaking frame moves
          // *from* wherever idle/listening actually left this pivot,
          // never snapping to a value that could be anywhere in the
          // oscillation's own range.
          arms.forEach((pivot, i) => {
            const targetZ = restZ[i] + Math.sin(t*gestureRate + i*1.7) * gestureAmp * intentEffect.gestureMul * liveliness * (i===0?1:-1);
            const targetX = Math.sin(t*gestureRate*0.6 + i) * 0.1;
            pivot.rotation.z += (targetZ - pivot.rotation.z) * 0.22;
            pivot.rotation.x += (targetX - pivot.rotation.x) * 0.22;
          });

          // An occasional, bounded nod while speaking - a short window
          // recurring every ~5.4s (timed off elapsed time, never a
          // randomly-drawn value), offset per agent by its own
          // signature so several speaking agents do not nod in lockstep.
          // Stage 17.16: eased toward its own target the same way the
          // arms above now are, so a head coming straight out of
          // LISTENING's own forward lean settles into the nod rather
          // than snapping through it.
          const nodPhase = (t + gestureSignature*3) % 5.4;
          const nodTarget = nodPhase > 4.9
            ? Math.sin((nodPhase-4.9)*Math.PI/0.5) * 0.14 * intentEffect.nodMul : 0;
          group.userData.head.rotation.x += (nodTarget - group.userData.head.rotation.x) * 0.22;
          // Stage 17.21: a speaker looks at whoever they are speaking to,
          // with the small turns away that real speech carries. Same eased
          // yaw as the other two states, a third target - never a second
          // mechanism.
          const speakYaw = Math.sin(t*0.37 + gestureSignature*4) * 0.06;
          group.userData.head.rotation.y += (speakYaw - group.userData.head.rotation.y) * 0.1;

          // Stage 17.7: a real mouth open/close pulse while speaking -
          // deliberately NOT lip-sync. No speech provider this project
          // ships exposes phoneme/viseme/timing data to drive a real
          // one (re-confirmed this phase; see the module docstring of
          // src/channels/speech.py and both concrete adapters), and a
          // Python-side seam with no possible producer would be the
          // exact premature abstraction PresentationIntent's own
          // docstring already refuses elsewhere in this project - so
          // this stays a generic, honestly-labelled "something is
          // being said" cue, timed off this agent's own gestureRate so
          // it varies per agent like every other speaking motion here.
          // Stage 17.16: eased (a faster factor than the limbs above,
          // so it still tracks its own fast pulse closely) rather than
          // assigned outright, removing the one-frame jump from
          // whatever idle/listening left the mouth at.
          const mouthTarget = 0.3 + Math.abs(Math.sin(t*gestureRate*2.4)) * 2.6;
          mouth.scale.y += (mouthTarget - mouth.scale.y) * 0.4;

          // Subtle torso movement while speaking - a small, bounded
          // lean distinct from the arm/head motion above, so speaking
          // reads as more than "arms swing and head bobs". Stage
          // 17.10: carries the same intentEffect.gestureMul the arms
          // above already do - one shared restraint knob per intent,
          // not a second independent one, so torso and arms always
          // scale together rather than drifting apart per gesture.
          // Stage 17.16: also carries `liveliness`, and is eased like
          // every other target above.
          const torsoTarget = restTorsoRotZ + Math.sin(t*gestureRate*0.5) * 0.035 * intentEffect.gestureMul * liveliness;
          torso.rotation.z += (torsoTarget - torso.rotation.z) * 0.22;
        } else if(activity === "listening"){
          // Listening: a sustained forward head lean - genuinely
          // distinct from idle and from the speaking bob above, only
          // ever shown when the real, server-side PresenceRegistry
          // actually reports it (see src/services/identity/presence.py's
          // own speaking()/PresenceState) - never guessed client-side -
          // now with a small attentive micro-motion layered on top
          // rather than a single frozen angle. Stage 17.16: eased into
          // (not snapped to) so entering LISTENING from idle's own
          // near-zero lean settles rather than jumps.
          const headLeanTarget = 0.12 + Math.sin(t*0.9) * 0.015;
          group.userData.head.rotation.x += (headLeanTarget - group.userData.head.rotation.x) * 0.15;
          group.userData.head.scale.setScalar(1);
          // Stage 17.21: while listening the head comes back to square and
          // stays there, cancelling idle's slow drift. That IS the
          // attention cue - a person being spoken to stops looking around
          // - and it costs no new state, because it is the same eased
          // yaw idle already animates, given a different target.
          group.userData.head.rotation.y += (0 - group.userData.head.rotation.y) * 0.08;
          arms.forEach((pivot, i) => {
            // Hands settle and quieten, but do not freeze.
            const still = restZ[i] + Math.sin(t*0.35 + i*2.4) * 0.010;
            pivot.rotation.z += (still - pivot.rotation.z) * 0.06;
            pivot.rotation.x += (0 - pivot.rotation.x) * 0.06;
          });
          mouth.scale.y += (1 - mouth.scale.y) * 0.15;
          torso.rotation.z += (restTorsoRotZ - torso.rotation.z) * 0.06;
        } else {
          // Idle: ease every pose back toward rest rather than
          // snapping - one frame's worth of interpolation per tick, so
          // a transition out of speaking/listening looks like settling
          // down, not a hard cut.
          // Stage 17.21: idle is a settled pose, not a frozen one. The
          // arms ease toward rest PLUS a small, slow, per-arm-phased
          // drift, so the hands are never perfectly still; the torso
          // carries a matching slow rotation. Both are an order of
          // magnitude smaller than the speaking gestures, which is what
          // keeps "at rest" clearly distinct from "gesturing".
          arms.forEach((pivot, i) => {
            const drift = restZ[i] + Math.sin(t*0.47 + i*2.1 + gestureSignature*3) * 0.022;
            pivot.rotation.z += (drift - pivot.rotation.z) * 0.06;
            pivot.rotation.x += (Math.sin(t*0.31 + i) * 0.014 - pivot.rotation.x) * 0.06;
          });
          mouth.scale.y += (1 - mouth.scale.y) * 0.15;
          torso.rotation.z += (restTorsoRotZ + Math.sin(t*0.29)*0.012 - torso.rotation.z) * 0.06;
          group.userData.head.scale.setScalar(1);

          // A slow look, so the head is not welded facing front. Very
          // slow (a ~57s period) and small: this is a person's attention
          // drifting and returning, not a character scanning a room.
          const lookTarget = Math.sin(t*0.11) * 0.15 + Math.sin(t*0.043 + 1.7) * 0.07;
          group.userData.head.rotation.y += (lookTarget - group.userData.head.rotation.y) * 0.03;

          // Stage 17.7: "room attention" - a subtle, purely client-side
          // idle variant applied only when this exact snapshot already
          // shows some OTHER real agent's own activity as "speaking" -
          // never a fabricated server-side LISTENING claim about THIS
          // agent (its own real activity stays "idle" the whole time;
          // only another agent's already-real SPEAKING fact, present
          // in the same S.agents this function already reads, informs
          // a purely decorative lean). Deliberately smaller than the
          // genuine LISTENING branch's own lean above, so it can never
          // be mistaken for that real, server-asserted state, and
          // varied per agent (idleSignature) so a room full of
          // "listeners" does not lean identically.
          const roomAttention = S && S.agents
            ? S.agents.some(a => a.name !== agentName && a.activity === "speaking")
            : false;
          const attentionLean = roomAttention ? 0.035 + idleSignature * 0.035 : 0;
          group.userData.head.rotation.x += (attentionLean - group.userData.head.rotation.x) * 0.04;

          // Stage 17.8: a general "oriented toward the conversation"
          // bias while someone else is speaking - deliberately NOT a
          // literal look-at. Each participant's body is mounted in its
          // own independent WebGL context (mountStage/wireStages, see
          // this file's own Room markup) with no shared 3D coordinate
          // space across bodies to compute a real bearing from one to
          // another, so this stays an honest, small, per-agent-varied
          // rotational settle rather than a fabricated spatial claim.
          // A direct, bounded addition to the sway this same frame
          // already computed above - never an accumulator: group.rotation.y
          // is fully recomputed from scratch (Math.sin(t*0.18)*0.25) at
          // the top of every single frame, so adding a fixed offset
          // here cannot drift or grow across frames the way easing an
          // already-persistent value with += would.
          const attentionYaw = roomAttention ? 0.08 + idleSignature * 0.06 : 0;
          group.rotation.y += attentionYaw;
        }

        // Stage 17.21: BREATH. Applied after the state branch and in
        // every state, because a person breathes while speaking, while
        // listening and while doing nothing - it is the baseline that
        // separates "alive" from a shop dummy standing still, and its
        // absence is most of why this figure read as a mannequin.
        //
        // A real chest expansion, not a whole-body scale: the torso
        // widens and deepens slightly more than it lengthens, the head
        // rides up on the inhale, and the shoulders follow it. Rate is
        // per-agent (a calm agent breathes slower) and deliberately slow
        // - roughly 12-16 breaths a minute, the range a resting person
        // actually sits in. Nothing else in this function writes
        // torso.scale or head.position, so applying it last cannot fight
        // any pose the branch above just set.
        const breathRate = 1.25 + idleSignature * 0.35;
        const breath = Math.sin(t * breathRate);
        const inhale = (breath + 1) / 2;
        torso.scale.set(1 + inhale*0.017, 1 + inhale*0.011, 1 + inhale*0.021);
        group.userData.head.position.y = headRestY + inhale * 0.012;
        arms.forEach(pivot => { pivot.position.y = armRestY + inhale * 0.010; });
        // and the whole body settles a hair on the exhale
        group.position.y += inhale * 0.008;

        // Real, periodic blinking - on a fixed (never random) period,
        // the same determinism every other animation in this file
        // already holds to. Stage 17.21: a double-blink every fourth
        // one, because a perfectly metronomic blink is its own kind of
        // uncanny. Still fully deterministic - it is a second, slower
        // sine gate over the same clock, not a drawn number.
        const blinkPhase = t % 4.2;
        const doubleWindow = Math.floor(t / 4.2) % 4 === 0;
        const blinking = blinkPhase > 4.0 || (doubleWindow && blinkPhase > 3.82 && blinkPhase < 3.9);
        eyes.forEach(eye => { eye.scale.y = blinking ? 0.12 : 1; });

        // Stage 17.13: a slow, deterministic (driven only by the
        // already-elapsed clock time this whole function receives, the
        // same as every other motion in this file) rotation for a
        // symbolic environment that asks for one (its own build() marks
        // group.userData.rotor) - unconditional on `activity`, so it
        // turns the same whether this agent is speaking, listening or
        // idle. Motion-reduction is already handled upstream by
        // mountStage's own tick(), which simply stops calling this
        // whole function again once that OS-level setting is on - see
        // that function's own comment; nothing new needed here.
        // Stage 17.21: an environment that declares its own animate()
        // drives its own layers. This is what makes a backdrop a space:
        // the near buttresses, the mid span and the far arch each move at
        // their own rate, and one shared yaw applied to the whole group
        // could never produce parallax because everything in it would
        // move together. Same registry rule as before - the entry owns
        // its own behaviour - just expressed as a closure instead of a
        // single number. The older single-rate form is still honoured for
        // any environment that declares only that.
        if(symbolicGroup && symbolicGroup.userData.animate){
          symbolicGroup.userData.animate(t);
        } else if(symbolicGroup && symbolicGroup.userData.rotor){
          // Each environment declares its own rate (and, in future, its
          // own axis) rather than every backdrop turning at one shared
          // speed - the same "the registry entry owns its own behaviour"
          // rule the builders themselves already follow. A very slow
          // yaw: this is a large structure behind a person, and anything
          // faster reads as a spinning prop.
          const rate = symbolicGroup.userData.spinRate || 0.05;
          symbolicGroup.rotation.y = Math.sin(t * rate) * 0.26;
        }
      };
    });
  }

  let agent3DStages = new Map();  // identity.key (agent name) -> {renderer, ro, raf}
  let brain3DStages  = new Map(); // same shape, this agent's Brain stage
  let memory3DStages = new Map(); // same shape, this agent's Memory stage
  let room3DStages   = new Map(); // same shape, keyed "core" - the Room is not an agent, so there is exactly one entry
  let avatarBody3DStages = new Map(); // same shape, keyed by agent name - Stage 17.5's own Digital Human body stage

  // wireStages() is the one reuse-or-mount loop behind every [data-*3d]
  // surface: it disposes exactly the stages whose element is no longer
  // present, reuses (moves the same <canvas>, keeps the same clock
  // running) every stage whose element still is, and only calls mountFn
  // for a genuinely new one. Shared by wireAgent3D/wireBrain3D/
  // wireMemory3D below so a live poll rebuilding the whole page leaves
  // an agent's identity, Brain and Memory stages all running
  // uninterrupted, independently of each other and of every other agent.
  function wireStages(attrKey, stagesMap, mountFn, tag){
    const els = [...stage.querySelectorAll(`[data-${attrKey}]`)];
    const present = new Set(els.map(el=>el.dataset[attrKey]));
    for(const key of [...stagesMap.keys()]) if(!present.has(key)) disposeStage(stagesMap, key);

    els.forEach(el=>{
      const name = el.dataset[attrKey];
      // Tagged on every pass, not only a fresh mount: a live poll or a
      // mode switch back rebuilds this container from scratch (a brand
      // new element with none of the previous one's attributes), and the
      // reuse branch just below never calls mountFn again - so tagging
      // only inside a mount function would make the tag vanish after the
      // very first refresh even though the stage itself keeps running
      // correctly. Found by actually watching a real poll fire, the same
      // way the fallback-clearing bug in this same reuse branch was.
      if(tag) tag(el, name);
      const running = stagesMap.get(name);
      if(running && running.renderer){
        // The same running stage, not a new one: a live poll or a mode
        // switch back rebuilds this container, but the GPU context, the
        // geometry and the clock keep going uninterrupted. Tearing down
        // and recreating a real WebGL context (and resetting its clock
        // to zero) on every five-second poll would look like the
        // animation stuttering and restarting, and would burn through
        // the browser's limited concurrent-context budget for no
        // reason.
        const fb = el.querySelector(".agent3d-fallback");
        if(fb) fb.remove();
        el.appendChild(running.renderer.domElement);
        running.ro.disconnect();
        running.ro.observe(el);
        return;
      }
      mountFn(el, name);
    });
  }

  function wireAgent3D(){
    wireStages("agent3d", agent3DStages,
      (el, name) => {
        const agent = S.agents.find(a=>a.name===name);
        if(agent) mountAgent3D(el, identityOf(agent));
      },
      (el, name) => {
        const agent = S.agents.find(a=>a.name===name);
        if(agent) tagEnvironment(el, environmentFor(identityOf(agent).form));
      });
  }

  // Stage 17.5: the Digital Human body - a separate [data-avatarbody3d]
  // surface from the identity emblem above, never a replacement for it
  // (nothing about wireAgent3D/mountAgent3D/AGENT_VISUAL_ENVIRONMENTS
  // changed). Driven by this agent's own real avatar/profile
  // (a.avatar.avatar / a.avatar.profile, the Stage 17.1/17.4 snapshot
  // fields), never by identityOf()'s static form - a real, user-chosen
  // AvatarProfile is what selects and colours this body.
  function wireAvatarBody3D(){
    wireStages("avatarbody3d", avatarBody3DStages,
      (el, name) => {
        const agent = S.agents.find(a=>a.name===name);
        if(agent && agent.avatar) {
          mountAvatarBody3D(el, name, agent.avatar.avatar, _dhPreviewProfile(name, agent.avatar.profile));
        }
      },
      (el, name) => {
        const agent = S.agents.find(a=>a.name===name);
        const bodyType = agent && agent.avatar && agent.avatar.avatar && agent.avatar.avatar.body_type;

  function go(key, agentName){
    // The private interface is generic over an identity, so which agent
    // it is open FOR is state, resolved here - before V[key]() renders -
    // from whoever was asked for, else whoever was already open, else
    // whoever the registry says orchestrates. Never a hardcoded name, and
    // never a name that is not a currently-registered agent.
    if(key === "agent"){
      openAgent = (agentName && agentNamed(agentName)) ? agentName
                : (agentNamed(openAgent) ? openAgent : manager().name);
    }
    // Stage 17.15 bug fix: the root cause of a real, reported Control
    // Center flicker. Every refreshFromLive() poll (every 5s, live-
    // served) calls go(current) - the exact same view, just re-rendered
    // with fresh data - and stage.innerHTML= always creates a brand new
    // <div class="view on">, so .view.on's own CSS `animation:enter`
    // (a real, intentional 0.5s fade-in for genuine navigation) was
    // restarting on that brand new element every single poll, forever -
    // the whole main content area visibly fading out and back in every
    // five seconds. `isRefresh` is true only when go() re-renders the
    // view it was already on (a poll, or clicking the tab you're
    // already on) - a genuine navigation (key actually changes, or this
    // is the very first render) still gets the real entrance animation.
    const isRefresh = hasEnteredAnyView && current === key;
    current = key;
    hasEnteredAnyView = true;
    stage.innerHTML = `<div class="view on${isRefresh ? " no-enter" : ""}">${V[key]()}</div>`;
    [...modes.children].forEach(b=>b.setAttribute("aria-current", String(b.dataset.k===key)));
    try{ localStorage.setItem("alfred.mode", key); }catch(e){}
    stage.querySelectorAll("[data-goto]").forEach(el=>
      el.addEventListener("click",()=>go(el.dataset.goto, el.dataset.agent)));
    // Click any agent's own identity anywhere it appears to bring the
    // camera to it - a real body already in `bodies`, never a new one.
    stage.querySelectorAll("[data-focus]").forEach(el=>
      el.addEventListener("click",()=>{ focusBody = el.dataset.focus; }));
    if(agentName){
      const target = stage.querySelector(`#ws-${CSS.escape(agentName)}`);
      if(target) target.scrollIntoView({behavior:"smooth",block:"center"});
    }
    focusOn(key);
    focusBody = (key==="agent") ? openAgent
      : (key==="workspace" || key==="brain" || key==="memory") ? (agentName||focusBody)
      : null;
    wireComposer();
    wireControlCenterCommands();
    wireAvatarPicker();
    wireEnvironmentPicker();
    wireDigitalHumanOptions();
    wireDigitalHumanForm();
    wireAgent3D();
    wireAvatarBody3D();
    wireBrain3D();
    wireMemory3D();
    wireRoom3D();
  }

  // raw brain mode ("half brain") across the top of every screen a person
  // ever looked at - a real, load-bearing architectural term that means

  // reads as a fault when it is not one. The exact mode string, its
  // provider, its reason and its evidence are all unchanged and all still
  // one click away in Control Center and Cognition.
  function renderChrome(){
    document.getElementById("crown-name").textContent = manager().name;
    document.getElementById("crown-sub").textContent =
      `${S.agents.length} agent${S.agents.length===1?"":"s"} · ${readinessOf(manager().brain)}`;
    document.getElementById("stamp").textContent = "as of " + when(S.taken_at);

  // ---- the composer: the one place a person's own words leave the page ---
  // Re-wired after every render, the same way [data-goto] is - go() replaces
  // the whole stage, so whatever was listening on the old <input> is gone
  // with it. Disabled outright unless LIVE; re-enabled automatically the
  // next time this runs, because that only happens through a fresh render.
  function wireComposer(){
    if(!LIVE) return;
    // The picker is harmless local state with nothing to send until the
    // input beside it works, so it is wired under the same LIVE guard -
    // never a control that looks live in the static export.
    stage.querySelectorAll(".who-picker .pick").forEach(btn=>{
      btn.addEventListener("click", () => {
        const name = btn.dataset.pick;
        selectedAgent = (selectedAgent === name) ? null : name;
        const group = btn.closest(".who-picker");
        group.querySelectorAll(".pick").forEach(b =>
          b.classList.toggle("on", b.dataset.pick === selectedAgent));
        const input = stage.querySelector(".say input.composer");
        if(input) input.placeholder = selectedAgent
          ? `Speak to ${selectedAgent}…` : "Speak into the room…";
      });
    });
    const input = stage.querySelector(".say input.composer");
    if(!input) return;
    input.addEventListener("keydown", async (e) => {
      if(e.key !== "Enter") return;
      const addressedTo = input.dataset.to || selectedAgent;
      const text = input.value.trim();
      if(!text || input.disabled) return;
      input.value = "";
      input.disabled = true;
      const stateEl = stage.querySelector(".say .state");
      if(stateEl) stateEl.textContent = "sending…";
      try{
        const res = await fetch("message", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          // Who this line is addressed to. The Room's composer carries no
          // `data-to` and keeps using selectedAgent exactly as it always
          // has; the private interface's own composer carries the one
          // agent whose interface it is, so a private line is addressed
          // to that agent whether or not anything is selected in the
          // Room. Either way this is only ever exchange()'s own
          // `addressed` override, resolved server-side through the real
          // registry - never a routing decision made on this page.
          body: JSON.stringify(addressedTo ? {text, to: addressedTo} : {text}),
        });
        if(!res.ok && stateEl) stateEl.textContent = `not sent — ${res.status}`;
      }catch(e){
        if(stateEl) stateEl.textContent = "not sent — offline";
      }
      // Whatever happened, ask for a fresh reading right away rather than
      // waiting for the next scheduled poll - the room should show the
      // outcome, or the honest lack of one, immediately.
      await refreshFromLive();
    });
  }

  // ---- the avatar picker: WHAT an agent looks like, never WHO you are --
  // talking to (that is .who-picker, above, and selectedAgent - this
  // function never touches either). Re-wired after every render for the
  // same reason wireComposer() is. Stage 17.2.
  // Foundation Repair #5 (reconciliation audit, 2026-09-05): wires the
  // "Manage" section V.control renders - the same re-wire-after-every-
  // render pattern every other wire*() function below already follows,
  // because go() replaces the whole stage on every navigation and every
  // poll. Administrative only (see MGMT_VERBS's own comment): a credential
  // typed into #cc-cmd is sent once, in the POST body, and is never
  // echoed back in any response this renders.
  function wireControlCenterCommands(){
    if(!LIVE) return;
    const out = stage.querySelector("#cc-out");
    const cmdInput = stage.querySelector("#cc-cmd");
    const runBtn = stage.querySelector("#cc-run");
    if(!out) return;

    // Control Center repair item #3 (2026-09-07): a write-classified
    // command comes back as JSON asking for confirmation before it
    // executes - see scripts/serve_ui.py's own route_command docstring.
    // window.confirm() is the actual confirm/cancel step a person sees;
    // the real governance boundary is server-side (a raw call with no
    // token, or the wrong token, is refused there regardless of what
    // this function does) - this only has to ask honestly and, on yes,
    // send the exact token back.
    function runCommand(command, confirmToken){
      out.textContent = "...";
      const body = confirmToken ? {command, confirm_token: confirmToken} : {command};
      fetch("command", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body),
      }).then(res => {
        const contentType = res.headers.get("content-type") || "";
        return res.text().then(text => ({
          ok: res.ok, text, isJson: contentType.indexOf("application/json") !== -1,
        }));
      }).then(result => {
        if(!result.ok){
          // A refused verb (e.g. "talk") comes back as JSON naming why -
          // shown plainly rather than as a raw, unexplained failure.
          try{
            out.textContent = "Refused: " + (JSON.parse(result.text).error || result.text);
          }catch(e){ out.textContent = "Refused: " + result.text; }
          return;
        }
        if(!result.isJson){ out.textContent = result.text; return; }
        let payload;
        try{ payload = JSON.parse(result.text); }
        catch(e){ out.textContent = result.text; return; }
        if(payload.requires_confirmation){
          const proceed = confirm(payload.description + "\n\nProceed?");
          if(proceed) runCommand(command, payload.confirm_token);
          else out.textContent = "Cancelled - nothing changed.";
          return;
        }
        out.textContent = payload.result;
      }).catch(err => { out.textContent = "Request failed: " + err; });
    }

    stage.querySelectorAll("[data-cc-verb]").forEach(btn=>{
      btn.addEventListener("click", () => runCommand(btn.dataset.ccVerb));
    });
    if(runBtn && cmdInput){
      runBtn.addEventListener("click", () => {
        const value = cmdInput.value.trim();
        if(value) runCommand(value);
      });
    }

    // Final acceptance pass (2026-09-08): Provider accounts had governed,
    // audited add/select/revoke/validate backend but no guided form - the
    // same "requires typing the raw command" gap Connections had. A
    // guided form over the same real run_provider_command a terminal's
    // own "provider" verb already accepts, never a new backend operation.
    const provCategory = stage.querySelector("#cc-prov-category");
    const provView = stage.querySelector("#cc-prov-view");
    const provAccounts = stage.querySelector("#cc-prov-accounts");
    const provBackend = stage.querySelector("#cc-prov-backend");
    const provAccount = stage.querySelector("#cc-prov-account");
    const provAction = stage.querySelector("#cc-prov-action");
    const provCredential = stage.querySelector("#cc-prov-credential");
    const provModel = stage.querySelector("#cc-prov-model");
    const provGo = stage.querySelector("#cc-prov-go");
    if(provView && provCategory){
      provView.addEventListener("click", () => {
        const category = provCategory.value.trim();
        if(!category){ out.textContent = "Enter a category first, e.g. llm_provider."; return; }
        runCommand("provider " + category);
      });
    }
    if(provAccounts && provCategory){
      provAccounts.addEventListener("click", () => {
        const category = provCategory.value.trim();
        if(!category){ out.textContent = "Enter a category first, e.g. llm_provider."; return; }
        runCommand("provider " + category + " accounts");
      });
    }
    if(provGo && provCategory && provBackend && provAccount && provAction && provCredential && provModel){
      provGo.addEventListener("click", () => {
        const category = provCategory.value.trim();
        const backend = provBackend.value.trim();
        const account = provAccount.value.trim();
        const action = provAction.value;
        const credential = provCredential.value;
        const model = provModel.value.trim();
        if(!category){ out.textContent = "Enter a category first, e.g. llm_provider."; return; }
        if(!backend){ out.textContent = "Enter a backend first, e.g. anthropic."; return; }
        let command = null;
        if(action === "add"){
          if(!account || !credential){ out.textContent = "add needs both an account id and a credential."; return; }
          command = "provider " + category + " add " + backend + " " + account + " " + credential + (model ? " " + model : "");
        }else if(action === "select"){
          if(!account){ out.textContent = "select needs an account id."; return; }
          command = "provider " + category + " select " + backend + " " + account;
        }else if(action === "revoke"){
          if(!account){ out.textContent = "revoke needs an account id."; return; }
          command = "provider " + category + " revoke " + backend + " " + account;
        }else if(action === "validate"){
          command = "provider " + category + " validate " + backend + (credential ? " " + credential : "");
        }
        if(command){
          runCommand(command);
          provCredential.value = "";
        }
      });
    }

    // Control Center repair item #1: a real toggle, not a fake frontend
    // switch - each click sends the identical "capabilities enable/
    // disable <name>" command the generic box already supports, through
    // the identical confirmation flow above.
    const capName = stage.querySelector("#cc-cap-name");
    const capEnable = stage.querySelector("#cc-cap-enable");
    const capDisable = stage.querySelector("#cc-cap-disable");
    if(capEnable && capName){
      capEnable.addEventListener("click", () => {
        const name = capName.value.trim();
        if(name) runCommand("capabilities enable " + name);
      });
    }
    if(capDisable && capName){
      capDisable.addEventListener("click", () => {
        const name = capName.value.trim();
        if(name) runCommand("capabilities disable " + name);
      });
    }

    // Control Center repair item #2: a guided form over the same real
    // ecosystem_evolution operations - never a new one. Composes the
    // identical command string a terminal's own "ecosystem" verb already
    // accepts.
    const ecoComponent = stage.querySelector("#cc-eco-component");
    const ecoAction = stage.querySelector("#cc-eco-action");
    const ecoArgs = stage.querySelector("#cc-eco-args");
    const ecoGo = stage.querySelector("#cc-eco-go");
    if(ecoGo && ecoComponent && ecoAction && ecoArgs){
      ecoGo.addEventListener("click", () => {
        const component = ecoComponent.value.trim();
        const action = ecoAction.value;
        const args = ecoArgs.value.trim();
        if(!component){ out.textContent = "Enter a component id first (see 'inventory' above)."; return; }
        let command = null;
        if(action === "detail") command = "ecosystem " + component;
        else if(action === "propose") command = "ecosystem " + component + " propose " + args;
        else if(action === "run") command = "ecosystem " + component + " run " + args + " yes";
        else if(action === "reject") command = "ecosystem " + component + " run " + args + " no";
        else if(action === "rollback") command = "ecosystem " + component + " rollback " + args + " yes";
        if(command) runCommand(command);
      });
    }

    // Connections Management: a guided form over the same real
    // run_connections_command a terminal's own "connections" verb already
    // accepts - connect/disconnect/status/validate, never a new backend
    // operation. The credential field is password-masked and cleared
    // immediately after the command is sent; it is never read back from
    // the server (ProviderAccount.describe() never carries one).
    const connService = stage.querySelector("#cc-conn-service");
    const connAccount = stage.querySelector("#cc-conn-account");
    const connAction = stage.querySelector("#cc-conn-action");
    const connCredential = stage.querySelector("#cc-conn-credential");
    const connModel = stage.querySelector("#cc-conn-model");
    const connGo = stage.querySelector("#cc-conn-go");
    if(connGo && connService && connAccount && connAction && connCredential && connModel){
      connGo.addEventListener("click", () => {
        const service = connService.value.trim();
        const account = connAccount.value.trim();
        const action = connAction.value;
        const credential = connCredential.value;
        const model = connModel.value.trim();
        if(!service){ out.textContent = "Enter a service name first (see 'view all' above)."; return; }
        let command = null;
        if(action === "connect"){
          if(!account || !credential){ out.textContent = "connect needs both an account id and a credential."; return; }
          command = "connections " + service + " connect " + account + " " + credential + (model ? " " + model : "");
        }else if(action === "disconnect"){
          if(!account){ out.textContent = "disconnect needs an account id."; return; }
          command = "connections " + service + " disconnect " + account;
        }else if(action === "status"){
          command = "connections " + service + " status";
        }else if(action === "validate"){
          command = "connections " + service + " validate" + (credential ? " " + credential : "");
        }
        if(command){
          runCommand(command);
          connCredential.value = "";
        }
      });
    }
  }

  // ---- Avatar Studio: local, unsaved preview state ----------------------
  // Stage 17.11. Keyed by agent name, holding only the DIGITAL_HUMAN_
  // FIELD_OPTIONS fields a person has clicked a picker option for since
  // the last successful save - never persisted, never sent anywhere on
  // its own, and merged on top of the real server-confirmed profile
  // wherever the renderer reads one (mountAvatarBody3D's own animate()
  // closure, and the mount call below). The identical "a draft in
  // progress must survive a background poll" shape refreshFromLive()'s
  // own composer-draft handling already has, applied to presentation
  // instead of a typed message: a background 5s poll's own go() re-
  // render must not silently discard what a person just clicked.
  const DH_PREVIEW = {};

  function _dhPreviewProfile(agentName, savedProfile){
    return Object.assign({}, savedProfile || {}, DH_PREVIEW[agentName] || {});
  }

  // buildHumanoidBody only ever reads posture/body at MOUNT time - they
  // shape the geometry itself (leg length, torso width), not something
  // any per-frame animate() loop re-reads (see that function's own
  // comment) - unlike gesture_style/idle_behavior, which
  // mountAvatarBody3D's animate() closure already reads fresh every
  // frame via the profile line above, so previewing either of those
  // needs no rebuild at all. Previewing a posture/body pick therefore
  // needs a genuine rebuild - the one thing wireStages' own reuse path
  // deliberately never does on its own (see its own comment: tearing
  // down a running WebGL context on every poll would look like the
  // animation stuttering), so this is called only at the one moment a
  // rebuild is actually wanted, never from wireStages itself.
  const DH_GEOMETRY_FIELDS = new Set(["posture", "body"]);

  function _restyleAvatarBodyPreview(agentName){
    const el = stage.querySelector(`[data-avatarbody3d="${CSS.escape(agentName)}"]`);
    if(!el) return;
    const agent = S.agents.find(a=>a.name===agentName);
    if(!agent || !agent.avatar) return;
    disposeStage(avatarBody3DStages, agentName);
    el.innerHTML = "";
    mountAvatarBody3D(el, agentName, agent.avatar.avatar, _dhPreviewProfile(agentName, agent.avatar.profile));
  }

  // ---- the Avatar Studio's visual pickers: one .pick button per real, --

  // picker already are, reused rather than reinvented. Clicking one only

  function wireDigitalHumanOptions(){

        const group = btn.closest(".dh-options");

        DH_PREVIEW[agent] = Object.assign({}, DH_PREVIEW[agent], {[field]: value});
