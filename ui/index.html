<meta charset="utf-8">
<!-- Stage 17.20. This page had no <meta> at all, and the missing viewport
     is not a tidiness point: without it a phone lays the document out at a
     980px virtual width and then scales the result down, so every rule in
     this page's own phone band - the stacked columns, the scrolling
     surface nav, the "keep the Digital Human substantial" height - has
     never once applied on a real phone. Measured, not assumed: in a real
     browser at a 390px device width, window.innerWidth read 980 before
     this line and 390 after it. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Operating System</title>
<style>
  /* ---- typography: the declared font is the shipped font ---------------
     This page declared "IBM Plex Mono"/"Space Mono" for its whole life and
     shipped neither, so every browser silently fell through the stack to
     whatever monospace face the machine happened to have - a UI rendering
     in a font nobody chose. Cascadia Mono is now vendored beside the
     Three.js build it already ships (ui/vendor/CascadiaMono.ttf, SIL OFL)
     and served by scripts/serve_ui.py's own VENDOR_ASSETS allowlist. The
     URL is relative on purpose: the static export sits in ui/ next to
     ui/vendor/, and the served page resolves the same path to /vendor/... -
     one declaration, both surfaces, and no network in either (see
     test_the_shell_loads_nothing_from_the_network). */
  @font-face{
    font-family:"Cascadia Mono";
    src:url("vendor/CascadiaMono.ttf") format("truetype");
    font-weight:200 700;font-style:normal;font-display:swap;
  }
  /* Shipping one mono and setting the entire product in it produced
     exactly what a terminal looks like, which is what this interface
     looked like. A typography *system* needs more than one voice, so
     there are now three faces doing three different jobs, each a real
     vendored file, each SIL OFL with its licence shipped beside it:

       Space Grotesk  display - an agent's name, section headings. A
                      geometric face with real character, so an agent
                      reads as somebody rather than as a log line.
       Inter          text - conversation, controls, prose. Chosen for
                      being unremarkable at reading sizes, which is the
                      whole job.
       Cascadia Mono  metadata and technical readouts only - kept, and
                      now *scoped*, so a number that is genuinely a
                      machine fact still looks like one.

     Both new faces are variable woff2: one file each for the whole
     weight range this page uses. */
  @font-face{
    font-family:"Space Grotesk";
    src:url("vendor/SpaceGrotesk.woff2") format("woff2");
    font-weight:300 700;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"Inter";
    src:url("vendor/Inter.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:swap;
  }
  :root{
    --void:#05070a; --deep:#0b1116; --deep-2:#0e141a;
    --ink:#eaf7fa; --ink-2:#c9d3dc; --ink-3:#5c6772; --ink-4:#39424c;
    --alfred:#7dd8e8; --alfred-2:#c7f3fa;
    --spec:#8fb6c8;
    --sys:#8fa3cc;
    --ok:#4fd1a5; --warn:#e8b84f; --bad:#e2685f;
    --ghost:#232b34; --ghost-2:#3a434d;
    --glass:rgba(10,15,25,.55); --edge:rgba(140,170,225,.14); --edge-2:rgba(140,170,225,.3);
    /* --font is the page's default: text, not code. --display carries
       identity and headings. --mono is now what its name always claimed
       and never was - the *metadata* face, never the whole interface. */
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --display:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* One type scale, five roles - the hierarchy a person reads before
       they read a single word: whose screen this is, what section they
       are in, what was actually said, what they can do about it, and
       what the system knows about it. Every new surface below sizes
       itself from these rather than picking another number. */
    --t-agent:clamp(34px,5vw,68px);
    --t-head:clamp(19px,2.4vw,29px);
    --t-body:15.5px;
    --t-control:13px;
    --t-meta:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--void);color:var(--ink);font-family:var(--font);
    font-size:var(--t-body);line-height:1.55;letter-spacing:0;
    -webkit-font-smoothing:antialiased;overflow:hidden;
    text-rendering:optimizeLegibility;
  }

  /* ---- the environment ------------------------------------------------ */
  #scene{position:fixed;inset:0;z-index:0;display:block}
  .atmos{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(circle at 50% 42%,rgba(125,216,232,.10),transparent 46%),
      radial-gradient(circle at 50% 42%,rgba(125,216,232,.05),transparent 68%),
      radial-gradient(1400px 900px at 82% 108%,rgba(143,182,200,.045),transparent 62%);
  }
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 50% 46%,transparent 34%,rgba(5,7,10,.62) 76%,rgba(5,7,10,.94) 100%);
  }
  .scan{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.32;
    background:repeating-linear-gradient(180deg,rgba(140,170,225,.05) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay}

  /* ---- shell ---------------------------------------------------------- */
  .env{position:relative;z-index:2;height:100%;display:grid;
    grid-template-rows:auto 1fr auto;pointer-events:none}
  .env > *{pointer-events:auto}

  .crown{display:flex;align-items:center;gap:18px;padding:20px clamp(18px,3vw,40px) 0}
  .sigil{width:30px;height:30px;position:relative;flex:none}
  .sigil svg{position:absolute;inset:0}
  .sigil .core{animation:breathe 4.2s ease-in-out infinite;transform-origin:center}
  @keyframes breathe{0%,100%{opacity:.6;r:3}50%{opacity:1;r:4.2}}
  .whoami .n{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase}
  .whoami .s{font-size:10.5px;color:var(--ink-4);letter-spacing:.16em;text-transform:uppercase;
    font-family:var(--mono);margin-top:3px}
  .crown .right{margin-left:auto;text-align:right;display:flex;align-items:center;gap:14px}
  .crown .right .s{font-size:10px;color:var(--ink-4);font-family:var(--mono);letter-spacing:.08em}

  /* ---- ambient voice activation: a persistent chrome indicator, never
     re-created by go()/refreshFromLive() because it lives outside #stage - */
  .voice-toggle{display:flex;align-items:center;gap:7px;background:none;border:1px solid var(--edge);
    border-radius:20px;padding:5px 11px;cursor:pointer;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.12em;color:var(--ink-3)}
  .voice-toggle:hover{border-color:var(--edge-2)}
  .voice-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:none}
  .voice-toggle.idle .voice-dot{background:var(--ink-4)}
  .voice-toggle.activated .voice-dot,.voice-toggle.listening .voice-dot{background:var(--alfred);
    animation:breathe 1.6s ease-in-out infinite}
  .voice-toggle.thinking .voice-dot,.voice-toggle.speaking .voice-dot{background:var(--ok)}
  .voice-toggle.unavailable{color:var(--ink-4);cursor:default}
  .voice-toggle.unavailable .voice-dot{background:var(--bad)}

  /* ---- stage: where a surface lives ----------------------------------- */
  .stage{position:relative;overflow:hidden;display:grid;place-items:center;
    padding:clamp(10px,2vh,26px) clamp(16px,3vw,44px)}
  .view{position:absolute;inset:clamp(10px,2vh,26px) clamp(16px,3vw,44px);
    display:none;overflow:auto;scrollbar-width:thin}
  .view::-webkit-scrollbar{width:7px}
  .view::-webkit-scrollbar-thumb{background:rgba(140,170,225,.18);border-radius:7px}
  .view.on{display:block;animation:enter .5s cubic-bezier(.16,.8,.28,1)}
  @keyframes enter{from{opacity:0;transform:translateZ(0) scale(.985)}to{opacity:1;transform:none}}
  /* Stage 17.15 bug fix: go()'s own `no-enter` marker, added only when
     it is re-rendering the view it was already on (a live poll, never
     a genuine navigation) - see go()'s own comment for the real bug
     this stops: the entrance fade replaying every 5s forever. Higher
     specificity than .view.on alone, so it wins without touching that
     rule or the real navigation case it still serves. */
  .view.on.no-enter{animation:none}

  /* ---- the modes (not buttons — gateways) ------------------------------ */
  .modes{display:flex;gap:clamp(6px,1.4vw,22px);justify-content:center;flex-wrap:wrap;
    padding:0 clamp(16px,3vw,40px) 22px}
  .mode{
    appearance:none;background:none;border:none;color:inherit;font:inherit;cursor:pointer;
    position:relative;padding:13px 22px 14px;min-width:132px;text-align:center;
    transition:transform .3s cubic-bezier(.16,.8,.28,1);
  }
  .mode:before{content:"";position:absolute;inset:0;border-radius:3px;
    background:linear-gradient(180deg,rgba(125,216,232,.09),transparent 70%);
    opacity:0;transition:opacity .3s}
  .mode:after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--alfred),transparent);
    transform:translateX(-50%);transition:width .35s cubic-bezier(.16,.8,.28,1);
    box-shadow:0 0 12px var(--alfred)}
  .mode:hover{transform:translateY(-2px)}
  .mode:hover:before{opacity:1}
  .mode:hover:after{width:70%}
  .mode[aria-current="true"]:after{width:100%}
  .mode[aria-current="true"] .lbl{color:var(--ink)}
  .mode .lbl{display:block;font-family:var(--display);font-size:12.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);transition:color .3s}
  .mode .cap{display:block;font-size:9.5px;letter-spacing:.13em;color:var(--ink-4);
    font-family:var(--font);margin-top:5px;text-transform:uppercase}
  /* Two tiers in one bar. The person's own surfaces - the private agent
     interface and the Conversation Room - are the primary ones; the deep
     observability and configuration surfaces behind them are still one
     click away and still complete, they simply stop competing for the
     attention the agent itself should have. Nothing was removed: every
     surface this page has ever had is still in MODES below. */
  .mode.deep{padding:12px 14px 13px;min-width:0}
  .mode.deep .lbl{font-size:10px;letter-spacing:.13em;color:var(--ink-4)}
  .mode.deep .cap{display:none}
  .mode.deep:before{background:linear-gradient(180deg,rgba(140,170,225,.06),transparent 70%)}
  .mode.deep:after{background:linear-gradient(90deg,transparent,var(--ink-3),transparent);
    box-shadow:none}
  .mode.deep[aria-current="true"] .lbl{color:var(--ink-2)}
  .mode.tier-start{margin-left:clamp(6px,2vw,26px);border-left:1px solid var(--edge);
    padding-left:clamp(10px,2vw,24px)}

  /* ---- glass: panels that sit INSIDE the space ------------------------- */
  .glass{background:var(--glass);border:1px solid var(--edge);border-radius:2px;
    backdrop-filter:blur(22px) saturate(1.1);position:relative}
  .glass:before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(160deg,rgba(160,190,240,.055),transparent 42%)}
  .glass > *{position:relative}
  .cut{position:absolute;width:7px;height:7px;border:1px solid var(--edge-2);pointer-events:none}
  .cut.tl{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .cut.br{bottom:-1px;right:-1px;border-left:0;border-top:0}

  .lab{font-size:9.5px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;
    color:var(--ink-4);font-family:var(--mono)}

  /* ---- control: the orrery -------------------------------------------- */
  .orrery{height:100%;display:grid;grid-template-columns:1fr;place-items:center;position:relative}
  .core-id{text-align:center;max-width:520px}
  /* Was clamp(38px,7.5vw,84px) - an agent's name set 84px tall across the
     first screen a person saw, which is a splash screen, not a system
     view. The Control Center is deep observability now (see .mode.deep):
     the orchestrator is still the centre of the orrery, at a size that
     belongs to a heading rather than a title card. */
  .core-id .name{font-size:clamp(26px,4.4vw,46px);font-weight:300;letter-spacing:.14em;
    margin:0 0 4px 0;text-indent:.14em;font-family:var(--display);
    background:linear-gradient(180deg,#fff,var(--alfred-2) 55%,rgba(125,216,232,.55));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(125,216,232,.32))}
  /* The orrery's own subtitle is now the agent's real declared role - a
     sentence, not a one-word label - so it is set as a sentence rather
     than as widely-tracked uppercase mono, which at this length was a
     wall of letters nobody would read. */
  .core-id .role{font-size:13.5px;letter-spacing:.005em;line-height:1.5;
    color:var(--ink-3);margin:0 auto 26px;max-width:52ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .facets{display:flex;gap:0;justify-content:center;align-items:flex-end;flex-wrap:wrap;
    border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
  .facet{padding:13px 18px;min-width:104px;position:relative}
  .facet + .facet:before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;
    background:var(--edge)}
  .facet .k{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-4);
    font-family:var(--mono);margin-bottom:6px}
  .facet .v{font-size:12.5px;color:var(--ink);font-weight:500}
  .facet .v .dot,.facet .v .pdot{margin-right:6px}
  .facet .glyph{display:flex;justify-content:center;margin-bottom:4px}

  /* ---- roadmap: reserved, not real ------------------------------------- */
  .roadmap{margin-top:22px;text-align:center}
  .roadmap .lab{margin-bottom:9px}
  .ghosts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin:0 auto}

  /* ---- management: real, governed operations, not one more display ----
     Foundation Repair #5 (reconciliation audit, 2026-09-05). The orrery
     above is real-time observability; this is the interactive counterpart
     the audit found missing - provider/credential/connection/capability/
     voice management and the durable action log, reached through
     POST /command (see scripts/serve_ui.py's own route_command), the
     identical run_command() a terminal session already calls. */
  .mgmt{margin-top:22px;text-align:center}
  .mgmt .lab{margin-bottom:9px}
  .mgmt-buttons{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .mgmt-btn{appearance:none;cursor:pointer;background:none;color:var(--ink-3);
    border:1px solid var(--edge);border-radius:4px;padding:4px 10px;
    font:10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .mgmt-btn:hover{color:var(--ink);border-color:var(--ink-4)}
  .mgmt-row{display:flex;gap:6px;max-width:480px;margin:0 auto 10px}
  .mgmt-row input{flex:1;background:transparent;color:var(--ink);
    border:1px solid var(--edge);border-radius:4px;padding:5px 8px;font:11px var(--mono)}
  .mgmt-row button{appearance:none;cursor:pointer;background:none;color:var(--ink-3);
    border:1px solid var(--edge);border-radius:4px;padding:5px 12px;font:10.5px var(--mono)}
  .mgmt-out{max-width:560px;margin:0 auto;max-height:220px;overflow:auto;text-align:left;
    white-space:pre-wrap;word-break:break-word;font:11px/1.5 var(--mono);color:var(--ink-3);
    border:1px solid var(--edge);border-radius:6px;padding:10px;background:rgba(255,255,255,.02)}
  .mgmt-note{margin-top:6px;font-size:9.5px;color:var(--ink-4);max-width:480px;
    margin-left:auto;margin-right:auto}
  .mgmt-sub{margin-top:16px;padding-top:14px;border-top:1px solid var(--edge)}
  .mgmt-row select{background:transparent;color:var(--ink);border:1px solid var(--edge);
    border-radius:4px;padding:5px 6px;font:11px var(--mono)}

  .satellites{position:absolute;inset:0;pointer-events:none}
  /* A satellite is a <button>, and this rule never reset the user agent's
     own button styling - so every specialist card carried a light-grey
     background and a 2px outset border underneath its glass panel, which
     is why they rendered as pale boxes with unreadable labels. Confirmed
     by reading the computed style in a real browser (background was
     rgb(240,240,240)), not guessed. The same four-property reset .mode
     above has always had. */
  .sat{appearance:none;background:none;border:none;color:inherit;font:inherit;
    position:absolute;pointer-events:auto;cursor:pointer;text-align:left;width:190px;
    transition:transform .4s cubic-bezier(.16,.8,.28,1)}
  .sat:hover{transform:translateY(-3px)}
  .sat .glass{padding:13px 15px}
  .sat .nm{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.03em;
    margin-bottom:3px;color:var(--spec)}
  .sat .rl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);
    font-family:var(--mono);margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .sat .row{display:flex;justify-content:space-between;font-size:10.5px;
    font-family:var(--mono);color:var(--ink-3);padding:2px 0}
  .sat .row b{color:var(--ink-2);font-weight:500}

  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle}
  .GREEN{background:var(--ok);box-shadow:0 0 8px rgba(79,209,165,.7)}
  .AMBER{background:var(--warn);box-shadow:0 0 8px rgba(232,184,79,.6)}
  .RED{background:var(--bad);box-shadow:0 0 8px rgba(226,104,95,.6)}

  /* Stage 17: an AgentPresence's own state - idle/listening/speaking -
     a separate fact from brain health (.GREEN/.AMBER/.RED above) and
     from "spoke most recently" (.being.live below), so it gets its own
     small dot rather than borrowing either. */
  .pdot{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle;
    background:var(--ink-4)}
  .pdot.listening{background:var(--alfred);box-shadow:0 0 7px rgba(125,216,232,.65);
    animation:pdotpulse 1.7s ease-in-out infinite}
  .pdot.speaking{background:var(--ok);box-shadow:0 0 7px rgba(79,209,165,.7);
    animation:pdotpulse 1.05s ease-in-out infinite}
  @keyframes pdotpulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
  /* covered by this page's one global prefers-reduced-motion rule below -
     no second motion system, same discipline identityGlyph()'s spin uses */

  /* ---- the room -------------------------------------------------------- */
  /* Stage 17.17: five real rows, not four - .room-bodies (added Stage
     17.6A, after this rule was first written) was never counted here,
     so the grid's one flexible (1fr) track silently fell on .presence
     instead of .transcript: the small roster of orbs would stretch to
     fill available height while the actual message list grew with its
     content instead of scrolling internally, pushing the composer
     down and, in a long conversation, off the visible view entirely.
     overflow:auto on .transcript already gives it the correct implied
     zero minimum size for a 1fr track (a grid item with a non-visible
     overflow computes an automatic minimum size of 0 per spec) - the
     only thing missing was the row count itself. */
  .room{height:100%;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:16px}
  .presence{display:flex;gap:clamp(10px,2vw,30px);justify-content:center;flex-wrap:wrap}
  .being{text-align:center;width:96px;transition:transform .4s cubic-bezier(.16,.8,.28,1)}
  .being .orb{width:56px;height:56px;margin:0 auto 9px;border-radius:50%;position:relative;
    display:grid;place-items:center;font-size:15px;font-weight:300;letter-spacing:.08em;
    border:1px solid var(--edge-2);color:var(--ink-2);
    background:radial-gradient(circle at 34% 28%,rgba(140,170,225,.18),rgba(8,12,20,.9) 68%)}
  .being .orb:after{content:"";position:absolute;inset:-7px;border-radius:50%;
    border:1px solid transparent;transition:border-color .4s}
  .being.agent .orb{border-color:rgba(143,182,200,.42);color:var(--spec);
    background:radial-gradient(circle at 34% 28%,rgba(143,182,200,.2),rgba(8,12,20,.9) 68%)}
  .being.manager .orb{border-color:rgba(125,216,232,.5);color:var(--alfred-2);
    background:radial-gradient(circle at 34% 28%,rgba(125,216,232,.24),rgba(8,12,20,.9) 68%)}
  .being.person .orb{border-color:rgba(79,209,165,.4);color:var(--ok)}
  .being.live .orb:after{border-color:currentColor;animation:halo 2.6s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.09)}}
  .being .orb .pdot{position:absolute;top:3px;right:3px}
  /* Stage 17.2 - natural idle: a real presence should not read as dead
     between turns. Purely decorative, exactly the discipline
     identityGlyph()'s own idspin already documents ("decoration, never
     a claim that the agent is doing anything") - the same CSS-only,
     no-render-loop, prefers-reduced-motion-respecting approach, applied
     to an agent's own room orb rather than its workspace glyph. Scoped
     to agent/manager orbs only: a person is not an AgentPresence, and
     giving their own orb the same "breathing" would claim an agent
     concept for someone who is not one. */
  .being.agent .orb,.being.manager .orb{animation:breathe 5.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
  .being .nm{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.03em}
  .being .rl{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4);
    font-family:var(--mono);margin-top:3px}

  .transcript{overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px}
  .transcript::-webkit-scrollbar{width:6px}
  .transcript::-webkit-scrollbar-thumb{background:rgba(140,170,225,.16);border-radius:6px}
  .turn{max-width:min(720px,90%);display:flex;gap:12px}
  .turn.self{margin-left:auto;flex-direction:row-reverse;text-align:right}
  .turn .who{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    font-family:var(--display);font-weight:600;margin-bottom:6px;color:var(--spec)}
  .turn.mgr .who{color:var(--alfred-2)}
  .turn.self .who{color:var(--ok)}
  .turn .who .to{color:var(--ink-4);margin-left:8px;letter-spacing:.05em}
  .turn .body{padding:12px 16px;border-left:1px solid var(--edge-2);flex:1;min-width:0}
  .turn.self .body{border-left:0;border-right:1px solid rgba(79,209,165,.34)}
  .turn.mgr .body{border-left-color:rgba(125,216,232,.4)}
  .turn p{margin:0;font-size:var(--t-body);line-height:1.62;white-space:pre-wrap;color:var(--ink);
    letter-spacing:.005em}

  .say{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
  .say input{flex:1;background:none;border:none;color:var(--ink);font:inherit;
    font-size:var(--t-body);outline:none;letter-spacing:.005em;min-width:120px}
  .say input::placeholder{color:var(--ink-4)}
  .say .state{font-size:9.5px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:var(--warn);white-space:nowrap}

  /* Stage 17: an explicit "who am I speaking to" choice, alongside (never
     instead of) the words-alone addressing this room already had. Each
     pill is a real, already-registered agent - never a name typed here. */
  .who-picker{display:flex;gap:6px;flex-wrap:wrap;width:100%;order:-1}
  .pick{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 10px;border:1px solid var(--edge-2);background:transparent;color:var(--ink-3);
    cursor:pointer;border-radius:2px}
  .pick:hover{color:var(--ink)}
  .pick.on{color:rgb(var(--pc,125,216,232));border-color:rgba(var(--pc,125,216,232),.5);
    background:rgba(var(--pc,125,216,232),.08)}
  .pick:disabled{cursor:default;opacity:.55}

  /* Stage 17.2: a distinct concept from .who-picker above - WHO to talk
     to versus WHAT that agent looks like. Same .pick styling on purpose
     (both are "choose one of these real, already-known options"), but
     never the same control: choosing an appearance must never change
     who is being addressed, and this picker never touches selectedAgent. */
  .avatar-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  /* Final acceptance sweep (2026-09-08) - the environment picker, the
     identical shape/behaviour as .avatar-picker above, for the sibling
     preference (EnvironmentProvider) that previously had a real,
     governed backend and HTTP route but no UI control at all. */
  .env-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  /* Stage 17.6A - the beginning of a real (never fabricated-catalog)
     Digital Human editor: free-text fields, one per open style
     dimension, writing through the existing governed POST /profile
     path. auto-fill/minmax alone handles small screens. */
  .dh-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:10px;margin-top:10px;align-items:end}
  .dh-field{display:flex;flex-direction:column;gap:4px}
  .dh-k{font-size:9px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-4)}
  .dh-field input{background:var(--void);border:1px solid var(--edge-2);color:var(--ink);
    font:inherit;font-size:12px;padding:6px 8px;border-radius:2px}
  .dh-field input::placeholder{color:var(--ink-4)}
  .dh-field input:disabled{opacity:.5}
  .dh-save{grid-column:1/-1;justify-self:start;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;padding:6px 16px;border:1px solid var(--edge-2);
    background:transparent;color:var(--ink-2);cursor:pointer;border-radius:2px}
  .dh-save:hover{color:var(--ink)}
  .dh-save:disabled{cursor:default;opacity:.5}

  /* Stage 17.11 - the Avatar Studio's own visual pickers, reusing .pick
     (no new button styling) inside their own flex-wrap row, plus a small
     current-value readout so a pre-Stage-17.11 custom value stays
     visible even when it does not match any curated option. auto-fill/
     minmax on .dh-fields above already handles small screens - no new
     media query needed. */
  .dh-options{display:flex;gap:6px;flex-wrap:wrap}
  .dh-current{font-size:9.5px;color:var(--ink-4)}

  /* This correction pass - the merged "Avatar Studio" panel: a small
     section label ahead of the body picker and the presentation grid
     (reusing .dh-k's own type styling), and a static, dimmed roadmap
     row (reusing .chip.off - the exact same "ghost, not real yet"
     token this file's own ROADMAP array already uses) so what is
     genuinely configurable today is never confused with what is only
     architecturally reserved. */
  .dh-sub{font-size:9px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-4);margin-top:10px}
  .dh-roadmap{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}

  /* ---- the private agent interface -------------------------------------
     One surface, any agent - see V.agent in the script below for why this
     is generic over an identity rather than a screen per agent, and why it
     must never become a second Conversation Room. The visual grammar is
     deliberately unlike .room's: one agent filling the space and addressed
     directly, never a roster of several sharing it.

     Three real direct children, three row tracks - the exact count .room
     silently got wrong for two stages (see its own rule above). The middle
     one is the flexible track because the conversation is what should grow
     and scroll; the identity above it and the context below it are both
     content-sized. */
  /* Stage 17.21 - THE COMPOSITION IS AN ENVIRONMENT, NOT A DASHBOARD.

     What this replaces, and why. Every pass up to 17.20 laid this surface
     out as two columns - conversation on the left, a bordered card holding
     the Digital Human on the right. Looked at honestly that is a dashboard
     with a character panel in it, and it reads as one: two boxes side by
     side, the agent contained in one of them, a frame drawn around the
     thing that is supposed to be the space you are standing in.

     The intended experience is "I have entered this agent's environment".
     So the environment is now the surface itself: one full-bleed stage
     that owns the whole area, with the Digital Human standing inside it,
     and the conversation LAYERED ON TOP of it as a glass panel rather than
     parked beside it in a column of its own. There is no card around the
     agent any more because there is no longer anything for a card to be
     beside.

     Note what did NOT change: still one `.private` per agent, still
     generic over an identity, still three real children in three tracks,
     still exactly one avatar mount path. This is a composition change. */
  .private{display:grid;grid-template-rows:minmax(0,1fr) auto;
    gap:clamp(10px,1.4vh,16px);min-height:100%}

  /* The environment. Fills its track, carries the agent's own hue, and is
     the positioning context every layer below sits in. */
  .private-env{position:relative;min-height:min(72vh,720px);border-radius:4px;
    overflow:hidden;isolation:isolate;
    border:1px solid rgba(var(--ac,125,216,232),.20);
    background:
      radial-gradient(120% 85% at 62% 4%,rgba(var(--ac,125,216,232),.13),transparent 64%),
      linear-gradient(180deg,rgba(8,12,18,.92),var(--void) 72%);
    box-shadow:inset 0 0 140px rgba(var(--ac,125,216,232),.055);
    transition:border-color .35s,box-shadow .35s}
  .private-env.speaking{border-color:rgba(79,209,165,.5);
    box-shadow:inset 0 0 140px rgba(79,209,165,.07),0 0 30px rgba(79,209,165,.16)}
  .private-env.listening{border-color:rgba(125,216,232,.5);
    box-shadow:inset 0 0 140px rgba(125,216,232,.07),0 0 26px rgba(125,216,232,.14)}

  /* The live 3D stage IS the background of this surface - absolutely
     positioned behind every layer, no border of its own, no margin. It
     keeps the .agent3d class so the one canonical mount path
     (wireAvatarBody3D -> mountAvatarBody3D -> mountStage) finds it
     exactly as before; these rules only remove the box it used to be in. */
  .private-env .agent3d{position:absolute;inset:0;height:auto;width:auto;
    margin:0;border:none;border-radius:0;background:none;box-shadow:none}

  /* A scrim, so text laid over a live scene stays readable without
     dimming the scene everywhere. Strongest at the bottom-left, under the
     conversation panel; nearly absent over the figure's own upper body. */
  .env-veil{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to top,rgba(4,7,11,.88) 0%,rgba(4,7,11,.45) 26%,transparent 56%),
      linear-gradient(to right,rgba(4,7,11,.72) 0%,rgba(4,7,11,.22) 34%,transparent 58%)}

  /* --- the layers ---------------------------------------------------- */
  .env-top{position:absolute;top:0;left:0;right:0;z-index:2;
    display:flex;align-items:flex-start;gap:clamp(10px,1.6vw,18px);flex-wrap:wrap;
    padding:clamp(16px,2.4vh,26px) clamp(18px,2.4vw,30px) 0}
  .env-top .glyphwrap{flex:none;display:flex;align-items:center;cursor:pointer}
  .env-top .who{min-width:0}
  .env-top .nm{font-family:var(--display);font-size:var(--t-agent);font-weight:600;
    letter-spacing:-.012em;line-height:.98;color:var(--ink);
    text-shadow:0 2px 26px rgba(0,0,0,.7)}
  .env-top .rl{font-family:var(--font);font-size:var(--t-control);color:var(--ink-3);
    margin-top:9px;max-width:46ch;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .env-top .pstate{font-family:var(--mono);font-size:var(--t-meta);letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-4)}
  .env-top .pdot{margin:0 6px 0 10px}
  .private-switch{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    justify-content:flex-end;min-width:200px}
  .private-switch .lab{width:100%;text-align:right;margin-bottom:3px;white-space:nowrap}

  /* The conversation, layered INTO the environment. A glass panel that
     floats over the scene at the bottom-left; the figure is framed to the
     right of it (see frameShiftFrac in mountAvatarBody3D) so the two
     occupy the same space without either being a box beside the other. */
  .env-talk{position:absolute;left:clamp(18px,2.4vw,30px);bottom:clamp(16px,2.2vh,24px);
    z-index:2;width:min(46%,540px);max-height:66%;
    display:flex;flex-direction:column;gap:10px;min-height:0}
  .env-talk .private-transcript{overflow:auto;display:flex;flex-direction:column;gap:13px;
    padding:2px 2px 6px 0;min-height:0;
    /* The panel floats over a live scene, so a hard cut at its top edge
       reads as a rendering fault rather than as "there is more above".
       A short fade says the same thing without a scrollbar having to. */
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px);
    mask-image:linear-gradient(to bottom,transparent 0,#000 22px)}
  .private-transcript::-webkit-scrollbar{width:6px}
  .private-transcript::-webkit-scrollbar-thumb{background:rgba(140,170,225,.18);border-radius:6px}
  /* The composer reads as glass over a scene rather than as a form field
     on a page - it is standing in the room, not under it. */
  .env-talk .private-say{background:rgba(10,16,24,.72);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(var(--ac,125,216,232),.24)}
  .private-say .addressed{font-size:var(--t-meta);font-family:var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-4);width:100%;order:-1}

  .env-foot{position:absolute;right:clamp(18px,2.4vw,30px);bottom:clamp(16px,2.2vh,24px);
    z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:5px;
    font-size:var(--t-meta);font-family:var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-4);text-align:right;pointer-events:none}

  /* Last in the hierarchy, and quiet on purpose: what this agent is made
     of, under the environment rather than inside it. */
  .private-context{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
    gap:12px 24px;border-top:1px solid var(--edge);padding-top:14px}
  .private-context .pair.wide{grid-column:1/-1}
  .private-context .more{font-family:var(--mono);font-size:var(--t-meta);letter-spacing:.1em;
    color:var(--ink-4);margin-left:4px}

  /* The middle band. The environment stays the surface - it does not
     become a column again - it simply gets shorter, and the conversation
     panel widens because there is less width to hold it off the figure. */
  @media (max-width:1080px){
    .private-env{min-height:min(62vh,560px)}
    .env-talk{width:min(56%,460px);max-height:60%}
  }

  /* ---- detail views ---------------------------------------------------- */
  .slab{max-width:1060px;margin:0 auto}
  .slab h2{font-family:var(--display);font-size:var(--t-head);font-weight:600;
    letter-spacing:-.014em;text-transform:none;margin:0 0 10px;color:var(--ink)}
  .slab .intro{font-size:13.5px;color:var(--ink-3);line-height:1.7;max-width:66ch;margin:0 0 26px}
  .band{border-top:1px solid var(--edge);padding:20px 0}
  .band:last-child{border-bottom:1px solid var(--edge)}
  .band .head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .idglyph{flex:none}

  /* ---- agent3d: a genuine WebGL stage, not a Canvas 2D approximation --- *
   * One box style, three independent surfaces: identity (data-agent3d),
   * Brain (data-brain3d) and Memory (data-memory3d) each mount their own
   * stage into a div carrying this same class. */
  .agent3d{position:relative;width:100%;height:300px;margin-bottom:20px;
    border:1px solid var(--edge);overflow:hidden;
    background:radial-gradient(circle at 50% 38%,rgba(125,216,232,.07),transparent 68%),var(--void)}
  /* Stage 17.20: Cognition and Memory are the two surfaces whose whole
     job is a shape a person has to recognise, and 300px in a ~1060px
     column is a 3.5:1 letterbox - a vertical FOV frames by height, so
     the subject was drawn small and two thirds of the box stayed empty.
     These two get a presentation height. The identity stage
     (data-agent3d) keeps the 300px diagnostic box it has always had,
     because an abstract emblem genuinely is a widget. */
  .agent3d[data-brain3d],.agent3d[data-memory3d]{height:min(48vh,420px)}
  .agent3d canvas{display:block;width:100%;height:100%}
  .agent3d-fallback{position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-4);text-align:center;padding:0 20px}
  @media (max-width:760px){.agent3d{height:180px}}

  /* Stage 17.6A - one real body per room participant, alongside (never
     replacing) the room's own decorative core above. flex-wrap alone
     handles small screens - no separate breakpoint, no device
     assumption. */
  .room-bodies{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .room-body{flex:1 1 220px;max-width:320px}
  .room-body .agent3d{height:200px;margin-bottom:8px;transition:border-color .3s,box-shadow .3s}
  .room-body-name{text-align:center;font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3)}
  .room-body.selected .agent3d{border-color:var(--alfred);box-shadow:0 0 14px rgba(125,216,232,.28)}
  /* Stage 17.8 - "stronger but tasteful": a gentle pulse on the real
     speaker's own frame, never a new colour and never applied to
     anyone else - covered by this page's one existing global
     prefers-reduced-motion rule, no second one added.
     Stage 17.17: deliberately declared AFTER .selected above, not
     before - the ordinary, common case of addressing an agent and
     then hearing them answer means .selected and .speaking often
     apply to the very same room-body at once, and with matching
     specificity the later rule wins. The real canonical speaker must
     always be the one visually obvious signal, so speaking's own
     green glow now reliably wins that tie rather than being silently
     overridden by the merely-addressed blue border. */
  .room-body.speaking .agent3d{border-color:var(--ok);box-shadow:0 0 18px rgba(79,209,165,.35);
    animation:speakerglow 1.8s ease-in-out infinite}
  @keyframes speakerglow{0%,100%{box-shadow:0 0 18px rgba(79,209,165,.35)}
    50%{box-shadow:0 0 30px rgba(79,209,165,.6)}}

  .idspin{transform-origin:50% 50%;animation:idspin 26s linear infinite}
  .idspin.fast{animation-duration:14s}
  @keyframes idspin{to{transform:rotate(360deg)}}
  .band .head .t{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.008em}
  .band .head .u{font-size:9.5px;font-family:var(--mono);letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-4)}
  .pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px 26px}
  .pair .k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);
    font-family:var(--mono);margin-bottom:5px}
  .pair .v{font-size:var(--t-control);color:var(--ink);font-family:var(--font);
    word-break:break-word;line-height:1.55;letter-spacing:.002em}
  .chip{display:inline-block;font-size:11.5px;font-family:var(--font);letter-spacing:.005em;
    padding:3.5px 9px;margin:0 5px 5px 0;border:1px solid var(--edge-2);color:var(--ink-2);
    border-radius:2px}
  .chip.on{color:var(--ok);border-color:rgba(79,209,165,.32)}
  .chip.off{opacity:1;color:var(--ghost-2);border-color:var(--ghost);border-style:dashed;background:transparent}
  .void{color:var(--ink-4);font-size:12px;font-style:italic}
  /* Stage 17.20: the unused private line. margin:auto inside the
     transcript's own flex column is what centres it in whatever height
     the column has left, so it never sits pinned to the top of an empty
     black rectangle again. */
  .opening{margin:auto;display:flex;flex-direction:column;align-items:center;
    text-align:center;gap:12px;padding:24px 18px;max-width:38ch}
  .opening .mark{opacity:.5}
  .opening .lede{font-family:var(--display);font-size:var(--t-head);font-weight:500;
    letter-spacing:.01em;color:var(--ink-2)}
  .opening .sum{margin:0;font-size:var(--t-body);line-height:1.6;color:var(--ink-3)}

  .memo{border-left:1px solid rgba(125,216,232,.28);padding:3px 0 3px 15px;margin-bottom:14px}
  .memo .m{font-size:9.5px;font-family:var(--mono);letter-spacing:.09em;color:var(--ink-4);margin-bottom:4px}
  .memo p{margin:0;font-size:13.5px;line-height:1.62}

  .ev{display:grid;grid-template-columns:150px 96px 1fr;gap:16px;padding:11px 0;
    border-bottom:1px solid var(--edge);font-size:12.4px;align-items:baseline}
  .ev:last-child{border-bottom:none}
  .ev time,.ev .c{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-4)}
  .ev .c{color:var(--alfred);text-transform:uppercase}

  .absent{border:1px dashed var(--edge-2);padding:18px 20px;background:rgba(10,15,25,.4)}
  .absent .why{color:var(--warn);font-size:12.5px;font-family:var(--font);margin-top:7px}

  /* ---- phone ----------------------------------------------------------- */
  @media (max-width:760px){
    .crown{padding:14px 18px 0;gap:12px}
    .satellites{position:static;display:grid;gap:12px;grid-template-columns:1fr;
      margin-top:44px;padding-bottom:8px;order:2}
    .core-id{order:1}
    .sat{position:static!important;width:100%}
    .orrery{place-items:start center;padding-top:12px;overflow:auto}
    .core-id .name{font-size:clamp(22px,7.5vw,32px)}
    /* The private interface on a phone. The environment stays the
       surface - it is never demoted to a thumbnail above a form - but a
       390px screen cannot hold a floating panel off to one side of a
       figure, so the conversation unpins itself and sits under the
       environment as its own block. The environment keeps real height:
       50vh with a floor, so the Digital Human stays readable.

       All THREE overlay layers unpin together, and that is the whole
       rule: on the desktop composition .env-top, .env-talk and .env-foot
       are siblings floating over one full-bleed environment, and at this
       width they become one ordered column inside it instead. Unpinning
       only some of them is not a smaller version of that idea - it is a
       broken one, because an absolutely-positioned layer is removed from
       flow and therefore cannot reserve the space the in-flow ones then
       try to occupy. That is exactly what a browser showed at 390x844:
       .env-top stayed pinned while the other two went in-flow, so the
       agent's name, role and the agent switch were painted on top of the
       whole transcript - a 224px collision. The fix is not a nudge or a
       margin; it is that this list is complete.

       `relative`, not `static`, and that is load-bearing rather than
       stylistic. These layers sit over a canvas and a veil that are both
       absolutely positioned, and painting order puts every positioned
       box above every in-flow one - so a `static` layer goes *under* the
       scene it is supposed to be read against. Measured in a browser: the
       agent switch was in the right place, correctly sized, and
       `elementFromPoint` at its own centre returned the canvas, so the
       control was unclickable. `relative` keeps the box in flow exactly
       as `static` does while restoring the `z-index:2` these three
       already carry on the desktop composition - the same stacking as
       desktop, just laid out in a column.

       `inset:auto` completes it. The desktop rules pin these three with
       real left/right/bottom offsets, and those offsets do not stop
       applying just because the element is no longer absolute - on a
       relatively-positioned box they shift it out of its own flow
       position instead. Measured: .env-talk was pulled 18px right and
       far enough up to clip the header by 7px, and .env-foot was pushed
       1px off the left edge of the panel it sits in. Unpinning a layer
       means clearing what pinned it, not only how it was pinned. */
    .private{grid-template-rows:auto auto}
    .private-env{min-height:max(50vh,340px)}
    /* The veil carries more of the panel here, because the content does
       too. On the desktop composition the conversation is pinned to the
       lower left, so a gradient that fades out by 60% up covers
       everything that has text on it. Once all three layers unpin into a
       column they run the full height, and the top of that column - the
       agent's name and role - was left sitting on bare scene: legible
       over the dark backdrop, and not legible where it crossed the lit
       figure. So this keeps a real gradient (the scene still reads as
       lit from below, and the figure is still plainly the subject) and
       simply never reaches zero. */
    .env-veil{background:linear-gradient(to top,rgba(4,7,11,.94) 0%,rgba(4,7,11,.8) 42%,rgba(4,7,11,.66) 100%)}
    .env-top{position:relative;inset:auto;gap:12px;
      padding:clamp(14px,2vh,18px) clamp(14px,4vw,18px) 0}
    .env-top .nm{letter-spacing:.07em}
    .env-talk{position:relative;inset:auto;width:auto;max-height:none;
      padding:0 clamp(14px,4vw,18px) clamp(14px,2vh,18px);margin-top:12px}
    .env-talk .private-transcript{max-height:34vh;min-height:96px}
    .env-foot{position:relative;inset:auto;flex-direction:row;justify-content:space-between;
      align-items:baseline;padding:0 clamp(14px,4vw,18px) 12px;text-align:left}
    .private-switch{margin-left:0;width:100%}
    .private-switch .lab{text-align:left}
    .facets{border:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--edge)}
    .facet{background:var(--void);min-width:0}
    .facet + .facet:before{display:none}
    /* Eight surfaces cannot share 390px of width. Squeezing them all
       into one flex row is what actually pushed the whole document wider
       than the viewport on a phone - the labels collided and the page
       scrolled sideways. One scrolling row instead: every surface stays
       reachable, nothing is hidden, and the page itself stops
       overflowing. */
    .modes{gap:0;padding:0 12px 14px;border-top:1px solid var(--edge);
      flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
      scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .modes::-webkit-scrollbar{display:none}
    .mode{flex:0 0 auto;min-width:0;padding:11px 11px 12px;white-space:nowrap}
    .mode .lbl{font-size:9.5px;letter-spacing:.09em}
    .mode .cap{display:none}
    .mode.tier-start{margin-left:10px;padding-left:14px}
    /* The crown's own two halves stack rather than fight for one line. */
    .crown{flex-wrap:wrap}
    .crown .right{width:100%;margin-left:0;justify-content:space-between}
    .whoami .s{font-size:9.5px}
    .being{width:74px}
    .being .orb{width:44px;height:44px;font-size:12.5px}
    .ev{grid-template-columns:1fr;gap:3px}
    .turn{max-width:100%}
    /* Stage 17.17: .room-body .agent3d{height:200px} (two classes) is
       more specific than the plain .agent3d{height:180px} mobile rule
       above, so it silently never actually shrank on a phone even
       though every other 3D box on the page does - room-bodies stayed
       full-desktop height while stacking two-plus of them vertically,
       leaving little room for the transcript to scroll in below.
       Reuses the same 180px every other mobile 3D box already uses,
       not a new number. */
    .room-body .agent3d{height:180px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
(() => {
  "use strict";

  // =====================================================================
  // ONE SOURCE OF TRUTH
  //
  // Everything rendered comes from the snapshot the Python side produced.
  // Nothing on this page computes a brain mode, decides whether speech
  // works, or invents an activity state. Where the system could not answer,
  // the screen shows the reason the system gave.
  //
  // The environment behind the interface is scaled by what the snapshot
  // contains - one body per real agent - but its MOTION is decorative and
  // is marked as such below. Real activity has no producer yet, so nothing
  // here pretends to visualise it.
  // =====================================================================
  let S = null, focus = null, focusBody = null;
  // Stage 17: an explicit agent choice for the composer - who the next
  // typed line is addressed to. Lives outside go()/V.room() so it
  // survives a re-render the same way focusBody already does; a name,
  // never an agent object, and cleared the moment it stops naming a
  // currently-registered agent (see the picker's own render below).
  let selectedAgent = null;
  try { S = JSON.parse(document.getElementById("snapshot").textContent); } catch(e){}

  // ---- live vs. static: the one fact everything below is conditioned on --
  // Opened as a file (file://) there is no server on the other end of a
  // fetch, so nothing here ever attempts one. Served (http:/https:) the
  // same page can ask scripts/serve_ui.py for a fresh snapshot.json and,
  // now, post to /message - but the static export must keep working
  // exactly as it always has, with zero network activity.
  const LIVE = location.protocol === "http:" || location.protocol === "https:";

  const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const cut = `<span class="cut tl"></span><span class="cut br"></span>`;
  const ini = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const when = iso => { if(!iso) return "—";
    try{ return new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
    catch(e){ return iso; } };
  const absent = (what,why)=>`<div class="absent"><div class="lab">${esc(what)}</div>
    <div class="why">${esc(why)}</div></div>`;

  const manager = () => S.agents.find(a=>a.is_manager) || S.agents[0];
  const specialists = () => S.agents.filter(a=>!a.is_manager);

  // =====================================================================
  // AgentVisualIdentity - the one presentation boundary for "what does
  // this agent look like". Every place on this page that draws an agent
  // (the graph, a satellite card, the Room) asks identityOf() and nothing
  // else; nothing computes a hue or a shape any other way.
  //
  // It is presentation metadata, never a second registry. identityOf()
  // takes exactly the two fields the snapshot already reports for any
  // agent - `name` and `is_manager` - and returns a color/form descriptor.
  // It reads no other field and writes nothing: it cannot route a task,
  // call a tool, retain a memory, pick a provider, choose a voice, or
  // grant a connection, because it never touches any of the objects that
  // do those things. Delete identityOf() and every agent still has its
  // real Brain, Memory, Voice, capabilities and connections - it would
  // just stop having a color.
  //
  // Alfred's cyan core and faceted form are reserved, not hashed - the
  // one exception, and still just presentation of the one real fact
  // (`is_manager`) that already decided it. Every specialist's hue and
  // polygon side-count come from hashOf(name): deterministic, never
  // Math.random(), so the same agent looks the same on every render and
  // a future specialist gets its own look with nothing here changing.
  // =====================================================================
  const MANAGER_HUE = "125,216,232";
  const SPECIALIST_HUES = ["143,182,200","184,150,232","230,150,178","201,168,122","150,196,150"];
  const SPECIALIST_SIDES = [4,6,3,5];
  const hashOf = name => {
    let h = 0;
    for(const ch of String(name||"")) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    return h;
  };
  function identityOf(agent){
    const name = agent && agent.name;
    if(agent && agent.is_manager) return {key:name, hue:MANAGER_HUE, form:"core", sides:0};
    const h = hashOf(name);
    return {
      key: name,
      hue: SPECIALIST_HUES[h % SPECIALIST_HUES.length],
      form: "polygon",
      sides: SPECIALIST_SIDES[h % SPECIALIST_SIDES.length],
    };
  }

  // ---- identity glyph: the same identityOf() presence, drawn again for --
  // a workspace band. Not a second identity system - it calls identityOf()
  // and draws exactly what it returns: a faceted core for the manager, a
  // polygon for a specialist, in that agent's own hue. Motion is a CSS
  // animation (a slow spin), so it needs no render loop of its own and
  // inherits the page's one global `prefers-reduced-motion` rule - it is
  // decoration, never a claim that the agent is doing anything.
  function identityGlyph(agent, size=72){
    const id = identityOf(agent);
    const cx=32, cy=32;
    if(id.form==="core"){
      const pts=[];
      for(let i=0;i<16;i++){
        const a=(i/16)*Math.PI*2, r=i%2===0?26:13;
        pts.push(`${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`);
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true" class="idglyph">
        <circle cx="${cx}" cy="${cy}" r="30" fill="none" stroke="rgba(${id.hue},.22)" stroke-width="1"/>
        <g class="idspin"><polygon points="${pts.join(' ')}" fill="rgba(5,7,10,.92)" stroke="rgb(${id.hue})" stroke-width="1.4"/></g>
        <circle cx="${cx}" cy="${cy}" r="6" fill="rgb(${id.hue})"/>
      </svg>`;
    }
    const sides = id.sides||4, pts=[];
    for(let i=0;i<sides;i++){
      const a=(i/sides)*Math.PI*2 - Math.PI/2;
      pts.push(`${(cx+Math.cos(a)*24).toFixed(1)},${(cy+Math.sin(a)*24).toFixed(1)}`);
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true" class="idglyph">
      <circle cx="${cx}" cy="${cy}" r="30" fill="none" stroke="rgba(${id.hue},.16)" stroke-width="1"/>
      <g class="idspin"><polygon points="${pts.join(' ')}" fill="rgba(${id.hue},.82)" stroke="rgba(${id.hue},.9)" stroke-width="1.2"/></g>
    </svg>`;
  }

  // ---- brain instrument: two hemispheres, filled only as far as the ------
  // system actually verified. Same indicator (GREEN/AMBER/RED) the dot
  // elsewhere already uses - this draws it, it does not decide it.
  const brainGlyph = (brain,size=34) => {
    const full = brain.indicator === "GREEN", half = brain.indicator === "AMBER";
    const hemi = (sweep, filled) => filled
      ? `<path d="M17 4 A13 13 0 0 ${sweep} 17 30 Z" fill="var(--ok)" fill-opacity=".82"/>`
      : `<path d="M17 4 A13 13 0 0 ${sweep} 17 30 Z" fill="none" stroke="var(--ink-4)" stroke-width="1" stroke-dasharray="2,2"/>`;
    // The outer ring is instrumentation, not evidence - a scanning bezel
    // around the one real reading (the hemispheres). It spins by CSS,
    // never claims a thinking state, and is driven by nothing but its own
    // decorative animation.
    const ticks = Array.from({length:12}, (_,i)=>{
      const a = (i/12)*Math.PI*2, x1=17+Math.cos(a)*15.5, y1=17+Math.sin(a)*15.5,
            x2=17+Math.cos(a)*17, y2=17+Math.sin(a)*17;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(${full?"79,209,165":half?"232,184,79":"57,66,76"},.5)" stroke-width=".8"/>`;
    }).join("");
    return `<svg width="${size}" height="${size}" viewBox="0 0 34 34" aria-hidden="true">
      <g class="idspin">${ticks}</g>
      ${hemi(1, full||half)}${hemi(0, full)}
      <circle cx="17" cy="17" r="13" fill="none" stroke="var(--edge-2)" stroke-width=".6"/>
      <line x1="17" y1="4" x2="17" y2="30" stroke="var(--edge-2)" stroke-width=".6"/>
    </svg>`;
  };

  // ---- memory instrument: a traced ring, filled by how many records were --
  // actually sampled (observer.py samples at most 8 - MEMORY_TRACE_CAP
  // mirrors that). It is a trace, never a claimed capacity.
  const MEMORY_TRACE_CAP = 8;
  // The one place "how much of the trace is lit" is computed - a trace,
  // never a claimed capacity. memoryGlyph() and the Memory 3D stage both
  // call this rather than each rounding `sampled` their own way.
  const memoryTrace = mem => {
    const frac = Math.max(0, Math.min(1, (mem.sampled||0)/MEMORY_TRACE_CAP));
    return { frac, lit: Math.round(frac*MEMORY_TRACE_CAP) };
  };
  const svgArc = (frac,r=13,cx=17,cy=17) => {
    const a0=-Math.PI/2, a1=a0+Math.max(frac,0.0001)*Math.PI*2;
    const x0=(cx+r*Math.cos(a0)).toFixed(2), y0=(cy+r*Math.sin(a0)).toFixed(2);
    const x1=(cx+r*Math.cos(a1)).toFixed(2), y1=(cy+r*Math.sin(a1)).toFixed(2);
    return `M${x0} ${y0} A${r} ${r} 0 ${frac>0.5?1:0} 1 ${x1} ${y1}`;
  };
  const memoryGlyph = (mem,size=34) => {
    // An outer band of archival ticks - one per traced slot, lit only up
    // to the real sampled count. Decoration around a real number, not a
    // second count: the same `frac`/`lit` the Memory 3D stage uses too.
    const {frac, lit} = memoryTrace(mem);
    const bands = Array.from({length:MEMORY_TRACE_CAP}, (_,i)=>{
      const a = -Math.PI/2 + (i/MEMORY_TRACE_CAP)*Math.PI*2;
      const x1=17+Math.cos(a)*15.5, y1=17+Math.sin(a)*15.5, x2=17+Math.cos(a)*17.3, y2=17+Math.sin(a)*17.3;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(125,216,232,${i<lit?.55:.12})" stroke-width="1.1"/>`;
    }).join("");
    return `<svg width="${size}" height="${size}" viewBox="0 0 34 34" aria-hidden="true">
      <g class="idspin">${bands}</g>
      <circle cx="17" cy="17" r="13" fill="none" stroke="var(--ink-4)" stroke-width="2" opacity=".35"/>
      ${frac>0 ? `<path d="${svgArc(frac)}" fill="none" stroke="var(--alfred)" stroke-width="2" stroke-linecap="round"/>` : ""}
      <text x="17" y="20.5" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink-2)">${mem.sampled}</text>
    </svg>`;
  };

  // ---- roadmap: a documented future, not a discovered one -----------------
  // Static text, matching ARCHITECTURE.md's specialist order and the
  // voice/avatar seams the snapshot already reserves. Never read from S,
  // never joins S.agents, and the canvas below never gives it a body, a
  // link or an energy value - it is not a system that exists yet.
  const ROADMAP = ["QA / SECURITY","CODING","RESEARCH","VOICE I/O","DIGITAL HUMAN"];

  // Stage 17.6A - the same open style dimensions
  // src/services/identity/presence.py's own DIGITAL_HUMAN_STYLE_FIELDS
  // names (kept in step by hand, the same way every other JS-side
  // mirror of a Python-side closed set in this file already is - there
  // is no shared build step between the two languages). RENDERED_STYLE_
  // FIELDS names only the ones the renderer genuinely draws differently
  // today - the honest boundary the Digital Human form below labels
  // rather than hides. Stage 17.13 added the tenth field,
  // "symbolic_environment" - see AVATAR_SYMBOLIC_ENVIRONMENTS below.
  const DIGITAL_HUMAN_STYLE_FIELDS = [
    "appearance", "body", "posture", "clothing", "idle_behavior",
    "listening_behavior", "speaking_behavior", "expression_style", "gesture_style",
    "symbolic_environment", "hair_style",
  ];
  // Stage 17.6B added real (if deterministic-signature, not literal)
  // effects for gesture_style (arm-swing amplitude/rate while
  // speaking) and idle_behavior (idle sway rate) - see
  // buildHumanoidBody()/mountAvatarBody3D()'s own comments for exactly
  // what "renders" means for each: a real, per-agent-different
  // animation parameter, never a picked, named gesture. Stage 17.13
  // added symbolic_environment: a real, distinct 3D object genuinely
  // drawn (or genuinely absent) behind the body - see
  // AVATAR_SYMBOLIC_ENVIRONMENTS/symbolicEnvironmentFor() below.
  const RENDERED_STYLE_FIELDS = new Set(["posture", "body", "gesture_style", "idle_behavior", "symbolic_environment", "appearance", "clothing", "hair_style"]);

  // Stage 17.11 - the Avatar Studio's own real, extensible catalog: a
  // curated menu of already-honest values for exactly the
  // RENDERED_STYLE_FIELDS subset above, so a field can only ever gain a
  // visual picker once buildHumanoidBody/mountAvatarBody3D genuinely
  // draws it differently - never a fabricated choice for one of the
  // other five fields, which stay free text below, clearly labelled
  // "not yet rendered". Nothing here is a new closed vocabulary:
  // set_digital_human_style() itself still accepts any string for any
  // of the nine dimensions (see its own docstring - "never a closed
  // enum this project invents on a renderer's behalf"); this is a
  // curated starting menu layered on an open field, and a future
  // renderer capability is a one-line addition to this object, never a
  // schema migration. "posture" is the one field the renderer itself
  // branches on (buildHumanoidBody's own `seated` check), so its two
  // options are exhaustive, not merely suggested; "body"/"idle_behavior"/
  // "gesture_style" each drive a real, deterministic-not-random
  // parameter via _stableUnit(), so any two distinct values here are
  // already genuinely different on screen - these three labels are a
  // curated, discoverable starting menu, not a claim that they are
  // ordered by size or intensity.
  const DIGITAL_HUMAN_FIELD_OPTIONS = {
    posture:       ["standing", "seated"],
    body:          ["slim", "average", "broad"],
    idle_behavior: ["steady", "measured", "restless"],
    gesture_style: ["minimal", "measured", "expressive"],
    // Stage 17.13: "none" is a real, honest choice (renders nothing
    // extra), not a placeholder - it simply is not a key in
    // AVATAR_SYMBOLIC_ENVIRONMENTS below, so symbolicEnvironmentFor()
    // resolves it the identical way it resolves an unset/unrecognised
    // value: no symbol. The other two name this phase's own two real,
    // hand-authored geometries - never a promise of a future third
    // until one is actually registered there.
    symbolic_environment: ["none", "batman-emblem", "nightwing-emblem"],
    // Stage 17.14: two more genuinely rendered fields, the identical
    // "none is honest, not a placeholder" contract symbolic_environment
    // above already has. "glasses" adds real BoxGeometry lenses+bridge
    // (see buildHumanoidBody's own appearanceKey branch); "fitted"/
    // "casual" each add a real, differently-shaped clothing layer (a
    // second cylinder, plus accent-lit trim strips for "fitted" only,
    // plus widened trousers for "casual" only) - two genuinely distinct
    // silhouettes, never the same mesh relabelled.
    appearance: ["none", "glasses"],
    clothing:   ["none", "fitted", "casual"],
    // Stage 17.15: a small curated hair vocabulary, resolved through
    // AVATAR_HAIR_STYLES/avatarHairStyleFor() below - the identical
    // registry-plus-honest-fallback shape every other rendered
    // dimension in this file already uses. Unlike symbolic_environment
    // (whose honest fallback is "nothing"), the fallback here is
    // "short-neat" - the exact single shape every body already had
    // unconditionally before this stage, so an unconfigured/already-
    // saved profile looks identical to how it always did. "short-
    // textured" is a second, genuinely different hand-built shape (see
    // buildHumanoidBody's own hair block) - proof this is a real
    // vocabulary, not one shape wearing two names.
    hair_style: ["none", "short-neat", "short-textured"],
  };

  // Stage 17.12: a label override only for the one field whose auto-
  // generated ("body" -> "body") label would otherwise hide that it now
  // genuinely renders a second, independent axis - see
  // buildHumanoidBody()'s own heightScale comment. Every other field
  // still falls back to its own underscore-replaced name below - this
  // is a display-only override, never a second field name.
  const DIGITAL_HUMAN_FIELD_LABELS = {
    body: "body · proportions & height",
  };

  // Stage 17.11 (this correction pass) - static, non-interactive, never
  // merged into any real agent's data - the identical "honest ghost"
  // precedent ROADMAP above already establishes for the whole-project
  // orrery, applied here to the Avatar Studio specifically. Stage 17.14
  // removed "HAIR" and "CLOTHING RENDER" from this list - both now have
  // real geometry (see buildHumanoidBody's own hair/appearanceKey/
  // clothingKey handling) - shrinking this list is exactly as important
  // as growing it: leaving a solved gap listed here would itself be
  // dishonest, the opposite mistake this list exists to prevent.
  // Stage 17.15 renamed "FACE / HEAD SHAPE" to "FACE SHAPE VARIANTS":
  // buildHumanoidBody now genuinely draws real facial structure (nose,
  // ears, a tapered jaw - see its own comment), so the old label would
  // now be dishonest in the other direction, claiming an absence that
  // no longer exists. What is still genuinely absent is *choice* -
  // every body gets the identical single face shape, unconditionally,
  // the same "one real shape, not a fabricated catalog" restraint hair
  // used to be under before this same phase gave it a real, curated
  // vocabulary (see AVATAR_HAIR_STYLES below). "FACIAL EXPRESSION"
  // names a DIGITAL_HUMAN_STYLE_FIELDS entry that already exists and
  // already reaches this component but that buildHumanoidBody does not
  // yet draw differently (see RENDERED_STYLE_FIELDS above); "ALTERNATE
  // BODY PACKS" names AVATAR_BODY_VISUAL_ENVIRONMENTS' own real
  // extension seam (see avatarBodyEnvironmentFor()'s own comment), not
  // a promise of a specific future shape.
  const AVATAR_STUDIO_ROADMAP = ["FACE SHAPE VARIANTS", "FACIAL EXPRESSION", "ALTERNATE BODY PACKS"];

  // Stage 17.9 - a hand-kept JS mirror of src/services/identity/presence.py's
  // own PRESENTATION_INTENT_VOCABULARY (the same by-hand-mirroring precedent
  // DIGITAL_HUMAN_STYLE_FIELDS above already establishes - there is no
  // shared build step between the two languages). Read only from
  // live.avatar.intent, an already-real signal the server-side
  // PresenceRegistry asserts and clears around the one real speak() call in
  // VoiceChannel.deliver() - never invented, inspected or classified here.
  // Stage 17.10: presentation_intent_for_turn() now classifies several
  // real, already-structured turn facts (celebration, success, memory
  // recall, tool use, delegation - never any text) into "acknowledging",
  // "thinking", "emphasizing", "explaining" or "concluding", so all five
  // now have a real producer; "neutral" and "listening" remain honest,
  // tested renderer seams with none (the former is the "no evidence"
  // fallback below, the latter names the renderer's separate, pre-existing
  // LISTENING-activity behaviour, not something a speaking-window intent
  // produces). An unrecognized or absent gesture still honestly falls
  // back to "neutral"'s own multipliers (1, 1) rather than pretending
  // distinct restrained behavior nothing asserts.
  const PRESENTATION_INTENT_EFFECTS = {
    neutral:       { gestureMul: 1,    nodMul: 1    },
    explaining:    { gestureMul: 1.15, nodMul: 1    },
    emphasizing:   { gestureMul: 1.3,  nodMul: 1.2  },
    acknowledging: { gestureMul: 0.6,  nodMul: 1.6  },
    thinking:      { gestureMul: 0.55, nodMul: 0.8  },
    listening:     { gestureMul: 1,    nodMul: 1    },
    concluding:    { gestureMul: 0.8,  nodMul: 1.3  },
  };

  // ---- SURFACES -------------------------------------------------------
  const V = {};

  // Foundation Repair #5 (reconciliation audit, 2026-09-05): the
  // management verbs exposed through V.control's own "Manage" section
  // below and wired by wireControlCenterCommands(). Deliberately
  // administrative only, never "talk" or free text - see
  // scripts/serve_ui.py's own route_command docstring for why a
  // conversation stays exclusively the composer's.
  const MGMT_VERBS = [
    "status", "actions", "capabilities", "connections", "provider", "voice", "ecosystem",
  ];

  // The Control Center is an orrery: the orchestrator at the centre of the
  // composition, specialists as independent bodies around it. Not cards -
  // the arrangement itself says who orchestrates and who is autonomous.
  V.control = () => {
    const a = manager();
    const sats = specialists().map((s,i)=>{
      const n = specialists().length;
      const ang = (-90 + (360/Math.max(n,1))*i + 28) * Math.PI/180;
      const rx = 38, ry = 40;
      const left = 50 + Math.cos(ang)*rx, top = 50 + Math.sin(ang)*ry;
      return `<button class="sat" data-goto="agent" data-agent="${esc(s.name)}"
        style="left:${left}%;top:${top}%;transform:translate(-50%,-50%)">
        <div class="glass">${cut}
          <div class="nm" style="color:rgb(${identityOf(s).hue})">${esc(s.name)}</div>
          <div class="rl">${esc(shortRole(s))}</div>
          <div class="row"><span>brain</span><b><span class="dot ${esc(s.brain.indicator)}"></span> ${esc(s.brain.mode.replace(" BRAIN",""))}</b></div>
          <div class="row"><span>memory</span><b>${esc(s.memory.backend.replace("Memory",""))}</b></div>
          <div class="row"><span>voice</span><b>${s.voice.declared?esc(s.voice.key):"—"}</b></div>
          <div class="row"><span>integrations</span><b>${s.tools.length||"none"}</b></div>
          <div class="row"><span>presence</span><b><span class="pdot ${esc(s.activity||"idle")}"></span> ${s.avatar?esc(s.avatar.avatar.label):"—"}</b></div>
        </div></button>`;
    }).join("");

    const ghosts = ROADMAP.map(g=>`<span class="chip off">${esc(g)}</span>`).join("");

    return `<div class="orrery">
      <div class="satellites">${sats}</div>
      <div class="core-id">
        <h1 class="name">${esc(a.name)}</h1>
        <div class="role">${esc(shortRole(a))}</div>
        <div class="facets">

  // The room. Participants exist around the space; whoever spoke last is
  // haloed. "live" here means *spoke most recently in this transcript* - a
  // fact the snapshot carries. Stage 17 adds a second, independent fact
  // alongside it: each agent's own AgentPresence.state (idle/listening/
  // speaking), shown as a small dot on the orb - never conflated with
  // "live", which stays about transcript history, not presence.
  V.room = () => {
    const c = S.conversation;
    if(!c.available) return `<div class="slab"><h2>Conversation</h2>${absent("THE ROOM IS QUIET",c.reason)}</div>`;
    const last = c.utterances.length ? c.utterances[c.utterances.length-1].speaker : null;
    const beings = c.participants.map(p=>{
      const isMgr = S.agents.some(a=>a.name===p.name && a.is_manager);
      const cls = p.kind==="person" ? "person" : (isMgr ? "manager agent" : "agent");
      // A specialist's own identity follows it into the room - the same
      // identityOf() the graph uses, not a generic "specialist" tint.
      const id = identityOf({name:p.name, is_manager:false});
      const orbStyle = (!isMgr && p.kind!=="person")
        ? ` style="border-color:rgba(${id.hue},.42);color:rgb(${id.hue});background:radial-gradient(circle at 34% 28%,rgba(${id.hue},.2),rgba(8,12,20,.9) 68%)"`
        : "";
      const presAgent = S.agents.find(a=>a.name===p.name);
      const pstate = presAgent ? (presAgent.activity || "idle") : null;
      return `<div class="being ${cls} ${p.name===last?"live":""}">
        <div class="orb"${orbStyle}>${esc(ini(p.name))}${pstate?`<span class="pdot ${esc(pstate)}" title="${esc(pstate)}"></span>`:""}</div>
        <div class="nm">${esc(p.name)}</div>
        <div class="rl">${p.kind==="person"?"you":(isMgr?"manager":"specialist")}</div>
      </div>`;
    }).join("");

    const turns = c.utterances.length ? c.utterances.map(u=>{
      const agent = S.agents.find(a=>a.name===u.speaker);
      const self = !agent;
      const cls = self ? "self" : (agent.is_manager ? "mgr" : "");
      const whoStyle = (agent && !agent.is_manager) ? ` style="color:rgb(${identityOf(agent).hue})"` : "";
      return `<div class="turn ${cls}">
        <div class="body">
          <div class="who"${whoStyle}>${esc(u.speaker)}${u.addressed?`<span class="to">→ ${esc(u.addressed)}</span>`:""}</div>
          <p>${esc(u.text)}</p>
        </div></div>`;
    }).join("") : `<div class="void">The room is open. Nothing said yet.</div>`;

    // Stage 17.15 bug fix: this label describes only whether Alfred can
    // speak the reply back out loud (the speech OUTPUT channel) - it
    // never describes the composer <input> a few pixels to its left,
    // which is fully writable regardless. The word "read-only" here was
    // the actual root cause of a real, reported "I cannot type into the
    // input" bug: nothing about the input was ever broken (no
    // pointer-events/z-index/disabled-state/focus/listener problem - a
    // full boot-sequence execution trace against real live data found
    // none), but a person reading "read-only · unusable" printed
    // immediately beside a text box has every reason to conclude that
    // box itself is what is described. "voice unavailable" cannot be
    // misread that way.
    // Stage 17.19: the outcome, not the engine's own words. This printed
    // S.speech.describes verbatim - "unusable: no speech engine is
    // installed" - which is a correct sentence about a component and the
    // wrong sentence for the one surface a person talks to their agents
    // from. The engine, its state and that exact reason are all unchanged
    // and all still shown in Environment, which is the surface built to
    // carry them.
    const speech = S.speech.usable ? `voice · ${esc(S.speech.engine)}`
                                   : "voice unavailable · replies are text only";
    // Stage 17: who the next typed line is addressed to - an explicit
    // choice alongside the words-alone addressing this room already had.
    // Every pill names a real, already-registered agent (S.agents, the
    // same roster the orrery draws) - never a name invented here.
    const picker = S.agents.map(a=>{
      const on = a.name===selectedAgent;
      return `<button class="pick${on?" on":""}" data-pick="${esc(a.name)}"
        style="--pc:${identityOf(a).hue}">${esc(a.name)}</button>`;
    }).join("");
    // Stage 17.6A - one real digital-human body per participating agent
    // (never the person - see this stage's own brief: the human does
    // not become an avatar). Each mount is keyed by the participant's
    // own real name and reads that participant's own real avatar/state
    // off S.agents, the identical generic lookup wireAvatarBody3D()
    // already uses for the Workspace - never a second rendering path,
    // never an assumption about which agent this is.
    const humanoidBodies = c.participants.filter(p=>p.kind!=="person").map(p=>{
      const pAgent = S.agents.find(a=>a.name===p.name);
      const activity = pAgent ? (pAgent.activity||"idle") : "idle";
      const flags = [activity==="speaking"?"speaking":"", p.name===selectedAgent?"selected":""]
        .filter(Boolean).join(" ");
      return `<div class="room-body ${flags}">
        <div class="agent3d" data-avatarbody3d="${esc(p.name)}"><div class="agent3d-fallback">3D ENVIRONMENT — INITIALIZING</div></div>
        <div class="room-body-name">${esc(p.name)}</div>
      </div>`;
    }).join("");
    return `<div class="room">
      <div class="agent3d" data-room3d="core"><div class="agent3d-fallback">3D ENVIRONMENT — INITIALIZING</div></div>
      <div class="room-bodies">${humanoidBodies}</div>
      <div class="presence">${beings}</div>
      <div class="transcript">${turns}</div>
      <div class="glass say">${cut}
        <div class="who-picker">${picker}</div>
        <input class="composer" placeholder="${selectedAgent?`Speak to ${esc(selectedAgent)}…`:"Speak into the room…"}"${LIVE ? "" : " disabled"}>
        <span class="state">${speech}</span>
      </div>
    </div>`;
  };

  // A workspace is an environment belonging to one agent. It is an interface
  // INTO that agent - the brain, memory, voice and tools below are the ones
  // the agent uses everywhere else. There is no workspace brain.
  V.workspace = () => `<div class="slab">
    <h2>Workspaces</h2>
    <p class="intro">Each workspace is a view into one agent's own architecture — the same
    brain, memory, voice and grants it uses everywhere else. Nothing here is a copy, and
    an agent registered later receives this structure without a line changing.</p>
    ${S.agents.map(a=>`
      <div class="band ws-band" id="ws-${esc(a.name)}">
        <div class="agent3d" data-agent3d="${esc(a.name)}"><div class="agent3d-fallback">3D ENVIRONMENT — INITIALIZING</div></div>
        <div class="agent3d" data-avatarbody3d="${esc(a.name)}"><div class="agent3d-fallback">3D ENVIRONMENT — INITIALIZING</div></div>
        <div class="head" data-focus="${esc(a.name)}" style="cursor:pointer">${identityGlyph(a)}<span class="t">${esc(a.name)}</span>
          <span class="u">${a.is_manager?"manager":"specialist"}</span></div>
        <div class="pairs">
          <div class="pair"><div class="k">Identity</div><div class="v">${esc(a.interface?.summary||"—")}</div></div>
          <div class="pair"><div class="k">Brain</div>
            <div class="v"><span class="dot ${esc(a.brain.indicator)}"></span>${esc(a.brain.mode)}</div></div>
